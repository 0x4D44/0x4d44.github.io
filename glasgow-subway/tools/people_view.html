<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glasgow Subway - people, as the game draws them</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#3a4048}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The people exactly as the game builds them - js/sim/people.js AnimCrowd, so the hair, leg, arm and webbing fits in bodyfit.js are applied at load - and nothing
// else: no station, no train, no lights beyond a hemisphere and a sun. It is the harness behind tools/people_holes.mjs; open it by hand to look at one person.
//   people_view.html?glb=<main GLB>&lod=<LOD GLB>&forcelod=1&bg=ff00ff&tint=1
//     glb / lod   the models to load (default ../models/people.glb, ../models/people_lod.glb)
//     forcelod=1  build every person from the LOD models (what a moving person in the game is) instead of the full ones (what a standing, static one is)
//     tint=1      paint the skin red, so a hole in a garment shows as red (default on; tint=0 keeps the real textures)
//     bg          background colour, hex
// Exposes window.__spawn(id, state, frac, yaw): one person at the origin, in a mode ('stand' | 'walk' | 'sit' | ...) frozen `frac` (0..1) of the way through its clip,
// and window.__ids, __crowd, __THREE, __scene, __cam, __renderer. window.__ready turns true when loaded (window.__err holds the reason if it failed).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SU from 'three/addons/utils/SkeletonUtils.js';
import { AnimCrowd } from '../js/sim/people.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#' + (q.get('bg') || '3a4048'));
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.02, 100); cam.position.set(0, 1.0, 3.2); cam.lookAt(0, 0.95, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(3, 6, 5); scene.add(sun);
const L = new GLTFLoader(), load = (u) => new Promise((ok, no) => L.load(u, ok, undefined, no));
(async () => {
  try {
    const gltf = await load(q.get('glb') || '../models/people.glb'), lod = q.get('lod') === '0' ? null : await load(q.get('lod') || '../models/people_lod.glb');
    const pm = await (await fetch('../models/people_meta.json')).json(); gltf.meta = {}; for (const p of pm.people) gltf.meta[p.id] = p;
    const crowd = new AnimCrowd(THREE, SU, gltf, 60, 'high', lod); crowd.group = new THREE.Group(); scene.add(crowd.group);
    window.__crowd = crowd; window.__THREE = THREE; window.__scene = scene; window.__cam = cam; window.__renderer = r;
    window.__ids = crowd.chars.map((c) => c.id); window.__fit = crowd.fit;
    // The crowd picks a clip variant (which idle, which walk) from its random stream. Seed it from the person and the state, so the same person in the same state is
    // posed the same way in every run - whatever else was spawned before it, in whatever order - and two models can be compared pose for pose.
    const seeded = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); let a = h >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    window.__spawn = (id, state, frac, yaw) => {
      crowd.clear(); const ch = crowd.chars.find((c) => c.id === id); if (!ch) return null;
      crowd.rng = seeded(id + ':' + state);
      const p = crowd.add({ char: ch, x: 0, z: 0, y: 0, yaw: yaw || 0, mode: state, static: q.get('forcelod') !== '1', speed: 1.2, wait: 0 }, crowd.group);
      if (!p.obj) return null;
      if (p.cur) { p.cur.time = (frac || 0) * p.cur.getClip().duration; p.cur.paused = true; }
      p.mixer.update(0.0001);
      if (q.get('tint') !== '0') p.obj.traverse((o) => {
        if (!o.isSkinnedMesh) return; const ms = Array.isArray(o.material) ? o.material : [o.material]; if (!ms.some((m) => /^skin_/.test(m.name || ''))) return;
        const mk = (m) => { const y = m.clone(); y.map = null; y.color.set('#ff2020'); if (y.emissive) y.emissive.set('#ff2020').multiplyScalar(0.35); y.alphaTest = 0; y.transparent = false; return y; };
        o.material = Array.isArray(o.material) ? o.material.map(mk) : mk(o.material);
      });
      p.obj.position.set(0, 0, 0); p.obj.rotation.y = yaw || 0; p.obj.updateMatrixWorld(true);
      r.render(scene, cam);
      return { clip: p.cur && p.cur.getClip().name, lod: p.lod };
    };
    window.__ready = true;
  } catch (e) { window.__err = String(e && e.stack || e); window.__ready = true; }
})();
</script></body></html>
