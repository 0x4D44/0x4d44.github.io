<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector GP — World Circuit 1991</title>
<meta name="description" content="A flat-shaded polygon grand prix racing homage to the early-90s sims: 16 circuits, 13 teams, 26 drivers, FM sound, six driver aids.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2304041a'/%3E%3Cpolygon points='1,11 6,9 12,9 15,11 15,13 1,13' fill='%23f03040'/%3E%3Ccircle cx='4' cy='13' r='2' fill='%23181818'/%3E%3Ccircle cx='12' cy='13' r='2' fill='%23181818'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #04041a; overflow: hidden; }
  body {
    font-family: "Lucida Console", Monaco, monospace;
    color: #d8d8e8;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
  }
  canvas#game {
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #04041a;
  }
  /* scanline flavour */
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.13) 0 1px, transparent 1px 3px);
  }
  #menu {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #101048 0%, #04041a 75%);
    z-index: 5;
  }
  .frame {
    width: 86%; max-width: 760px; max-height: 92%;
    border: 3px double #4858c8;
    background: #080830;
    box-shadow: 0 0 0 3px #04041a, 0 0 40px #202080 inset;
    padding: 14px 18px 12px;
    display: flex; flex-direction: column;
    font-size: clamp(11px, 1.6vmin, 15px);
  }
  .mtitle {
    color: #f0d048; text-align: center; letter-spacing: 2px;
    border-bottom: 1px solid #3040a0; padding-bottom: 8px; margin-bottom: 10px;
    font-weight: bold;
  }
  .mbody { overflow-y: auto; white-space: pre-wrap; }
  .mfoot {
    color: #6878c8; text-align: center; border-top: 1px solid #3040a0;
    padding-top: 7px; margin-top: 10px; font-size: 0.85em; letter-spacing: 1px;
  }
  .mi {
    padding: 5px 10px; cursor: pointer; color: #b8c0e8;
    white-space: pre; letter-spacing: 1px;
  }
  .mi.sel { background: #2838a0; color: #ffffff; }
  .mi.sel::before { content: "\25B8 "; color: #f0d048; }
  .mi:not(.sel)::before { content: "  "; }
  .cols { display: flex; gap: 18px; }
  .cols > * { flex: 1; min-width: 0; }
  .list { max-height: 46vh; overflow-y: auto; }
  .list.tall { max-height: 60vh; }
  .preview { text-align: center; color: #98a8e0; font-size: 0.85em; line-height: 1.5; }
  .preview canvas { border: 1px solid #3040a0; background: #0a0a2a; image-rendering: pixelated; }
  .gridlist { columns: 2; column-gap: 24px; max-height: 56vh; overflow-y: auto; }
  .gr { white-space: pre; color: #a8b0d8; padding: 1px 0; font-size: 0.92em; }
  .gr.you { color: #f0d048; font-weight: bold; }
  .colh { color: #f0d048; margin: 4px 0 6px; letter-spacing: 2px; }
  .fl { color: #d060d0; margin: 8px 0; text-align: center; }
  .ctrl div { padding: 4px 0; letter-spacing: 1px; }
  .dim { color: #6878c8; }
  .swatch {
    display: inline-block; width: 0.9em; height: 0.9em; margin-right: 8px;
    border: 2px solid; vertical-align: -0.1em;
  }
  /* title screen */
  .frame.title { text-align: center; align-items: center; border-color: #c83848; }
  .biglogo {
    font-size: clamp(34px, 8vmin, 72px); font-weight: bold; letter-spacing: 6px;
    color: #f03040;
    text-shadow: 3px 3px 0 #700818, 6px 6px 0 #300410;
    margin-top: 12px;
  }
  .sub { color: #f0d048; letter-spacing: 4px; margin: 8px 0 4px; }
  .carart { margin: 4px 0; }
  .press { color: #ffffff; letter-spacing: 3px; margin: 8px 0; font-weight: bold; }
  .blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .credits { color: #5868b8; font-size: 0.75em; letter-spacing: 1px; margin-bottom: 10px; }
  #note {
    position: absolute; left: 0; right: 0; bottom: 4px; text-align: center;
    color: #384888; font-size: 10px; z-index: 6; pointer-events: none;
  }
  @media (pointer: coarse) {
    #note::after { content: "A KEYBOARD IS REQUIRED TO DRIVE — SPECTATE FREELY ON TOUCH"; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="640" height="400"></canvas>
    <div id="menu"></div>
    <div id="note"></div>
  </div>
  <script src="teams.js"></script>
  <script src="tracks.js"></script>
  <script src="game.js"></script>
</body>
</html>
