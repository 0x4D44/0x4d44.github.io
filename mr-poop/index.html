document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ient(circle at 80% 90%, rgba(0,0,0,0.04), transparent 40%),\n      var(--paper);\n    color: var(--ink);\n    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;\n    font-size: 20px;\n    line-height: 1.3;\n    overflow-x: hidden;\n  }\n\n  /* halftone dot texture overlay */\n  body::before {\n    content: \"\";\n    position: fixed;\n    inset: 0;\n    background-image: radial-gradient(rgba(0,0,0,0.08) 1px, transparent 1.4px);\n    background-size: 6px 6px;\n    pointer-events: none;\n    z-index: 1;\n    mix-blend-mode: multiply;\n  }\n\n  .page {\n    position: relative;\n    z-index: 2;\n    max-width: 1180px;\n    margin: 0 auto;\n    padding: 40px 28px 120px;\n  }\n\n  /* ---------- MASTHEAD ---------- */\n  .masthead {\n    position: relative;\n    border: 4px solid var(--ink);\n    background: var(--paper);\n    padding: 28px 32px 24px;\n    box-shadow: 8px 8px 0 var(--ink);\n    margin-bottom: 36px;\n    transform: rotate(-0.4deg);\n  }\n  .masthead .kicker {\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 14px;\n    letter-spacing: 0.25em;\n    color: var(--ink);\n    background: var(--mustard);\n    display: inline-block;\n    padding: 4px 10px;\n    border: 2px solid var(--ink);\n    transform: rotate(-1deg);\n    margin-bottom: 14px;\n  }\n  .masthead h1 {\n    font-family: 'Bangers', cursive;\n    font-size: clamp(48px, 8vw, 104px);\n    line-height: 0.92;\n    margin: 0;\n    color: var(--ink);\n    letter-spacing: 0.02em;\n    text-shadow:\n       4px 4px 0 var(--red),\n       8px 8px 0 var(--ink);\n  }\n  .masthead h1 .poop {\n    color: var(--mustard);\n    -webkit-text-stroke: 3px var(--ink);\n    text-stroke: 3px var(--ink);\n  }\n  .masthead .sub {\n    margin-top: 22px;\n    font-family: 'Patrick Hand', cursive;\n    font-size: 22px;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 16px;\n    align-items: center;\n    justify-content: space-between;\n  }\n  .price {\n    font-family: 'Bowlby One', sans-serif;\n    background: var(--red);\n    color: var(--paper);\n    padding: 6px 14px;\n    border: 2px solid var(--ink);\n    transform: rotate(2deg);\n    font-size: 16px;\n  }\n\n  /* corner stamp on masthead */\n  .stamp {\n    position: absolute;\n    right: -18px;\n    top: -22px;\n    width: 110px;\n    height: 110px;\n    border-radius: 50%;\n    border: 4px dashed var(--red);\n    color: var(--red);\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 12px;\n    line-height: 1;\n    display: grid;\n    place-content: center;\n    text-align: center;\n    transform: rotate(14deg);\n    background: rgba(251, 246, 233, 0.85);\n    padding: 8px;\n  }\n  .stamp span { display: block; font-size: 24px; margin: 2px 0; }\n\n  /* ---------- PANEL GRID ---------- */\n  .strip {\n    display: grid;\n    grid-template-columns: repeat(12, 1fr);\n    gap: 22px;\n    margin-bottom: 22px;\n  }\n  .panel {\n    position: relative;\n    background: var(--paper);\n    border: 4px solid var(--ink);\n    box-shadow: 6px 6px 0 var(--ink);\n    overflow: hidden;\n    cursor: pointer;\n    transition: transform 0.12s ease;\n    min-height: 280px;\n  }\n  .panel:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }\n  .panel:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }\n\n  .panel .scene {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    display: block;\n  }\n  .panel .label {\n    position: absolute;\n    top: 10px;\n    left: 10px;\n    background: var(--ink);\n    color: var(--paper);\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 13px;\n    letter-spacing: 0.12em;\n    padding: 4px 10px;\n    z-index: 3;\n  }\n  .panel .caption {\n    position: absolute;\n    top: 14px;\n    right: 14px;\n    background: var(--mustard);\n    border: 3px solid var(--ink);\n    padding: 8px 12px;\n    font-family: 'Patrick Hand', cursive;\n    font-size: 18px;\n    max-width: 65%;\n    line-height: 1.15;\n    z-index: 3;\n    transform: rotate(-1.5deg);\n  }\n  .panel .caption.bottom {\n    top: auto;\n    bottom: 14px;\n    right: auto;\n    left: 50%;\n    transform: translateX(-50%) rotate(0.6deg);\n    text-align: center;\n    max-width: 86%;\n    background: var(--paper);\n  }\n  .panel .tap {\n    position: absolute;\n    right: 10px;\n    bottom: 10px;\n    background: var(--red);\n    color: var(--paper);\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 11px;\n    letter-spacing: 0.1em;\n    padding: 4px 8px;\n    border: 2px solid var(--ink);\n    z-index: 3;\n    transform: rotate(-3deg);\n  }\n\n  /* speech bubbles */\n  .bubble {\n    position: absolute;\n    background: var(--paper);\n    border: 3px solid var(--ink);\n    border-radius: 22px;\n    padding: 10px 14px;\n    font-family: 'Patrick Hand', cursive;\n    font-size: 18px;\n    line-height: 1.15;\n    z-index: 4;\n    max-width: 52%;\n  }\n  .bubble.shout {\n    font-family: 'Bangers', cursive;\n    letter-spacing: 0.04em;\n    font-size: 26px;\n    background: var(--paper);\n  }\n  .bubble.think { border-style: dashed; }\n  .bubble .tail {\n    position: absolute;\n    width: 0; height: 0;\n    border-left: 14px solid transparent;\n    border-right: 14px solid transparent;\n    border-top: 22px solid var(--ink);\n  }\n  .bubble .tail::after {\n    content: \"\";\n    position: absolute;\n    top: -22px; left: -10px;\n    width: 0; height: 0;\n    border-left: 10px solid transparent;\n    border-right: 10px solid transparent;\n    border-top: 16px solid var(--paper);\n  }\n\n  /* sfx bursts */\n  .sfx {\n    position: absolute;\n    font-family: 'Bangers', cursive;\n    font-size: 44px;\n    color: var(--mustard);\n    -webkit-text-stroke: 3px var(--ink);\n    text-stroke: 3px var(--ink);\n    text-shadow: 5px 5px 0 var(--red);\n    transform: rotate(-8deg);\n    z-index: 5;\n    pointer-events: none;\n    line-height: 0.9;\n    letter-spacing: 0.02em;\n  }\n  .sfx.small { font-size: 28px; }\n  .sfx.tilt-r { transform: rotate(10deg); }\n\n  /* ---------- COL SPANS ---------- */\n  .c4 { grid-column: span 4; }\n  .c5 { grid-column: span 5; }\n  .c6 { grid-column: span 6; }\n  .c7 { grid-column: span 7; }\n  .c8 { grid-column: span 8; }\n  .c12 { grid-column: span 12; }\n  @media (max-width: 820px) {\n    .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }\n  }\n\n  /* ---------- INTRO BLOCK ---------- */\n  .intro {\n    background: var(--ink);\n    color: var(--paper);\n    border: 4px solid var(--ink);\n    box-shadow: 6px 6px 0 var(--red);\n    padding: 22px 26px;\n    margin-bottom: 36px;\n    font-family: 'Patrick Hand', cursive;\n    font-size: 22px;\n    line-height: 1.35;\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 22px;\n    align-items: center;\n  }\n  .intro .who { font-family: 'Bowlby One', sans-serif; color: var(--mustard); }\n  .intro .who.b { color: var(--teal); }\n  .intro .play {\n    background: var(--red);\n    color: var(--paper);\n    border: 3px solid var(--paper);\n    padding: 12px 18px;\n    font-family: 'Bowlby One', sans-serif;\n    letter-spacing: 0.1em;\n    cursor: pointer;\n    font-size: 15px;\n    box-shadow: 4px 4px 0 var(--mustard);\n  }\n  .intro .play:hover { transform: translate(-1px,-1px); }\n  .intro .play:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--mustard); }\n\n  /* ---------- DIVIDER ---------- */\n  .divider {\n    text-align: center;\n    margin: 30px 0;\n    font-family: 'Bangers', cursive;\n    font-size: 36px;\n    letter-spacing: 0.1em;\n    color: var(--ink);\n  }\n  .divider span {\n    display: inline-block;\n    padding: 0 14px;\n    background: var(--paper);\n    position: relative;\n  }\n  .divider::before {\n    content: \"\";\n    display: block;\n    height: 4px;\n    background: var(--ink);\n    margin: -22px 0 0;\n  }\n\n  /* ---------- FOOTER ---------- */\n  .footer {\n    margin-top: 60px;\n    border: 4px solid var(--ink);\n    box-shadow: 6px 6px 0 var(--ink);\n    background: var(--mustard);\n    padding: 22px 26px;\n    text-align: center;\n    font-family: 'Patrick Hand', cursive;\n    font-size: 20px;\n    transform: rotate(0.3deg);\n  }\n  .footer h3 {\n    font-family: 'Bangers', cursive;\n    font-size: 36px;\n    margin: 0 0 10px;\n    letter-spacing: 0.04em;\n  }\n  .footer .credits {\n    margin-top: 10px;\n    font-size: 14px;\n    opacity: 0.85;\n  }\n\n  /* sfx board for explicit clicks */\n  .sfxboard {\n    margin: 36px 0 12px;\n    background: var(--paper);\n    border: 4px solid var(--ink);\n    box-shadow: 6px 6px 0 var(--teal);\n    padding: 18px 22px;\n  }\n  .sfxboard h3 {\n    font-family: 'Bangers', cursive;\n    font-size: 32px;\n    margin: 0 0 10px;\n    letter-spacing: 0.05em;\n  }\n  .sfxboard .pad {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));\n    gap: 12px;\n    margin-top: 10px;\n  }\n  .sfxbtn {\n    background: var(--paper);\n    border: 3px solid var(--ink);\n    box-shadow: 4px 4px 0 var(--ink);\n    padding: 14px 8px;\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 16px;\n    letter-spacing: 0.06em;\n    cursor: pointer;\n    transition: transform 0.08s ease;\n  }\n  .sfxbtn:hover { transform: translate(-1px,-1px); }\n  .sfxbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }\n  .sfxbtn[data-sfx=\"boing\"] { background: var(--mustard); }\n  .sfxbtn[data-sfx=\"slurp\"] { background: var(--teal); color: var(--paper); }\n  .sfxbtn[data-sfx=\"trombone\"] { background: var(--red); color: var(--paper); }\n  .sfxbtn[data-sfx=\"honk\"] { background: var(--paper); }\n  .sfxbtn[data-sfx=\"laugh\"] { background: var(--mustard); }\n  .sfxbtn[data-sfx=\"poop\"] { background: #8b5a2b; color: var(--paper); }\n  .sfxbtn[data-sfx=\"ding\"] { background: var(--teal); color: var(--paper); }\n  .sfxbtn[data-sfx=\"kazoo\"] { background: var(--red); color: var(--paper); }\n\n  /* \"now playing\" toast */\n  #toast {\n    position: fixed;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%) translateY(80px);\n    background: var(--ink);\n    color: var(--paper);\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 14px;\n    letter-spacing: 0.1em;\n    padding: 10px 18px;\n    border: 3px solid var(--mustard);\n    z-index: 999;\n    transition: transform 0.25s ease;\n  }\n  #toast.show { transform: translateX(-50%) translateY(0); }\n\n  /* sound on / off banner */\n  .soundbanner {\n    position: sticky;\n    top: 0;\n    z-index: 50;\n    background: var(--red);\n    color: var(--paper);\n    text-align: center;\n    padding: 8px;\n    font-family: 'Bowlby One', sans-serif;\n    font-size: 14px;\n    letter-spacing: 0.12em;\n    border-bottom: 3px solid var(--ink);\n    cursor: pointer;\n  }\n  .soundbanner.armed {\n    background: var(--teal);\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"soundbanner\" id=\"soundbanner\">🔇 CLICK ANYWHERE TO TURN ON THE SOUND EFFECTS<\u002Fdiv>\n\n<div class=\"page\">\n\n  <!-- ====== MASTHEAD ====== -->\n  <header class=\"masthead\">\n    <div class=\"kicker\">BUMBLEWORTH PAPER CO. PRESENTS · ISSUE #47<\u002Fdiv>\n    <h1>THE DAY <br>DWAYNE BECAME<br><span class=\"poop\">\"MR. POOP\"<\u002Fspan><\u002Fh1>\n    <div class=\"sub\">\n      <div>A True™ Office Tragedy in 8 Panels · Scranberry Branch · A Tuesday<\u002Fdiv>\n      <div class=\"price\">5¢ &nbsp;OR&nbsp; 1 BEET<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stamp\">CERTIFIED<span>100%<\u002Fspan>HR-FREE<\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ====== INTRO ====== -->\n  <div class=\"intro\">\n    <div>\n      Meet <span class=\"who\">MARVIN STOAT<\u002Fspan>, Regional Manager and self-appointed\n      \"World's #2 Boss\" — and his loyal, beet-obsessed deputy\n      <span class=\"who b\">DWAYNE SCHMITZ<\u002Fspan>. Today, Marvin will gift Dwayne a nickname.\n      Today, Dwayne will plot revenge. Today, neither plan works.\n    <\u002Fdiv>\n    <button class=\"play\" id=\"playall\">▶ PLAY THE WHOLE THING<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"divider\"><span>★ CHAPTER ONE: THE ANNOUNCEMENT ★<\u002Fspan><\u002Fdiv>\n\n  <!-- ====== PANEL 1 ====== -->\n  <div class=\"strip\">\n    <div class=\"panel c7\" data-sfx=\"ding\" data-auto=\"ding\">\n      <div class=\"label\">01<\u002Fdiv>\n      <svg class=\"scene\" viewBox=\"0 0 700 360\" preserveAspectRatio=\"xMidYMid slice\">\n        <!-- office room -->\n        <rect x=\"0\" y=\"0\" width=\"700\" height=\"240\" fill=\"#cfe6e0\"><\u002Frect>\n        <rect x=\"0\" y=\"240\" width=\"700\" height=\"120\" fill=\"#a8784a\"><\u002Frect>\n        <!-- window -->\n        <rect x=\"40\" y=\"40\" width=\"180\" height=\"120\" fill=\"#9ec9e8\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Frect>\n        <line x1=\"130\" y1=\"40\" x2=\"130\" y2=\"160\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Fline>\n        <line x1=\"40\" y1=\"100\" x2=\"220\" y2=\"100\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Fline>\n        <!-- motivational poster -->\n        <rect x=\"270\" y=\"50\" width=\"170\" height=\"100\" fill=\"#fbf6e9\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Frect>\n        <text x=\"355\" y=\"90\" text-anchor=\"middle\" font-family=\"Bangers\" font-size=\"22\" fill=\"#e63946\">SYNERGY!<\u002Ftext>\n        <text x=\"355\" y=\"120\" text-anchor=\"middle\" font-family=\"Patrick Hand\" font-size=\"14\" fill=\"#1a1a1a\">(it's a real word now)<\u002Ftext>\n        <!-- desk -->\n        <rect x=\"80\" y=\"230\" width=\"540\" height=\"40\" fill=\"#7a4a26\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Frect>\n        <!-- Marvin behind desk: bald-ish head, big grin -->\n        <g transform=\"translate(220 110)\">\n          <!-- body -->\n          <rect x=\"0\" y=\"80\" width=\"120\" height=\"80\" fill=\"#2f5d8f\" stroke=\"#1a1a1a\" stroke-width=\"4\"><\u002Frect>\n          <!-- tie -->\n          <polygon points=\"55,80 65,80 70,150 60,160 50,150\" fill=\"#e6 ooter\">\n    <h3>NEXT ISSUE: \"THE STAPLER IN THE JELLO\" 🍮📎<\u002Fh3>\n    <div>Featuring a 47-page beet recipe addendum and Marvin's award acceptance speech for \"Best Boss (Self-Selected).\"<\u002Fdiv>\n    <div class=\"credits\">A Bumbleworth Paper Co. Comic · Written by Nobody · Drawn by SVG · Sound by your speakers · Any resemblance to actual television programs is purely a vibe.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<div id=\"toast\">♪ PLAYING ♪<\u002Fdiv>\n\n<script>\n  // ===================== Web Audio: synthesized SFX =====================\n  let actx = null;\n  let armed = false;\n\n  function ensureCtx() {\n    if (!actx) {\n      try {\n        actx = new (window.AudioContext || window.webkitAudioContext)();\n      } catch (e) { console.warn(\"no audio\", e); }\n    }\n    if (actx && actx.state === \"suspended\") actx.resume();\n    return actx;\n  }\n\n  function env(g, t0, a, d, s, r, peak) {\n    g.gain.setValueAtTime(0, t0);\n    g.gain.linearRampToValueAtTime(peak, t0 + a);\n    g.gain.linearRampToValueAtTime(s * peak, t0 + a + d);\n    g.gain.linearRampToValueAtTime(0, t0 + a + d + r);\n  }\n\n  function tone({ type = \"sine\", from, to, dur = 0.25, vol = 0.25, delay = 0, sweepCurve = \"linear\" }) {\n    const ctx = ensureCtx(); if (!ctx) return;\n    const t0 = ctx.currentTime + delay;\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n    osc.type = type;\n    osc.frequency.setValueAtTime(from, t0);\n    if (sweepCurve === \"exp\") osc.frequency.exponentialRampToValueAtTime(Math.max(0.001, to), t0 + dur);\n    else osc.frequency.linearRampToValueAtTime(to, t0 + dur);\n    env(gain, t0, 0.005, 0.02, 0.6, dur - 0.025, vol);\n    osc.connect(gain).connect(ctx.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.05);\n  }\n\n  function noiseBurst({ dur = 0.2, vol = 0.2, delay = 0, freqHi = 4000 }) {\n    const ctx = ensureCtx(); if (!ctx) return;\n    const t0 = ctx.currentTime + delay;\n    const bufferSize = Math.floor(ctx.sampleRate * dur);\n    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);\n    const data = buffer.getChannelData(0);\n    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);\n    const src = ctx.createBufferSource();\n    src.buffer = buffer;\n    const filt = ctx.createBiquadFilter();\n    filt.type = \"lowpass\";\n    filt.frequency.value = freqHi;\n    const gain = ctx.createGain();\n    env(gain, t0, 0.005, 0.04, 0.4, dur - 0.045, vol);\n    src.connect(filt).connect(gain).connect(ctx.destination);\n    src.start(t0);\n    src.stop(t0 + dur + 0.02);\n  }\n\n  const SFX = {\n    ding() {\n      tone({ type: \"sine\", from: 1760, to: 1760, dur: 0.45, vol: 0.35 });\n      tone({ type: \"triangle\", from: 2640, to: 2640, dur: 0.45, vol: 0.18 });\n    },\n    kazoo() {\n      // little 4-note fanfare\n      const notes = [392, 523, 659, 784];\n      notes.forEach((f, i) => tone({ type: \"square\", from: f, to: f, dur: 0.18, vol: 0.18, delay: i * 0.13 }));\n    },\n    boing() {\n      tone({ type: \"sine\", from: 120, to: 880, dur: 0.18, vol: 0.4, sweepCurve: \"exp\" });\n      tone({ type: \"sine\", from: 880, to: 110, dur: 0.4, vol: 0.35, delay: 0.18, sweepCurve: \"exp\" });\n    },\n    trombone() {\n      const seq = [392, 349, 311, 261]; // descending wahhh wahhh wahhh waaaahhh\n      seq.forEach((f, i) => {\n        tone({ type: \"sawtooth\", from: f * 1.05, to: f, dur: 0.32, vol: 0.22, delay: i * 0.28 });\n      });\n    },\n    slurp() {\n      // rising filtered noise\n      const ctx = ensureCtx(); if (!ctx) return;\n      const t0 = ctx.currentTime;\n      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);\n      const d = buf.getChannelData(0);\n      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (0.4 + 0.6 * i / d.length);\n      const src = ctx.createBufferSource(); src.buffer = buf;\n      const filt = ctx.createBiquadFilter(); filt.type = \"bandpass\"; filt.Q.value = 8;\n      filt.frequency.setValueAtTime(400, t0);\n      filt.frequency.exponentialRampToValueAtTime(2400, t0 + 0.5);\n      const g = ctx.createGain();\n      env(g, t0, 0.01, 0.02, 0.6, 0.5, 0.4);\n      src.connect(filt).connect(g).connect(ctx.destination);\n      src.start(t0); src.stop(t0 + 0.65);\n    },\n    honk() {\n      tone({ type: \"square\", from: 220, to: 230, dur: 0.18, vol: 0.35 });\n      tone({ type: \"square\", from: 180, to: 190, dur: 0.22, vol: 0.32, delay: 0.22 });\n    },\n    laugh() {\n      // staccato bursts at varied pitches → cartoon laughter\n      const ctx = ensureCtx(); if (!ctx) return;\n      const t0 = ctx.currentTime;\n      const pitches = [320, 380, 300, 420, 360, 480, 340, 400, 300];\n      pitches.forEach((p, i) => {\n        tone({ type: \"triangle\", from: p, to: p * 0.7, dur: 0.09, vol: 0.16, delay: i * 0.11 });\n        noiseBurst({ dur: 0.05, vol: 0.05, delay: i * 0.11 + 0.02, freqHi: 1200 });\n      });\n    },\n    poop() {\n      // sinister low tom-tom plot drumroll\n      const beats = [0, 0.18, 0.36, 0.54, 0.72, 0.96];\n      beats.forEach((d, i) => {\n        tone({ type: \"sine\", from: 110 - i * 6, to: 50, dur: 0.18, vol: 0.35, delay: d, sweepCurve: \"exp\" });\n      });\n      // gong-ish end\n      tone({ type: \"triangle\", from: 80, to: 60, dur: 0.7, vol: 0.25, delay: 1.1 });\n    },\n  };\n\n  // ===================== Banner & arming =====================\n  const banner = document.getElementById(\"soundbanner\");\n  function arm() {\n    if (armed) return;\n    ensureCtx();\n    armed = true;\n    banner.classList.add(\"armed\");\n    banner.textContent = \"🔊 SOUND IS ON — TAP ANY PANEL OR THE SFX BUTTONS\";\n    setTimeout(() => { banner.style.opacity = \"0.7\"; }, 1800);\n  }\n  banner.addEventListener(\"click\", arm);\n  document.addEventListener(\"click\", arm, { once: true });\n\n  // ===================== Toast =====================\n  const toast = document.getElementById(\"toast\");\n  let toastTimer = null;\n  function showToast(name) {\n    toast.textContent = \"♪  \" + name.toUpperCase() + \"  ♪\";\n    toast.classList.add(\"show\");\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => toast.classList.remove(\"show\"), 1100);\n  }\n\n  // ===================== Bind panels & buttons =====================\n  function play(name) {\n    const fn = SFX[name];\n    if (!fn) return;\n    ensureCtx();\n    if (!armed) arm();\n    fn();\n    showToast(name);\n  }\n\n  document.querySelectorAll(\"[data-sfx]\").forEach(el => {\n    el.addEventListener(\"click\", () => play(el.dataset.sfx));\n  });\n\n  // ===================== Play-all sequence =====================\n  document.getElementById(\"playall\").addEventListener(\"click\", () => {\n    arm();\n    const seq = [\n      [\"ding\", 0],\n      [\"kazoo\", 800],\n      [\"trombone\", 1900],\n      [\"boing\", 3400],\n      [\"laugh\", 4200],\n      [\"poop\", 5600],\n      [\"slurp\", 7200],\n      [\"honk\", 8000],\n    ];\n    seq.forEach(([n, t]) => setTimeout(() => play(n), t));\n    // also scroll thru the panels\n    const panels = document.querySelectorAll(\".panel\");\n    panels.forEach((p, i) => {\n      setTimeout(() => p.scrollIntoView({ behavior: \"smooth\", block: \"center\" }), i * 1050);\n    });\n  });\n\n  // ===================== Auto SFX on scroll-into-view =====================\n  const seen = new WeakSet();\n  const io = new IntersectionObserver((entries) => {\n    if (!armed) return; // don't autoplay before user gesture\n    entries.forEach(e => {\n      if (e.isIntersecting && !seen.has(e.target)) {\n        seen.add(e.target);\n        const which = e.target.dataset.auto || e.target.dataset.sfx;\n        if (which && SFX[which]) {\n          // tiny stagger so it doesn't pile up on first paint\n          setTimeout(() => play(which), 150);\n        }\n      }\n    });\n  }, { threshold: 0.55 });\n  document.querySelectorAll(\".panel\").forEach(p => io.observe(p));\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
