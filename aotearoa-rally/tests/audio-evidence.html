<!doctype html><html><head><meta charset="utf-8"><title>audio evidence</title></head><body>
<script type="module">
// Offline renders of short (<= 2 s) audio clips for tests/machines-audio-evidence.mjs. One clip at a time.
import { createAudio } from "/audio/audio.mjs";
import { CARS } from "/core/cars.mjs";
import { SURFACE } from "/core/surfaces.mjs";

const SR = 44100;
const wheels = (surf, slip, load = 4000) => [0, 1, 2, 3].map(() => ({ grounded: true, surf, slipRatio: slip * 0.5, slipAngle: slip, skid: slip, load, steer: 0, compression: 0.5 }));

// Each scenario: (t, spec) -> { rpm, throttle, boost, speed, gear, slip, surf, events[] } for time t in seconds.
const SCEN = {
  idle: (t, sp) => ({ rpm: sp.engine.idleRpm, throttle: 0, boost: 0, speed: 0, gear: 1 }),
  sweep: (t, sp) => { const k = Math.min(1, t / 1.9); return { rpm: sp.engine.idleRpm + (sp.engine.redline - sp.engine.idleRpm) * k, throttle: 1, boost: Math.min(1, k * 1.5), speed: 4 + 36 * k, gear: 2 }; },
  shift: (t, sp) => { const r = sp.engine.redline; return { rpm: t < 0.6 ? r * 0.9 : t < 0.85 ? r * 0.5 : r * 0.55, throttle: t < 0.6 ? 1 : t < 0.85 ? 0 : 1, boost: 0.6, speed: 30, gear: t < 0.6 ? 2 : 3, ev: [[0.6, { t: "shift", from: 2, to: 3 }]] }; },
  turbo: (t, sp) => { const r = sp.engine.redline; return { rpm: r * (t < 0.9 ? 0.7 : 0.6), throttle: t < 0.9 ? 1 : 0, boost: t < 0.9 ? 1 : Math.max(0, 1 - (t - 0.9) * 3), speed: 30, gear: 3, ev: [[1.0, { t: "wastegate" }]] }; },
  gravel: (t, sp) => ({ rpm: sp.engine.redline * 0.5, throttle: 0.6, boost: 0.3, speed: 28, gear: 3, slip: 0.5, surf: SURFACE.GRAVEL }),
  tarmac: (t, sp) => ({ rpm: sp.engine.redline * 0.5, throttle: 0.6, boost: 0.3, speed: 28, gear: 3, slip: 0.35, surf: SURFACE.TARMAC }),
  mud: (t, sp) => ({ rpm: sp.engine.redline * 0.5, throttle: 0.6, boost: 0.3, speed: 20, gear: 2, slip: 0.4, surf: SURFACE.MUD }),
  snow: (t, sp) => ({ rpm: sp.engine.redline * 0.5, throttle: 0.6, boost: 0.3, speed: 20, gear: 2, slip: 0.4, surf: SURFACE.SNOW }),
  impact: (t, sp) => ({ rpm: sp.engine.idleRpm * 1.5, throttle: 0.2, boost: 0, speed: 15, gear: 2, ev: [[0.3, { t: "impact", strength: 0.9, zone: "front", kind: "boulder" }]] }),
  codriver: () => ({ rpm: 0, throttle: 0, boost: 0, speed: 0, gear: 1, running: false, call: 0.2 }),
};

window.renderClip = async (name, car = "huia", opts = {}) => {
  const dur = Math.min(2, opts.dur || 2);
  const ctx = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const audio = createAudio({}, { ctx });
  const spec = CARS[car];
  audio.setCarSpec(spec);
  audio.setStage({ biome: "rainforest", environment: { weather: { type: "clear", intensity: 0 }, timeOfDay: 14, windStrength: 0.3 } });
  for (const m of opts.mute || []) audio.mixer[m + "Bus"].gain.value = 0;
  const st = { rpm: 0, throttle: 0, boost: 0, speed: 0, gear: 1, wheels: wheels(SURFACE.GRAVEL, 0), events: [], s: 20, damage: { engine: opts.dead ? 1 : 0 } };
  const scen = SCEN[name];
  if (!scen) throw new Error("unknown clip " + name);
  const hz = opts.hz || 30;
  const frames = Math.floor(dur * hz);
  const fired = new Set();
  let updates = 0, calls = 0;
  const errors = [];
  const step = (t) => {
    const p = scen(t, spec);
    st.rpm = p.rpm; st.throttle = p.throttle; st.boost = p.boost; st.speed = p.speed; st.gear = p.gear;
    st.wheels = wheels(p.surf ?? SURFACE.GRAVEL, p.slip || 0);
    st.s = 20 + t * p.speed;
    st.events.length = 0;
    for (const [te, ev] of p.ev || []) if (t >= te && !fired.has(te)) { fired.add(te); st.events.push(ev); }
    if (name === "codriver" && t >= 0.2 && !fired.has("c")) { fired.add("c"); audio.sfx.beepCall(ctx.currentTime); calls++; }
    audio.update(1 / hz, st, null, { cameraMode: opts.view || "chase" });
    updates++;
  };
  step(0);
  for (let f = 1; f < frames; f++) {
    const t = f / hz;
    // A throw inside the suspend callback must still resume, or the offline render never completes.
    ctx.suspend(Math.floor((t * SR) / 128) * 128 / SR).then(() => { try { step(t); } catch (e) { errors.push(String(e && e.stack || e)); } ctx.resume(); });
  }
  const t0 = performance.now();
  const buf = await ctx.startRendering();
  const ms = performance.now() - t0;
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const b64 = (a) => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); };
  if (errors.length) throw new Error("audio.update threw: " + errors[0]);
  return { sr: SR, n: L.length, renderMs: Math.round(ms), updates, calls, rpmAt: Array.from({ length: 8 }, (_, i) => SCEN[name]((i + 0.5) * dur / 8, spec).rpm), L: b64(L), R: b64(R) };
};
window.ready = true;
</script></body></html>
