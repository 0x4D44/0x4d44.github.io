<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sulzer film renderer</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>
html,body{margin:0;background:#0d1117;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#e6edf3;background:#0d1117}
#gl{position:absolute;left:0;top:0;width:1280px;height:720px}
.cv{position:absolute;background:#151b24;border:1px solid #2b3542;border-radius:12px}
#title{position:absolute;left:48px;top:28px;font-size:40px;font-weight:700;letter-spacing:-.5px;text-shadow:0 2px 12px #000}
#tsub{position:absolute;left:48px;top:78px;font-size:20px;color:#9fb0c0;text-shadow:0 2px 8px #000}
#hud{position:absolute;right:40px;top:28px;text-align:right;font:600 18px ui-monospace,Consolas,monospace;text-shadow:0 2px 8px #000}
#hud b{font-size:34px;color:#e8b84a}
#hud small{display:block;color:#9fb0c0;font-weight:400;font-size:14px}
#ctlbar{position:absolute;right:40px;top:120px;display:flex;gap:6px}
#ctlbar span{padding:5px 10px;border:1px solid #2b3542;border-radius:6px;font:600 14px ui-monospace,monospace;color:#6b7a89;background:#0d1117cc}
#ctlbar span.on{color:#0d1117;background:#e8b84a;border-color:#e8b84a}
#side{position:absolute;right:48px;top:110px;width:380px;font-size:20px;line-height:1.5}
#side .row{display:flex;justify-content:space-between;border-bottom:1px solid #2b3542;padding:8px 0}
#side .row b{font-family:ui-monospace,monospace;color:#e8b84a}
#side .row.cur{background:#e8b84a22;border-radius:6px;padding-left:8px;padding-right:8px}
#facts{position:absolute;left:48px;bottom:150px;font-size:22px;line-height:1.7;text-shadow:0 2px 10px #000}
#facts div{background:#0d1117cc;padding:2px 12px;border-left:4px solid #e8b84a;margin-bottom:6px;width:max-content}
#sub{position:absolute;left:120px;right:120px;bottom:46px;text-align:center;font-size:24px;line-height:1.35;text-shadow:0 2px 10px #000,0 0 3px #000;background:linear-gradient(#0d111700,#0d1117d0 30%);padding:26px 20px 6px}
#prog{position:absolute;left:0;bottom:0;height:5px;background:#e8b84a}
#fade{position:absolute;inset:0;background:#0d1117;pointer-events:none}
#slow{position:absolute;right:40px;top:96px;background:#0b0f14cc;padding:2px 8px;border-radius:4px;font-size:15px;color:#e8b84a;font-family:ui-monospace,monospace}
#src{position:absolute;left:48px;top:110px;width:1184px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
#src .card{background:#151b24;border:1px solid #2b3542;border-radius:12px;padding:16px 20px;font-size:20px;line-height:1.45}
#src .badge{display:inline-block;font:700 14px ui-monospace,monospace;padding:3px 10px;border-radius:6px;margin-bottom:6px;color:#0d1117}
.h{background:#46c28a}.m{background:#4aa8ff}.l{background:#f2c14e}.e{background:#ff6b3d}
#hint{position:absolute;right:48px;top:96px;font-size:16px;color:#e8b84a;font-family:ui-monospace,monospace}
</style></head><body>
<div id="stage">
<canvas id="gl" width="1280" height="720"></canvas>
<canvas id="c1" class="cv" style="display:none"></canvas>
<div id="side" style="display:none"></div>
<div id="src" style="display:none"></div>
<div id="title"></div><div id="tsub"></div><div id="slow"></div>
<div id="hud"></div><div id="ctlbar"></div><div id="facts"></div><div id="hint"></div>
<div id="sub"></div><div id="prog"></div><div id="fade"></div>
</div>
<script type="module" src="render.js"></script>
</body></html>
