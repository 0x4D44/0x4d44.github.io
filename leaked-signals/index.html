<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaked Signals</title>
<meta name="description" content="Every TV broadcast since the mid-1930s is still travelling outward at the speed of light. An interactive simulator of the expanding bubble, fan by fan, and who in the galaxy could be watching.">
<style>
:root{
  --bg:#05070d; --bg2:#0a0f1a; --panel:#0b1120; --line:#1b2740; --ink:#dfe7f5; --dim:#8a98b5; --faint:#7f8cab;
  --amber:#ffb454; --cyan:#58d6ff; --rose:#ff6b9a; --green:#7be0a0; --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{ --bg:#eef2f9; --bg2:#e2e8f3; --panel:#f7f9fd; --line:#c9d3e6; --ink:#101a2e; --dim:#4b5a78; --faint:#5f6c86; --amber:#8f5200; --cyan:#0a74a8; --rose:#c2325f; --green:#1c8a4a; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#eef2f9; --bg2:#e2e8f3; --panel:#f7f9fd; --line:#c9d3e6; --ink:#101a2e; --dim:#4b5a78; --faint:#5f6c86; --amber:#8f5200; --cyan:#0a74a8; --rose:#c2325f; --green:#1c8a4a; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--cyan)}
button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 120px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;min-height:44px}
.top h1{font-size:17px;margin:0;letter-spacing:.04em;font-weight:650}
.top h1 b{color:var(--amber)}
.top .sub{color:var(--dim);font-size:12.5px;flex:1 1 200px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;min-height:32px}
.btn:hover{border-color:var(--cyan)} .btn[aria-pressed="true"],.btn.on{background:color-mix(in srgb,var(--cyan) 18%,var(--panel));border-color:var(--cyan)}
.btn.amber{border-color:var(--amber);color:var(--amber)}
#btnTour{background:var(--amber);color:#fff;border-color:var(--amber);font-weight:600} :root[data-theme="dark"] #btnTour,:root:not([data-theme="light"]) #btnTour{color:#1a1000}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;background:rgba(5,8,16,.88);color:#ffd9a0;border:1px solid var(--amber);border-radius:999px;padding:9px 16px;font:600 14px var(--sans,system-ui);cursor:pointer;z-index:3;min-height:44px;max-width:92%}
#hint[hidden],.video #hint{display:none}
.stage:has(#caption.on) #hint{display:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;min-height:0}
@media (min-width:981px){ body{height:100vh;height:100dvh} .app{overflow:hidden;grid-template-rows:minmax(0,1fr)} .panel{overflow:hidden} .stage{min-height:0!important} }
.panel,.app{overscroll-behavior:contain}
.stage{position:relative;min-height:520px;background:radial-gradient(ellipse at 50% 45%,#0b1226 0%,#05070d 70%);overflow:hidden;touch-action:none;user-select:none}
:root[data-theme="light"] .stage{background:#05070d}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hud{position:absolute;left:12px;top:10px;font:12px var(--mono);color:#d4dff5;background:rgba(5,7,13,.55);padding:4px 8px;border-radius:6px;pointer-events:none;line-height:1.5;text-shadow:0 1px 3px #000}
#hud b{color:var(--amber);font-weight:600}
#hlNote{position:absolute;right:12px;top:12px;max-width:min(300px,46%);background:rgba(5,7,13,.82);border:1px solid #27385a;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;color:#dfe7f5;z-index:2}
#hlNote b.s{color:#4099ff}#hlNote b.e{color:#ff66e6}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;max-width:min(720px,92%);text-align:center;font-size:17px;line-height:1.35;color:#fff;
  background:rgba(5,8,16,.72);padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);opacity:0;transition:opacity .4s;pointer-events:none}
#caption.on{opacity:1}
.dock{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 10px;background:linear-gradient(transparent,rgba(5,7,13,.92) 40%);display:grid;gap:6px;color:#cfd9ee}
.dock .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dock input[type=range]{flex:1 1 140px;min-width:90px}
.dock .lab{font:12px var(--mono);color:#9fb0cf;min-width:98px}
.dock .btn{background:rgba(11,17,32,.85);color:#dfe7f5}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--dim);font-weight:560;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
#bodies{flex:1;min-height:0;display:flex;flex-direction:column}
.tabbody{padding:12px 14px 20px;overflow-y:scroll;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.tabbody::-webkit-scrollbar{width:10px}.tabbody::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px;border:2px solid var(--panel)}.tabbody::-webkit-scrollbar-track{background:transparent}
.tabbody[hidden]{display:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:16px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
p{margin:6px 0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .amber{color:var(--amber)} .cyan{color:var(--cyan)} .mono{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:3px 9px;cursor:pointer;font-size:12.5px;color:var(--dim)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,var(--bg2))}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.field{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:6px 0}
.field label{color:var(--dim);font-size:12.5px}
.field input[type=range],.field select,.field input[type=text],.field input[type=search]{width:100%;min-width:0}
select,input[type=text],input[type=search],input[type=date]{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.list{display:grid;gap:5px;margin:6px 0}
.item{border:1px solid var(--line);border-radius:9px;background:var(--bg2);padding:7px 10px;cursor:pointer;text-align:left;width:100%}
.item:hover,.item.sel{border-color:var(--amber)}
.item .t{font-weight:600} .item .m{color:var(--dim);font-size:12px}
.tag{font:11px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);margin-left:4px}
.tag.missing{color:var(--rose);border-color:var(--rose)} .tag.live{color:var(--amber);border-color:var(--amber)} .tag.ok{color:var(--green);border-color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:560}
canvas.chart{width:100%;height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:9px;display:block}
.note{font-size:12.5px;color:var(--dim);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.warn{border-left-color:var(--amber)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kpi div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.kpi b{display:block;font-size:17px;font-family:var(--mono)} .kpi span{color:var(--dim);font-size:11.5px}
.verdict{border-radius:9px;padding:8px 10px;margin:8px 0;border:1px solid var(--line);background:var(--bg2)}
.verdict.good{border-color:var(--green)} .verdict.bad{border-color:var(--rose)}
details{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--bg2);padding:6px 10px}
summary{cursor:pointer;color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
video{width:100%;border-radius:9px;background:#000;display:block}
.foot{padding:14px 16px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:0;height:64vh}
  .panel{border-left:0;border-top:1px solid var(--line)}
  #caption{font-size:13px;bottom:236px;max-width:94%}
  .dock input[type=range]{height:44px} .chip,.dock .btn,.dock select,.tabs button,#tabs button{min-height:44px}
  .top{padding-left:120px}
  header .btn,input,select,.play,#playBtn{min-height:44px}
  #hint{bottom:240px}
  #hud{left:118px;top:6px;font-size:11px;max-width:calc(100% - 126px)}
}
.dock select{color:var(--ink);background:var(--bg2)}
@media (max-width:520px){ .dock{padding:6px 8px 8px;gap:4px} .dock .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .dock .row>*{flex:0 0 auto} .dock .row input[type=range]{flex:1 0 110px} .stage{height:58vh;position:sticky;top:0;z-index:5} #caption{bottom:150px} #hint{bottom:154px} .dock .row{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px} .dock .lab{min-width:70px} .kpi{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){ #caption{transition:none} }
.video #hlNote{display:none}
.stage:has(#caption.on) #hlNote{display:none}
@media (max-width:980px){#hlNote .more{display:none}}
@media (max-width:980px){#hlNote{top:auto;bottom:236px;left:8px;right:auto;max-width:60%;font-size:11px}}
.video .top,.video .panel,.video .foot,.video .dock{display:none!important}
.video body{height:100vh} .video .app{grid-template-columns:minmax(0,1fr)} .video .stage{height:100vh;min-height:0}
.video #caption{font-size:22px;max-width:70%;bottom:44px} .video #hud{font-size:15px}
</style>
</head>
<body>
<header class="top">
  <h1>Leaked <b>Signals</b></h1>
  <span class="sub">Every TV broadcast since the mid-1930s is still on its way somewhere. Where, and who could watch?</span>
  <button class="btn amber" id="btnTour" type="button">&#9654; Guided tour</button>
  <button class="btn" id="themeBtn" type="button" aria-label="Switch light or dark theme">&#9680; Light / dark</button>
</header>
<main class="app">
  <section class="stage" id="stage" aria-label="Interactive 3D simulation of Earth's radio leakage">
    <canvas id="gl" role="img" aria-label="Wavefront point cloud of Earth's leaked TV signals in 3D"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="hud" aria-live="off"></div>
    <div id="hlNote" aria-live="polite" hidden></div>
    <button id="hint" type="button">&#9654; New here? Take the 60-second guided tour</button>
    <div id="caption" role="status" aria-live="polite"></div>
    <div class="dock" id="dock"></div>
  </section>
  <aside class="panel" id="panel">
    <nav class="tabs" role="tablist" aria-label="Simulator sections" id="tabs"></nav>
    <div id="bodies"></div>
  </aside>
</main>
<div class="foot" id="foot"></div>
<noscript><p style="padding:20px">This simulator needs JavaScript and WebGL.</p></noscript>
<script src="stars.js"></script>
<script type="module" src="app.mjs"></script>
<script defer src="/almanac-back.js"></script>
</body>
</html>
