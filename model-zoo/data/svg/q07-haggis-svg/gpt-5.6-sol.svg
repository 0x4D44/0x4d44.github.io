<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Haggis chasing a Scottish gamekeeper</title>
  <desc id="desc">An animated red-haired Scottish gamekeeper runs across a windy, heather-covered moor while a furry haggis bounds behind him.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bb7c5"/>
      <stop offset=".58" stop-color="#d7c8b1"/>
      <stop offset="1" stop-color="#e7c89b"/>
    </linearGradient>
    <linearGradient id="moor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66704f"/>
      <stop offset=".52" stop-color="#4d573b"/>
      <stop offset="1" stop-color="#293522"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#476044"/>
      <stop offset="1" stop-color="#263a2c"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9a673a"/>
      <stop offset=".48" stop-color="#714421"/>
      <stop offset="1" stop-color="#422816"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#fff1c5" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff1c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tartan" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#385b4c"/>
      <path d="M0 5h18M0 14h18" stroke="#c74f42" stroke-width="3"/>
      <path d="M5 0v18M14 0v18" stroke="#d7bc69" stroke-width="2"/>
      <path d="M0 8h18M8 0v18" stroke="#1e302b" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="rough" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .12" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <g id="heather">
      <path d="M0 32Q-3 17 1 0M0 25l-9-10M0 20l9-11M0 14l-7-8M0 10l7-7" fill="none" stroke="#354a2c" stroke-width="2" stroke-linecap="round"/>
      <g fill="#81507f">
        <circle cx="-7" cy="14" r="3"/>
        <circle cx="6" cy="9" r="3"/>
        <circle cx="-4" cy="6" r="2.6"/>
        <circle cx="1" cy="1" r="3"/>
        <circle cx="8" cy="18" r="2.4"/>
      </g>
    </g>

    <style>
      .cloud { animation: cloudDrift 28s linear infinite; }
      .cloud.slow { animation-duration: 39s; animation-delay: -13s; }
      .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2.2s ease-in-out infinite alternate; }
      .s2 { animation-delay: -.7s; animation-duration: 1.8s; }
      .s3 { animation-delay: -1.3s; animation-duration: 2.7s; }
      .mist { animation: mist 8s ease-in-out infinite alternate; }
      @keyframes cloudDrift {
        from { transform: translateX(-180px); }
        to { transform: translateX(900px); }
      }
      @keyframes sway {
        from { transform: rotate(-5deg); }
        to { transform: rotate(8deg); }
      }
      @keyframes mist {
        from { opacity:.14; transform:translateX(-18px); }
        to { opacity:.28; transform:translateX(24px); }
      }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="650" cy="120" r="116" fill="url(#sunGlow)"/>
  <circle cx="650" cy="120" r="35" fill="#f4dba5" opacity=".45"/>

  <g class="cloud" opacity=".55" fill="#eef0ed">
    <ellipse cx="20" cy="94" rx="74" ry="20"/>
    <ellipse cx="-25" cy="83" rx="38" ry="25"/>
    <ellipse cx="48" cy="79" rx="45" ry="29"/>
    <ellipse cx="94" cy="96" rx="51" ry="16"/>
  </g>
  <g class="cloud slow" opacity=".36" fill="#eef0ed">
    <ellipse cx="40" cy="184" rx="88" ry="18"/>
    <ellipse cx="1" cy="170" rx="40" ry="25"/>
    <ellipse cx="68" cy="166" rx="53" ry="29"/>
  </g>

  <path d="M0 301Q95 240 190 289Q282 215 370 285Q475 208 568 277Q673 218 800 273V405H0Z" fill="#596553"/>
  <path d="M0 326Q120 268 246 324Q356 252 468 321Q608 250 800 318V420H0Z" fill="#485643"/>
  <path d="M0 349Q160 300 316 355Q477 294 620 348Q711 316 800 338V600H0Z" fill="url(#moor)"/>

  <g class="mist" fill="#e3dfcf">
    <path d="M-20 312Q130 290 275 318T570 310T850 317V343Q680 329 520 345T210 339T-20 347Z"/>
  </g>

  <g opacity=".72">
    <g class="sway"><use href="#heather" transform="translate(35 365) scale(.8)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(93 374) scale(.65)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(150 352) scale(.9)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(225 371) scale(.7)"/></g>
    <g class="sway"><use href="#heather" transform="translate(303 347) scale(.9)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(390 367) scale(.75)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(480 349) scale(.95)"/></g>
    <g class="sway"><use href="#heather" transform="translate(558 371) scale(.7)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(642 350) scale(.85)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(730 370) scale(.75)"/></g>
    <g class="sway"><use href="#heather" transform="translate(780 345) scale(.9)"/></g>
  </g>

  <!-- Running gamekeeper -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-90 0" to="930 0" dur="8s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="510" rx="47" ry="8" fill="#172017" opacity=".35" filter="url(#shadow)">
      <animate attributeName="rx" values="42;34;42;34;42" dur=".58s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 -5;0 0" dur=".58s" repeatCount="indefinite"/>

      <!-- rear arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-36 0 401;35 0 401;-36 0 401" dur=".58s" repeatCount="indefinite"/>
        <path d="M-5 401Q-26 420-35 446" fill="none" stroke="#314632" stroke-width="13" stroke-linecap="round"/>
        <circle cx="-36" cy="448" r="7" fill="#e8b58f"/>
      </g>

      <!-- legs -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="31 0 451;-30 0 451;31 0 451" dur=".58s" repeatCount="indefinite"/>
        <path d="M-10 449Q-14 473-7 492" fill="none" stroke="#4b382e" stroke-width="14" stroke-linecap="round"/>
        <path d="M-8 491q17 3 25 10q-6 7-28 3" fill="#211b19"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-30 7 451;33 7 451;-30 7 451" dur=".58s" repeatCount="indefinite"/>
        <path d="M8 450Q18 473 11 495" fill="none" stroke="#594235" stroke-width="14" stroke-linecap="round"/>
        <path d="M10 494q18-1 28 6q-5 8-29 7" fill="#211b19"/>
      </g>

      <!-- kilt and coat -->
      <path d="M-25 424L-32 463Q0 476 31 462L23 423Z" fill="url(#tartan)" stroke="#26382d" stroke-width="3"/>
      <path d="M-24 385Q0 374 22 388L29 434Q5 447-28 431Z" fill="url(#coat)" stroke="#203126" stroke-width="3"/>
      <path d="M-20 405Q4 413 26 404" fill="none" stroke="#8b6c3f" stroke-width="5"/>
      <rect x="-24" y="419" width="51" height="8" rx="3" fill="#5b3d24"/>
      <rect x="-2" y="418" width="9" height="10" rx="2" fill="#c5a55e"/>

      <!-- satchel -->
      <path d="M-18 389Q26 410 38 447" fill="none" stroke="#563c27" stroke-width="5"/>
      <rect x="22" y="430" width="27" height="30" rx="5" fill="#735034" stroke="#3d291b" stroke-width="3"/>

      <!-- front arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="35 12 397;-30 12 397;35 12 397" dur=".58s" repeatCount="indefinite"/>
        <path d="M12 397Q30 414 39 437" fill="none" stroke="#3c553d" stroke-width="14" stroke-linecap="round"/>
        <circle cx="40" cy="439" r="7" fill="#e8b58f"/>
      </g>

      <!-- neck and head -->
      <rect x="-7" y="373" width="15" height="19" rx="6" fill="#e5ae87"/>
      <ellipse cx="1" cy="356" rx="23" ry="27" fill="#edbb96" stroke="#8f5b43" stroke-width="2"/>
      <path d="M18 352q13 5 18 12q-9 4-19 1" fill="#edbb96" stroke="#8f5b43" stroke-width="2"/>
      <path d="M-20 355Q-24 329 0 326Q20 328 21 347Q9 337 2 339Q-6 349-20 355Z" fill="#b84324"/>
      <path d="M-18 341q-12 12-5 30M-12 337q-13 17-3 35M-5 334q-9 17-1 36" fill="none" stroke="#d65a2e" stroke-width="6" stroke-linecap="round"/>
      <circle cx="13" cy="351" r="3.2" fill="#24251f"/>
      <path d="M18 374q8 3 13-3" fill="none" stroke="#843d31" stroke-width="2" stroke-linecap="round"/>

      <!-- cap -->
      <path d="M-22 334Q-7 315 18 327L15 337Q-5 330-22 338Z" fill="#324a3b" stroke="#203026" stroke-width="2"/>
      <path d="M12 330q18-3 25 4q-13 5-25 3" fill="#263b30"/>
      <path d="M-4 322q5-14 9 1" fill="none" stroke="#9d3d32" stroke-width="4"/>

      <!-- bouncing feather -->
      <path d="M4 324Q13 304 7 289Q-2 305 4 324Z" fill="#b7c08a" stroke="#52654a" stroke-width="2">
        <animate attributeName="d" values="M4 324Q13 304 7 289Q-2 305 4 324Z;M4 324Q22 307 20 292Q5 304 4 324Z;M4 324Q13 304 7 289Q-2 305 4 324Z" dur=".58s" repeatCount="indefinite"/>
      </path>

      <!-- startled breath -->
      <g fill="none" stroke="#edf0e6" stroke-width="3" stroke-linecap="round" opacity=".8">
        <path d="M38 370q15-8 24 0">
          <animate attributeName="opacity" values="0;.8;0" dur="1.1s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;18 -4" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- Chasing haggis -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-235 0" to="785 0" dur="8s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="511" rx="54" ry="9" fill="#162016" opacity=".4" filter="url(#shadow)">
      <animate attributeName="rx" values="52;38;52" dur=".46s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -17;0 0" dur=".46s" repeatCount="indefinite"/>

      <!-- haggis legs -->
      <g stroke="#4a2c17" stroke-width="10" stroke-linecap="round" fill="none">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="30 -30 478;-35 -30 478;30 -30 478" dur=".46s" repeatCount="indefinite"/>
          <path d="M-30 475q-11 17-5 31"/>
          <path d="M-39 506h15" stroke-width="7"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-32 -8 481;33 -8 481;-32 -8 481" dur=".46s" repeatCount="indefinite"/>
          <path d="M-8 478q-6 18 1 31"/>
          <path d="M-11 509H4" stroke-width="7"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-28 25 479;35 25 479;-28 25 479" dur=".46s" repeatCount="indefinite"/>
          <path d="M25 476q8 18 4 31"/>
          <path d="M25 507h16" stroke-width="7"/>
        </g>
      </g>

      <!-- furry body -->
      <path d="M-58 455Q-52 422-20 416Q8 400 38 418Q66 424 69 453Q66 484 38 491Q6 503-28 488Q-57 482-58 455Z" fill="url(#fur)" stroke="#3b2517" stroke-width="4" filter="url(#rough)"/>
      <g fill="none" stroke="#b27a45" stroke-width="3" stroke-linecap="round" opacity=".65">
        <path d="M-45 437l-11-8M-37 426l-6-12M-19 420l-2-13M5 415l4-13M29 420l9-11M49 429l13-6M55 468l14 5M35 486l7 12M5 491l1 12M-24 486l-8 11M-48 473l-13 4"/>
      </g>

      <!-- face -->
      <ellipse cx="49" cy="445" rx="25" ry="24" fill="#81502b" stroke="#3f2718" stroke-width="3"/>
      <circle cx="48" cy="438" r="8" fill="#f2e9cf"/>
      <circle cx="51" cy="438" r="3.5" fill="#171713">
        <animate attributeName="cy" values="438;436;438" dur=".46s" repeatCount="indefinite"/>
      </circle>
      <circle cx="67" cy="441" r="7" fill="#f2e9cf"/>
      <circle cx="70" cy="441" r="3.5" fill="#171713"/>
      <ellipse cx="71" cy="454" rx="9" ry="7" fill="#2a1913"/>
      <path d="M66 462q-10 12-22 3" fill="#9b3b3c" stroke="#321a16" stroke-width="3"/>
      <path d="M47 466q2 13 14 10" fill="#db6f73"/>

      <!-- horns -->
      <path d="M43 426Q35 408 48 403Q43 414 54 424" fill="#d9c38b" stroke="#5a452d" stroke-width="3"/>
      <path d="M63 425Q66 405 80 407Q68 414 73 428" fill="#d9c38b" stroke="#5a452d" stroke-width="3"/>

      <!-- tail -->
      <path d="M-55 447q-26-18-30 2q6 13 19 2" fill="none" stroke="#6e421f" stroke-width="10" stroke-linecap="round">
        <animate attributeName="d" values="M-55 447q-26-18-30 2q6 13 19 2;M-55 447q-25 17-31-3q7-12 20-1;M-55 447q-26-18-30 2q6 13 19 2" dur=".32s" repeatCount="indefinite"/>
      </path>

      <!-- speed puffs -->
      <g fill="#dedbc8" opacity=".55">
        <circle cx="-72" cy="482" r="7">
          <animate attributeName="cx" values="-65;-105" dur=".7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".6;0" dur=".7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-64" cy="470" r="5">
          <animate attributeName="cx" values="-60;-94" dur=".7s" begin="-.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".6;0" dur=".7s" begin="-.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Foreground heather -->
  <path d="M0 524Q120 499 230 526Q360 488 474 527Q640 486 800 520V600H0Z" fill="#26341f"/>
  <g>
    <g class="sway s2"><use href="#heather" transform="translate(22 520) scale(1.65)"/></g>
    <g class="sway"><use href="#heather" transform="translate(78 535) scale(1.35)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(137 512) scale(1.75)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(204 538) scale(1.25)"/></g>
    <g class="sway"><use href="#heather" transform="translate(274 510) scale(1.7)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(350 531) scale(1.4)"/></g>
    <g class="sway"><use href="#heather" transform="translate(426 508) scale(1.8)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(510 536) scale(1.3)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(584 512) scale(1.75)"/></g>
    <g class="sway"><use href="#heather" transform="translate(662 534) scale(1.35)"/></g>
    <g class="sway s2"><use href="#heather" transform="translate(731 508) scale(1.7)"/></g>
    <g class="sway s3"><use href="#heather" transform="translate(785 530) scale(1.45)"/></g>
  </g>

  <g fill="#9b6998" opacity=".65">
    <circle cx="52" cy="570" r="5"/>
    <circle cx="112" cy="548" r="4"/>
    <circle cx="186" cy="580" r="6"/>
    <circle cx="250" cy="557" r="4"/>
    <circle cx="324" cy="575" r="5"/>
    <circle cx="403" cy="550" r="5"/>
    <circle cx="480" cy="582" r="6"/>
    <circle cx="547" cy="558" r="4"/>
    <circle cx="620" cy="575" r="5"/>
    <circle cx="694" cy="550" r="5"/>
    <circle cx="763" cy="581" r="6"/>
  </g>
</svg>