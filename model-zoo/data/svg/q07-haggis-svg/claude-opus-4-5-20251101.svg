<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Heather gradient -->
    <linearGradient id="moorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="60%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#556B2F"/>
    </linearGradient>
    
    <!-- Heather flower pattern -->
    <pattern id="heatherPattern" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="30" height="30" fill="#556B2F"/>
      <circle cx="5" cy="5" r="3" fill="#9932CC" opacity="0.7"/>
      <circle cx="20" cy="12" r="2" fill="#8B008B" opacity="0.6"/>
      <circle cx="10" cy="25" r="3" fill="#9932CC" opacity="0.7"/>
      <circle cx="25" cy="22" r="2" fill="#DA70D6" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="350" fill="url(#moorGrad)"/>
  
  <!-- Rolling hills -->
  <ellipse cx="200" cy="380" rx="300" ry="100" fill="#6B8E23"/>
  <ellipse cx="600" cy="400" rx="350" ry="120" fill="#556B2F"/>
  <ellipse cx="400" cy="420" rx="500" ry="100" fill="url(#heatherPattern)"/>
  
  <!-- Moor ground -->
  <rect x="0" y="400" width="800" height="200" fill="url(#heatherPattern)"/>
  
  <!-- Scattered heather flowers -->
  <g>
    <circle cx="100" cy="450" r="4" fill="#9932CC"/>
    <circle cx="250" cy="480" r="3" fill="#8B008B"/>
    <circle cx="400" cy="460" r="4" fill="#DA70D6"/>
    <circle cx="550" cy="490" r="3" fill="#9932CC"/>
    <circle cx="700" cy="470" r="4" fill="#8B008B"/>
    <circle cx="150" cy="520" r="3" fill="#DA70D6"/>
    <circle cx="350" cy="540" r="4" fill="#9932CC"/>
    <circle cx="600" cy="530" r="3" fill="#8B008B"/>
  </g>
  
  <!-- Sun -->
  <circle cx="700" cy="80" r="40" fill="#FFD700"/>
  
  <!-- Gamekeeper group -->
  <g id="gamekeeper">
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 600,0; 0,0" dur="8s" repeatCount="indefinite"/>
    
    <!-- Running legs animation -->
    <g>
      <!-- Left leg -->
      <line x1="120" y1="420" x2="110" y2="470" stroke="#2F4F4F" stroke-width="6">
        <animate attributeName="x2" values="110;130;110" dur="0.3s" repeatCount="indefinite"/>
      </line>
      <!-- Right leg -->
      <line x1="130" y1="420" x2="140" y2="470" stroke="#2F4F4F" stroke-width="6">
        <animate attributeName="x2" values="140;120;140" dur="0.3s" repeatCount="indefinite"/>
      </line>
      <!-- Boots -->
      <ellipse cx="110" cy="475" rx="8" ry="5" fill="#654321">
        <animate attributeName="cx" values="110;130;110" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="140" cy="475" rx="8" ry="5" fill="#654321">
        <animate attributeName="cx" values="140;120;140" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Body/Kilt -->
    <rect x="105" y="380" width="40" height="45" fill="#006400"/>
    <rect x="100" y="410" width="50" height="30" fill="#228B22"/>
    <!-- Kilt pattern -->
    <line x1="110" y1="410" x2="110" y2="440" stroke="#FFD700" stroke-width="2"/>
    <line x1="125" y1="410" x2="125" y2="440" stroke="#FFD700" stroke-width="2"/>
    <line x1="140" y1="410" x2="140" y2="440" stroke="#FFD700" stroke-width="2"/>
    
    <!-- Arms running -->
    <line x1="110" y1="390" x2="90" y2="410" stroke="#FFE4C4" stroke-width="5">
      <animate attributeName="x2" values="90;80;90" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="390" x2="160" y2="380" stroke="#FFE4C4" stroke-width="5">
      <animate attributeName="x2" values="160;170;160" dur="0.3s" repeatCount="indefinite"/>
    </line>
    
    <!-- Head -->
    <circle cx="125" cy="365" r="20" fill="#FFE4C4"/>
    
    <!-- Red hair -->
    <ellipse cx="125" cy="350" rx="22" ry="12" fill="#CD5C5C"/>
    <ellipse cx="115" cy="355" rx="8" ry="10" fill="#B22222"/>
    <ellipse cx="135" cy="355" rx="8" ry="10" fill="#B22222"/>
    <ellipse cx="125" cy="345" rx="15" ry="8" fill="#DC143C"/>
    
    <!-- Face -->
    <circle cx="118" cy="362" r="3" fill="#000"/>
    <circle cx="132" cy="362" r="3" fill="#000"/>
    <ellipse cx="125" cy="375" rx="6" ry="3" fill="#FF6347"/>
    
    <!-- Cap -->
    <ellipse cx="125" cy="342" rx="18" ry="6" fill="#2F4F4F"/>
    <circle cx="125" cy="335" r="5" fill="#FF6347"/>
  </g>
  
  <!-- Haggis group -->
  <g id="haggis">
    <animateTransform attributeName="transform" type="translate" 
      values="-80,0; 520,0; -80,0" dur="8s" repeatCount="indefinite"/>
    
    <!-- Main haggis body - furry brown oval -->
    <ellipse cx="80" cy="450" rx="35" ry="25" fill="#8B4513"/>
    
    <!-- Fur texture -->
    <ellipse cx="80" cy="450" rx="30" ry="20" fill="#A0522D"/>
    <ellipse cx="75" cy="445" rx="20" ry="12" fill="#8B4513"/>
    
    <!-- Fur strands -->
    <line x1="50" y1="445" x2="45" y2="440" stroke="#654321" stroke-width="2"/>
    <line x1="55" y1="450" x2="48" y2="448" stroke="#654321" stroke-width="2"/>
    <line x1="52" y1="455" x2="46" y2="458" stroke="#654321" stroke-width="2"/>
    <line x1="110" y1="445" x2="118" y2="442" stroke="#654321" stroke-width="2"/>
    <line x1="108" y1="455" x2="115" y2="458" stroke="#654321" stroke-width="2"/>
    
    <!-- Little legs (one side shorter - traditional!) -->
    <line x1="60" y1="465" x2="55" y2="480" stroke="#654321" stroke-width="4">
      <animate attributeName="x2" values="55;60;55" dur="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="75" y1="468" x2="70" y2="478" stroke="#654321" stroke-width="4">
      <animate attributeName="x2" values="70;75;70" dur="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="468" x2="95" y2="480" stroke="#654321" stroke-width="4">
      <animate attributeName="x2" values="95;90;95" dur="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="465" x2="108" y2="482" stroke="#654321" stroke-width="4">
      <animate attributeName="x2" values="108;103;108" dur="0.2s" repeatCount="indefinite"/>
    </line>
    
    <!-- Eyes (fierce!) -->
    <circle cx="100" cy="440" r="6" fill="white"/>
    <circle cx="102" cy="440" r="3" fill="#000"/>
    <circle cx="90" cy="438" r="5" fill="white"/>
    <circle cx="92" cy="438" r="2.5" fill="#000"/>
    
    <!-- Angry eyebrows -->
    <line x1="85" y1="432" x2="94" y2="435" stroke="#654321" stroke-width="2"/>
    <line x1="96" y1="434" x2="108" y2="432" stroke="#654321" stroke-width="2"/>
    
    <!-- Snout/nose -->
    <ellipse cx="110" cy="448" rx="8" ry="6" fill="#A0522D"/>
    <ellipse cx="113" cy="448" rx="4" ry="3" fill="#2F1810"/>
    
    <!-- Bouncing animation for whole haggis -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="0.2s" repeatCount="indefinite" additive="sum"/>
  </g>
  
  <!-- Distant mountains -->
  <polygon points="0,350 100,280 200,350" fill="#4A4A4A" opacity="0.5"/>
  <polygon points="150,350 280,250 400,350" fill="#5A5A5A" opacity="0.4"/>
  <polygon points="350,350 500,270 650,350" fill="#4A4A4A" opacity="0.5"/>
  <polygon points="550,350 700,290 800,350" fill="#5A5A5A" opacity="0.4"/>
  
  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="150" cy="100" rx="50" ry="25" fill="white">
      <animate attributeName="cx" values="150;170;150" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="90" rx="40" ry="20" fill="white">
      <animate attributeName="cx" values="180;200;180" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="120" rx="60" ry="30" fill="white">
      <animate attributeName="cx" values="450;430;450" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="110" rx="45" ry="22" fill="white">
      <animate attributeName="cx" values="500;480;500" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>