<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b6e0ff"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6b8a3d"/>
      <stop offset="1" stop-color="#4b5e2b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Distant hills -->
  <g>
    <path d="M0 320 C120 260 220 280 340 240 C460 200 580 260 800 220 L800 600 L0 600 Z" fill="#8fbf7c" opacity="0.9"/>
    <path d="M0 360 C100 300 240 340 360 300 C480 260 640 320 800 280 L800 600 L0 600 Z" fill="#6ea65a" opacity="0.85"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(40,60)">
      <ellipse cx="0" cy="0" rx="36" ry="18"/>
      <ellipse cx="30" cy="-6" rx="28" ry="14"/>
      <ellipse cx="60" cy="2" rx="24" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="40 60" to="900 60" dur="45s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(200,100)">
      <ellipse cx="0" cy="0" rx="30" ry="14"/>
      <ellipse cx="28" cy="-4" rx="22" ry="11"/>
      <ellipse cx="-18" cy="-6" rx="18" ry="9"/>
      <animateTransform attributeName="transform" type="translate" from="200 100" to="-300 100" dur="60s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(560,50)">
      <ellipse cx="0" cy="0" rx="40" ry="20"/>
      <ellipse cx="36" cy="-6" rx="30" ry="15"/>
      <ellipse cx="-30" cy="6" rx="26" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="560 50" to="-400 50" dur="50s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Moor foreground (heather and grass) -->
  <g id="moor">
    <rect x="0" y="420" width="800" height="180" fill="url(#ground)"/>
    <!-- patches of heather: many small shapes with slight sways -->
    <g id="heather" fill="#8b3f9b" stroke="#6e2e72" stroke-width="0.6" filter="url(#soft)" opacity="0.95">
      <!-- Repeated small heather clusters with different offsets and animations -->
      <g transform="translate(30,490)">
        <path d="M0 0 c6 -10 18 -14 26 -6 c8 8 10 20 -6 22 c-10 1 -20 -6 -20 -16 z"/>
        <path d="M20 -4 c6 -8 12 -10 18 -4 c6 6 6 14 -4 16 c-7 1 -16 -4 -14 -12 z" transform="translate(14,-8)"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -6 0 0; 0 0 0; 4 0 0; 0 0 0" dur="6s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(90,470)">
        <path d="M0 0 c8 -12 22 -14 28 -6 c6 8 6 18 -8 20 c-12 2 -24 -6 -20 -14 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 5 0 0; 0 0 0; -4 0 0; 0 0 0" dur="7s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(150,500)">
        <path d="M0 0 c6 -9 16 -12 22 -6 c6 6 8 16 -2 18 c-10 2 -18 -6 -20 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -4 0 0; 0 0 0; 3 0 0; 0 0 0" dur="5.5s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(210,485)">
        <path d="M0 0 c10 -14 24 -14 34 -6 c10 8 8 20 -8 22 c-14 2 -28 -6 -26 -16 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 6 0 0; 0 0 0; -5 0 0; 0 0 0" dur="8s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(280,495)">
        <path d="M0 0 c6 -9 16 -12 22 -6 c6 6 8 16 -2 18 c-8 2 -18 -4 -20 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -3 0 0; 0 0 0; 3 0 0; 0 0 0" dur="6.5s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(350,482)">
        <path d="M0 0 c8 -10 20 -12 26 -6 c6 6 6 16 -4 18 c-10 2 -20 -6 -22 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 4 0 0; 0 0 0; -3 0 0; 0 0 0" dur="7.5s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(430,500)">
        <path d="M0 0 c10 -14 26 -14 34 -6 c8 8 6 20 -8 22 c-14 2 -28 -6 -26 -16 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -5 0 0; 0 0 0; 4 0 0; 0 0 0" dur="6.2s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(520,492)">
        <path d="M0 0 c6 -9 16 -12 22 -6 c6 6 8 16 -2 18 c-8 2 -18 -4 -20 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 3 0 0; 0 0 0; -3 0 0; 0 0 0" dur="5.8s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(600,488)">
        <path d="M0 0 c8 -10 20 -12 26 -6 c6 6 6 16 -4 18 c-10 2 -20 -6 -22 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -4 0 0; 0 0 0; 4 0 0; 0 0 0" dur="7.1s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(680,496)">
        <path d="M0 0 c6 -9 16 -12 22 -6 c6 6 8 16 -2 18 c-8 2 -18 -4 -20 -12 z"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 5 0 0; 0 0 0; -4 0 0; 0 0 0" dur="6.7s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Gamekeeper (red-headed) group: moves left->right across moor -->
  <g id="keeper" transform="translate(-180,350)">
    <!-- horizontal motion -->
    <animateTransform attributeName="transform" type="translate" from="-180 350" to="1000 350" dur="14s" repeatCount="indefinite"/>

    <!-- subtle bobbing up and down (added to movement) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 -6; 0 0" dur="1.2s" repeatCount="indefinite" additive="sum"/>

      <!-- body -->
      <g transform="translate(0,0)">
        <ellipse cx="40" cy="60" rx="26" ry="34" fill="#5a6a39" stroke="#3f4a26" stroke-width="2"/>
        <!-- shoulders and coat -->
        <rect x="10" y="35" width="60" height="30" rx="8" ry="8" fill="#6b8c3f" stroke="#3f4a26" stroke-width="1.6"/>
        <!-- collar -->
        <path d="M32 43 L40 28 L48 43 Z" fill="#3f4a26"/>
        <!-- head -->
        <g transform="translate(40,16)">
          <circle cx="0" cy="0" r="14" fill="#ffd9b6" stroke="#b77a56" stroke-width="1"/>
          <!-- red hair cap -->
          <path d="M-14 -2 C-12 -12 -4 -18 0 -18 C6 -18 14 -12 18 -2 Z" fill="#d9442a"/>
          <!-- simple facial features -->
          <circle cx="-4" cy="-1" r="1.6" fill="#422815"/>
          <circle cx="4" cy="-1" r="1.6" fill="#422815"/>
          <path d="M-4 6 Q0 9 4 6" stroke="#6a3b2a" stroke-width="1" fill="none" stroke-linecap="round"/>
        </g>

        <!-- arms -->
        <rect x="-8" y="46" width="24" height="8" rx="4" ry="4" fill="#6b8c3f" transform="rotate(-12 4 50)"/>
        <rect x="64" y="46" width="24" height="8" rx="4" ry="4" fill="#6b8c3f" transform="rotate(8 76 50)"/>

        <!-- legs: grouped so we can rotate about the hip -->
        <g transform="translate(28,96)">
          <g id="leg-left" transform="translate(0,0)">
            <rect x="-6" y="0" width="12" height="28" rx="3" ry="3" fill="#3a2f20" />
            <rect x="-9" y="26" width="18" height="8" rx="3" fill="#20160f"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="-30 0 0; 28 0 0; -30 0 0" repeatCount="indefinite"/>
          </g>
          <g id="leg-right" transform="translate(24,0)">
            <rect x="-6" y="0" width="12" height="28" rx="3" ry="3" fill="#3a2f20" />
            <rect x="-9" y="26" width="18" height="8" rx="3" fill="#20160f"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="28 0 0; -30 0 0; 28 0 0" repeatCount="indefinite"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Haggis: round creature chasing (slightly faster) -->
  <g id="haggis" transform="translate(-320,380)">
    <!-- faster horizontal motion to 'chase' -->
    <animateTransform attributeName="transform" type="translate" from="-320 380" to="1000 380" dur="11s" repeatCount="indefinite"/>

    <!-- small bounce to emphasize running -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0; 0 -6; 0 0" dur="0.9s" repeatCount="indefinite" additive="sum"/>

      <!-- haggis body -->
      <g transform="translate(0,0)">
        <ellipse cx="48" cy="40" rx="46" ry="30" fill="#7b4f2e" stroke="#57341f" stroke-width="2.2"/>
        <!-- shaggy top -->
        <path d="M8 32 c8 -14 16 -20 22 -16 c6 4 8 6 18 4 c10 -2 18 2 26 12 c-18 -6 -36 -4 -62 -0z" fill="#633623" opacity="0.95"/>
        <!-- face patch -->
        <ellipse cx="30" cy="38" rx="10" ry="6" fill="#3f2719" opacity="0.7"/>
        <!-- stubby legs: four little legs with running animation -->
        <g transform="translate(14,62)">
          <g transform="translate(0,0)">
            <rect x="-3" y="0" width="6" height="14" rx="3" fill="#2b1b12"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="-30 0 0; 20 0 0; -30 0 0" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(34,66)">
          <g transform="translate(0,0)">
            <rect x="-3" y="0" width="6" height="14" rx="3" fill="#2b1b12"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="20 0 0; -30 0 0; 20 0 0" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(64,64)">
          <g transform="translate(0,0)">
            <rect x="-3" y="0" width="6" height="14" rx="3" fill="#2b1b12"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="-20 0 0; 26 0 0; -20 0 0" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(84,60)">
          <g transform="translate(0,0)">
            <rect x="-3" y="0" width="6" height="14" rx="3" fill="#2b1b12"/>
            <animateTransform attributeName="transform" dur="0.45s" type="rotate" values="26 0 0; -18 0 0; 26 0 0" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- little face details -->
        <circle cx="36" cy="36" r="3.2" fill="#ffe6c9"/>
        <circle cx="40" cy="36" r="1.2" fill="#2a170f"/>
      </g>
    </g>
  </g>

  <!-- A faint trail of footprints for the chasing motion -->
  <g opacity="0.28" fill="#3a2b20">
    <ellipse cx="120" cy="475" rx="6" ry="4"/>
    <ellipse cx="200" cy="470" rx="6" ry="4"/>
    <ellipse cx="300" cy="468" rx="6" ry="4"/>
    <ellipse cx="380" cy="466" rx="6" ry="4"/>
    <ellipse cx="460" cy="463" rx="6" ry="4"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="420 0" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- gentle sun glow near horizon -->
  <radialGradient id="sun" cx="50%" cy="40%" r="30%">
    <stop offset="0" stop-color="#fff1c2" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#ffd39a" stop-opacity="0.0"/>
  </radialGradient>
  <circle cx="620" cy="180" r="120" fill="url(#sun)" opacity="0.25"/>

  <!-- ground texture overlay -->
  <g opacity="0.12" fill="#000000">
    <circle cx="120" cy="520" r="2"/>
    <circle cx="180" cy="500" r="1.5"/>
    <circle cx="220" cy="540" r="1.6"/>
    <circle cx="320" cy="510" r="1.7"/>
    <circle cx="420" cy="530" r="1.3"/>
    <circle cx="540" cy="520" r="1.4"/>
  </g>
</svg>