  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.72" stop-color="#d9f0ff"/>
      <stop offset="1" stop-color="#f4e7c8"/>
    </linearGradient>
    <linearGradient id="moor" x1="0" y1="370" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d8b4c"/>
      <stop offset="0.55" stop-color="#4d6c35"/>
      <stop offset="1" stop-color="#2f4b27"/>
    </linearGradient>
    <radialGradient id="haggisFur" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9b6641"/>
      <stop offset="0.65" stop-color="#684024"/>
      <stop offset="1" stop-color="#3b2417"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <g id="heather">
      <path d="M0 0 C-2 -13 3 -22 0 -34" fill="none" stroke="#2f5c2c" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-5" cy="-22" r="3.2" fill="#8b4aa8"/>
