    </g>
    <style>
      .mist { opacity:.28; }
      .heather-sway { transform-box: fill-box; transform-origin: bottom center; animation: sway 3.2s ease-in-out infinite; }
      .heather-sway:nth-of-type(2n) { animation-duration: 2.7s; }
      .heather-sway:nth-of-type(3n) { animation-duration: 3.9s; }
      .dust { animation: dust 1s ease-out infinite; }
      .dust.d2 { animation-delay:.25s; }
      .dust.d3 { animation-delay:.5s; }
      @keyframes sway {
        0%,100% { transform: rotate(-2deg); }
        50% { transform: rotate(3deg); }
      }
      @keyframes dust {
        0% { opacity:.55; transform: scale(.45); }
        100% { opacity:0; transform: translate(-34px,-12px) scale(1.55); }
      }
    </style>
