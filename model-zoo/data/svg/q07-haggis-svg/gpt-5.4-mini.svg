<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec7ff"/>
      <stop offset="70%" stop-color="#d7efff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="moor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6d35"/>
      <stop offset="100%" stop-color="#425126"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f8450"/>
      <stop offset="100%" stop-color="#3f5229"/>
    </linearGradient>
    <linearGradient id="haggisBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b6a46"/>
      <stop offset="55%" stop-color="#6e5439"/>
      <stop offset="100%" stop-color="#533f2c"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203a2f"/>
      <stop offset="100%" stop-color="#13251d"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb0a0"/>
      <stop offset="100%" stop-color="#d87463"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="heatherSprig" d="M0 0 C-3 -10,-5 -18,-2 -28 C0 -20,1 -13,3 -7 C5 -15,9 -21,14 -26 C11 -17,9 -11,8 -3 C15 -7,22 -7,28 -4 C20 -2,14 1,9 7 C15 11,18 17,18 24 C13 18,8 14,2 12 C-1 18,-5 23,-10 27 C-8 19,-6 12,-4 5 C-11 9,-17 12,-25 12 C-17 7,-11 2,-6 -5 C-14 -5,-19 -8,-24 -13 C-16 -11,-9 -9,0 0Z"/>
    <g id="heather">
      <use href="#heatherSprig" fill="#6b2d8a" opacity="0.95"/>
      <use href="#heatherSprig" fill="#8b46ad" opacity="0.45" transform="translate(8 -2) scale(0.75)"/>
    </g>

    <g id="gamekeeper">
      <g filter="url(#softShadow)">
        <ellipse cx="0" cy="82" rx="28" ry="9" fill="#000" opacity="0.25"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.7s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="0" rx="18" ry="20" fill="url(#cheek)"/>
          <path d="M-22 -11 C-20 -31, 20 -31, 22 -10 C18 -16, 13 -19, 0 -19 C-12 -19,-18 -16,-22 -11Z" fill="#9b3d23"/>
          <path d="M-13 -17 C-9 -33, 10 -32, 16 -18 C10 -22, 0 -23,-13 -17Z" fill="#cf6b2f"/>
          <circle cx="-6" cy="-1" r="2.3" fill="#1d1d1d"/>
          <circle cx="7" cy="-1" r="2.3" fill="#1d1d1d"/>
          <path d="M-4 8 Q0 11 4 8" stroke="#7c2b1b" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M-31 7 Q-19 0 -11 2" stroke="#ffe4d9" stroke-width="2" fill="none" opacity="0.7"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 2; 0 0" dur="0.7s" repeatCount="indefinite"/>
          <path d="M-24 24 C-10 10, 10 10, 24 24 L18 68 C8 76,-8 76,-18 68Z" fill="url(#coat)"/>
          <path d="M-8 30 L-26 52" stroke="#4e6d5d" stroke-width="6" stroke-linecap="round"/>
          <path d="M8 30 L26 54" stroke="#4e6d5d" stroke-width="6" stroke-linecap="round"/>
          <path d="M-11 72 L-18 104" stroke="#2d2117" stroke-width="8" stroke-linecap="round"/>
          <path d="M11 72 L18 104" stroke="#2d2117" stroke-width="8" stroke-linecap="round"/>
          <path d="M-16 103 H-26" stroke="#2d2117" stroke-width="8" stroke-linecap="round"/>
          <path d="M16 103 H26" stroke="#2d2117" stroke-width="8" stroke-linecap="round"/>
          <path d="M-6 24 H6" stroke="#b8e0d6" stroke-width="2" opacity="0.6"/>
        </g>
      </g>
      <animateMotion dur="9s" repeatCount="indefinite" path="M720 430 C650 410, 570 390, 500 405 C445 418, 400 445, 350 448 C295 451, 240 420, 200 418 C150 414, 100 434, 50 440"/>
    </g>

    <g id="haggis">
      <g filter="url(#softShadow)">
        <ellipse cx="0" cy="52" rx="26" ry="9" fill="#000" opacity="0.22"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.55s" repeatCount="indefinite"/>
          <path d="M-48 -4 C-32 -25, 30 -25, 48 -4 C56 8, 54 38, 44 50 C31 66,-30 66,-44 50 C-55 37,-57 7,-48 -4Z" fill="url(#haggisBody)" stroke="#3e2d1f" stroke-width="2"/>
          <path d="M-35 2 C-22 -12, 0 -13, 14 -3 C25 3, 34 14, 37 29 C26 21,10 15,-4 17 C-18 19,-30 28,-40 39 C-42 26,-41 13,-35 2Z" fill="#9c7b54" opacity="0.28"/>
          <circle cx="-16" cy="12" r="4" fill="#1f140f"/>
          <circle cx="14" cy="12" r="4" fill="#1f140f"/>
          <path d="M-10 27 Q0 34 10 27" stroke="#20140f" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M-18 47 L-22 63" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M-2 48 L-4 66" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M13 48 L17 64" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M29 45 L36 60" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M-21 66 H-31" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M-5 67 H-15" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M11 66 H1" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M28 63 H18" stroke="#3f2b1b" stroke-width="8" stroke-linecap="round"/>
          <path d="M-49 9 C-63 3,-68 -7,-65 -16" stroke="#3e2d1f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M48 9 C63 3,68 -7,65 -16" stroke="#3e2d1f" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
      </g>
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" path="M40 450 C110 430, 190 415, 260 425 C325 435, 375 430, 430 414 C490 395, 545 390, 600 406 C650 421, 700 432, 760 438"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="220" cy="145" rx="185" ry="95" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="585" cy="130" rx="235" ry="110" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="120" cy="200" rx="75" ry="35" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="680" cy="185" rx="100" ry="40" fill="#ffffff" opacity="0.35"/>

  <path d="M0 290 C120 220, 240 230, 340 260 C430 288, 520 250, 620 224 C700 204, 760 212, 800 230 L800 600 L0 600 Z" fill="url(#hill)"/>
  <path d="M0 330 C115 290, 210 295, 315 320 C415 344, 505 318, 600 294 C690 272, 740 276, 800 294 L800 600 L0 600 Z" fill="url(#moor)"/>

  <g opacity="0.95">
    <use href="#heather" transform="translate(40 520) scale(1.1)"/>
    <use href="#heather" transform="translate(95 492) scale(0.9)"/>
    <use href="#heather" transform="translate(160 535) scale(1.25)"/>
    <use href="#heather" transform="translate(230 500) scale(1.0)"/>
    <use href="#heather" transform="translate(300 528) scale(1.15)"/>
    <use href="#heather" transform="translate(370 494) scale(0.95)"/>
    <use href="#heather" transform="translate(445 532) scale(1.2)"/>
    <use href="#heather" transform="translate(520 505) scale(1.0)"/>
    <use href="#heather" transform="translate(590 540) scale(1.18)"/>
    <use href="#heather" transform="translate(660 498) scale(0.92)"/>
    <use href="#heather" transform="translate(730 530) scale(1.15)"/>
    <use href="#heather" transform="translate(20 448) scale(0.8)"/>
    <use href="#heather" transform="translate(120 430) scale(0.75)"/>
    <use href="#heather" transform="translate(210 454) scale(0.85)"/>
    <use href="#heather" transform="translate(320 438) scale(0.78)"/>
    <use href="#heather" transform="translate(420 452) scale(0.82)"/>
    <use href="#heather" transform="translate(540 435) scale(0.76)"/>
    <use href="#heather" transform="translate(640 450) scale(0.8)"/>
    <use href="#heather" transform="translate(720 440) scale(0.75)"/>
  </g>

  <g opacity="0.18">
    <path d="M0 560 C120 540, 220 560, 320 548 C430 535, 520 545, 620 534 C700 525, 750 530, 800 522 L800 600 L0 600 Z" fill="#000"/>
  </g>

  <g>
    <use href="#haggis"/>
    <use href="#gamekeeper"/>
  </g>
</svg>