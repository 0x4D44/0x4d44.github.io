<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Haggis Chase</title>
  <desc id="desc">A shaggy wild haggis bounds after a red-haired Scottish gamekeeper across a purple, heather-covered Highland moor.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#b7d5d7"/>
      <stop offset="1" stop-color="#f5e5c8"/>
    </linearGradient>
    <linearGradient id="moor" x2=".2" y2="1">
      <stop stop-color="#76806a"/>
      <stop offset=".5" stop-color="#77705d"/>
      <stop offset="1" stop-color="#3c514b"/>
    </linearGradient>
    <radialGradient id="fur" cx=".35" cy=".25" r=".8">
      <stop stop-color="#bb9060"/>
      <stop offset=".65" stop-color="#88603d"/>
      <stop offset="1" stop-color="#553d2b"/>
    </radialGradient>
    <pattern id="tartan" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#36594b"/>
      <path d="M0 6H24M0 19H24" stroke="#1c3836" stroke-width="6"/>
      <path d="M6 0V24M19 0V24" stroke="#203d3a" stroke-width="6"/>
      <path d="M0 12H24M12 0V24" stroke="#b1a061" stroke-width="1.4"/>
      <path d="M0 2H24M2 0V24" stroke="#9b5147" stroke-width="1.5"/>
    </pattern>
    <g id="heather">
      <path d="M0 0Q-3-14-10-24M0 0Q7-16 5-31M0 0L16-21" fill="none" stroke="#465b47" stroke-width="2"/>
      <g fill="#a36397">
        <ellipse cx="-10" cy="-24" rx="4" ry="7"/>
        <ellipse cx="-6" cy="-16" rx="4" ry="6"/>
        <ellipse cx="5" cy="-30" rx="4" ry="7"/>
        <ellipse cx="5" cy="-21" rx="4" ry="6"/>
        <ellipse cx="15" cy="-21" rx="4" ry="7"/>
      </g>
      <g fill="#d194b8">
        <circle cx="-11" cy="-27" r="2"/>
        <circle cx="4" cy="-33" r="2"/>
        <circle cx="15" cy="-24" r="2"/>
      </g>
    </g>
    <g id="grass">
      <path d="M0 0L-9-15M0 0L-2-23M0 0L8-17" fill="none" stroke="#b0ad7a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <style>
      .cloud { animation: cloud 24s ease-in-out infinite alternate; }
      .chase { animation: chase 4s ease-in-out infinite; }
      .keeper-bob { animation: bob .44s ease-in-out infinite; }
      .beast-bob { animation: bound .44s ease-in-out infinite; }
      .leg-a { animation: stride .44s ease-in-out infinite; }
      .leg-b { animation: stride .44s ease-in-out infinite reverse; }
      .arm-a { animation: arm .44s ease-in-out infinite; }
      .arm-b { animation: arm .44s ease-in-out infinite reverse; }
      .tail { animation: wag .44s ease-in-out infinite; }
      .heather { animation: sway 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
      .heather-late { animation-delay: -1.4s; }
      .dust { animation: dust .88s ease-out infinite; }
      .dust-late { animation-delay: -.44s; }
      .hat { animation: hat .44s ease-in-out infinite; }
      @keyframes cloud { to { transform: translateX(34px); } }
      @keyframes chase { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(16px); } }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-11px) rotate(-1deg); } }
      @keyframes bound { 0%,100% { transform: translateY(-9px) rotate(-3deg); } 50% { transform: translateY(3px) rotate(3deg); } }
      @keyframes stride { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(36deg); } }
      @keyframes arm { 0%,100% { transform: rotate(-27deg); } 50% { transform: rotate(30deg); } }
      @keyframes wag { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(22deg); } }
      @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }
      @keyframes dust { 0% { opacity: .5; transform: translate(10px,0) scale(.6); } 100% { opacity: 0; transform: translate(-48px,-17px) scale(1.5); } }
      @keyframes hat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(5deg); } }
    </style>
  </defs>

  <!-- A broad Highland sky and distant glens. -->
  <path fill="url(#sky)" d="M0 0H800V600H0z"/>
  <circle cx="650" cy="112" r="48" fill="#fff1c7" opacity=".75"/>
  <g class="cloud" fill="#fff9e9" opacity=".6">
    <path d="M46 110c10-18 34-21 48-11 4-24 43-28 56-6 25-8 47 3 54 17z"/>
    <path d="M418 73c12-16 35-18 47-4 15-27 52-22 61 2 21-7 41 2 45 12H410z"/>
  </g>
  <path d="M0 289L82 198l43 43 94-121 86 109 47-38 95 103 72-75 54 39 78-107 77 115 72-54v160H0z" fill="#829b9a"/>
  <path d="M126 241l93-121 86 109-61-38-23-39-28 51zM573 258l78-107 77 115-56-37-22-49-25 41z" fill="#d3d8c6" opacity=".65"/>
  <path d="M0 307q112-88 224-26t212 11q130-65 364 4v101H0z" fill="#718b80"/>
  <path d="M260 318q98-24 199 3l162 18-322 23-110-8z" fill="#bacbc0" opacity=".75"/>
  <path d="M0 358q125-60 282 5t290-16q106-37 228-3v256H0z" fill="url(#moor)"/>
  <path d="M0 396q175-54 369 27t431-30v70q-205 61-417-5T0 449z" fill="#8a7380" opacity=".58"/>
  <path d="M0 491q151-66 324-9t476-13v131H0z" fill="#536451"/>
  <path d="M0 521q191-34 363 10t437-1" fill="none" stroke="#71806a" stroke-width="22" opacity=".5"/>

  <!-- Heather scattered through the middle distance. -->
  <g opacity=".65">
    <use href="#heather" transform="translate(35 386) scale(.65)"/>
    <use href="#heather" transform="translate(95 363) scale(.5)"/>
    <use href="#heather" transform="translate(161 392) scale(.65)"/>
    <use href="#heather" transform="translate(377 376) scale(.55)"/>
    <use href="#heather" transform="translate(424 401) scale(.7)"/>
    <use href="#heather" transform="translate(673 369) scale(.6)"/>
    <use href="#heather" transform="translate(736 394) scale(.8)"/>
    <use href="#heather" transform="translate(777 376) scale(.5)"/>
  </g>
  <g fill="#b68ba4" opacity=".55">
    <ellipse cx="69" cy="407" rx="32" ry="5"/>
    <ellipse cx="347" cy="393" rx="24" ry="4"/>
    <ellipse cx="689" cy="415" rx="39" ry="6"/>
    <ellipse cx="179" cy="365" rx="20" ry="3"/>
  </g>

  <g class="chase">
    <ellipse cx="270" cy="463" rx="75" ry="10" fill="#273c36" opacity=".23"/>
    <ellipse cx="542" cy="463" rx="64" ry="9" fill="#273c36" opacity=".22"/>
    <g transform="translate(201 453)" fill="#d5c4a0">
      <g class="dust"><ellipse rx="15" ry="5"/><circle cx="-18" cy="-6" r="5"/></g>
    </g>
    <g transform="translate(479 457)" fill="#d5c4a0">
      <g class="dust dust-late"><ellipse rx="14" ry="5"/><circle cx="-16" cy="-7" r="4"/></g>
    </g>

    <!-- The wild haggis: shaggy, stout, and thoroughly determined. -->
    <g transform="translate(263 399)">
      <g class="beast-bob" stroke="#513d2b" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(-35 21)">
          <g class="leg-b">
            <path d="M0 0L-5 29l10 8" fill="none" stroke="#614b33" stroke-width="12"/>
            <path d="M-1 37H13" stroke-width="9"/>
          </g>
        </g>
        <g transform="translate(29 23)">
          <g class="leg-a">
            <path d="M0 0L-4 26l10 8" fill="none" stroke="#614b33" stroke-width="11"/>
            <path d="M1 34H16" stroke-width="8"/>
          </g>
        </g>
        <g transform="translate(-58 -2)">
          <path class="tail" d="M0 0q-26-4-23-21 11 1 11 9" fill="none" stroke="#795537" stroke-width="8"/>
        </g>
        <path d="M-63 0l-5-12 9-3-4-12 13 1 1-13 12 3 7-13 10 6 10-10 10 8 12-7 8 11 13-2 5 10 14 2 2 12 10 6-5 12 7 12-10 9 1 13-14 2-5 11-13-3-10 8-10-6-12 5-9-8-14 2-5-10-13-4 2-11-10-8z" fill="url(#fur)" stroke-width="2.5"/>
        <path d="M-42-22l5 10m12-23 4 12m14-13 2 11m15-9 2 10M-49 1l7 9m14-13 5 10m13-11 5 12m14-9 5 10M-31 23l5 8m13-12 5 10m12-8 5 9" fill="none" stroke="#d0a575" stroke-width="3" opacity=".7"/>
        <path d="M29-27q-13-26 1-25 15 4 11 25" fill="#8c6240" stroke-width="2"/>
        <path d="M30-32q-5-13 0-14l6 14" fill="#c99276" stroke="none"/>
        <ellipse cx="43" cy="-8" rx="24" ry="26" fill="#a57a4c" stroke-width="2"/>
        <ellipse cx="59" cy="5" rx="18" ry="13" fill="#c49a6a" stroke-width="2"/>
        <ellipse cx="72" cy="2" rx="8" ry="7" fill="#4c392c" stroke="none"/>
        <ellipse cx="46" cy="-18" rx="9" ry="11" fill="#fff6de" stroke-width="1.5"/>
        <circle cx="50" cy="-17" r="4" fill="#25382f" stroke="none"/>
        <circle cx="51" cy="-19" r="1.5" fill="white" stroke="none"/>
        <path d="M38-32l15 3M48 17q9 5 17-1" fill="none" stroke-width="2.5"/>
        <path d="M59 20q2 12 9 9 4-3 1-11" fill="#cf7e77" stroke-width="1.5"/>
        <g transform="translate(-27 30)">
          <g class="leg-a">
            <path d="M0 0l1 23 10 6" fill="none" stroke="#906b43" stroke-width="13"/>
            <path d="M5 30H20" stroke-width="9"/>
          </g>
        </g>
        <g transform="translate(33 29)">
          <g class="leg-b">
            <path d="M0 0l4 23 10 5" fill="none" stroke="#906b43" stroke-width="12"/>
            <path d="M9 29H23" stroke-width="9"/>
          </g>
        </g>
      </g>
    </g>

    <!-- A gamekeeper in tweed, tartan, gaiters, and flying red hair. -->
    <g transform="translate(535 354)">
      <g class="keeper-bob" stroke="#2d4239" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <g transform="translate(-12 2)">
          <g class="leg-b">
            <path d="M0 0l-8 39 14 37" fill="none" stroke="#d3ad87" stroke-width="17"/>
            <path d="M-7 42l11 30" fill="none" stroke="#a8a185" stroke-width="19"/>
            <path d="M-5 69l16-4 8 17 17 5q6 10-5 10H8z" fill="#493e31"/>
            <path d="M-10 44l14-5m-11 12 14-5" stroke="#6a7360" stroke-width="3"/>
          </g>
        </g>
        <g transform="translate(14 2)">
          <g class="leg-a">
            <path d="M0 0l-3 40 12 36" fill="none" stroke="#e1bb91" stroke-width="17"/>
            <path d="M-2 43l10 28" fill="none" stroke="#b9b093" stroke-width="19"/>
            <path d="M0 70l16-5 7 18 18 5q6 10-5 10H12z" fill="#4f4435"/>
            <path d="M-6 45l15-5m-12 12 15-5" stroke="#6a7360" stroke-width="3"/>
          </g>
        </g>

        <g transform="translate(5 -53)">
          <g class="arm-b">
            <path d="M0 0l-28 23-26-13" fill="none" stroke="#465d48" stroke-width="18"/>
            <path d="M-54 10l-9-3" fill="none" stroke="#e4b58a" stroke-width="12"/>
            <path d="M-67 7l-6-6m7 8-8 1" stroke="#e4b58a" stroke-width="5"/>
          </g>
        </g>

        <path d="M-20-13L25-14 34 16Q8 26-27 14z" fill="url(#tartan)"/>
        <path d="M-13 0l-4 15M0 0l-1 20M13 0l3 20M25 0l5 16" opacity=".45"/>
        <path d="M2-75q16-7 31 9l-8 55q-24 9-46-3l9-42z" fill="#637052"/>
        <path d="M4-72l6 19 13-14M10-53L2-15" fill="none" stroke="#a3a180"/>
        <path d="M-17-18q20 7 42 0l-1 9q-21 5-44-1z" fill="#463e30"/>
        <rect x="2" y="-17" width="11" height="9" rx="1" fill="#c4ab68"/>
        <path d="M-5-5q13-3 17 8l-3 19q-9 8-18-1z" fill="#a18359"/>
        <path d="M-3 2l10 2" stroke="#d5bd8b"/>
        <circle cx="17" cy="-40" r="2" fill="#d5bd8b" stroke="none"/>
        <path d="M-9-34l-3 11 12 2 3-11z" fill="#526349"/>

        <path d="M13-76l3-18 20 4-6 20" fill="#e7b58c"/>
        <path d="M7-119q17-18 35-2l1 16 10 9-10 5q-2 15-17 13l-15-9z" fill="#edbf95"/>
        <path d="M10-117l-9 9 7 3-6 9 12-2 2 13 9-7-3-18 13-6 4-11z" fill="#c55a2a" stroke="#8e482c" stroke-width="2"/>
        <path d="M27-91q8-7 16-1l-1 11-10 5-9-7" fill="#c55a2a" stroke="#8e482c" stroke-width="1.5"/>
        <path d="M22-98q-7-9-9 0 0 6 7 6" fill="#e4a47b" stroke-width="1.5"/>
        <ellipse cx="36" cy="-106" rx="5" ry="6" fill="#fff7e3" stroke-width="1.2"/>
        <circle cx="34" cy="-106" r="2.5" fill="#273d36" stroke="none"/>
        <path d="M30-115l11 2M36-86l6-1" fill="none" stroke-width="2"/>
        <g class="hat">
          <path d="M2-120q-2-20 20-23 22-2 29 18l-14 7z" fill="url(#tartan)"/>
          <path d="M-2-121q20-6 51-5l10 5q-27 8-60 5z" fill="#3b5142"/>
          <circle cx="23" cy="-144" r="5" fill="#934b37"/>
          <path d="M7-137q-9-17-4-23 9 5 9 19" fill="#baa774" stroke-width="1.5"/>
        </g>

        <g transform="translate(23 -58)">
          <g class="arm-a">
            <path d="M0 0l26 17 19-27" fill="none" stroke="#687756" stroke-width="19"/>
            <path d="M38-4l12-11" stroke="#d9d2aa" stroke-width="6"/>
            <path d="M47-13l5-8q6-7 11-1l-2 11-8 5z" fill="#edbf95"/>
            <path d="M59-23l5-5m-3 9 7-3" fill="none" stroke="#edbf95" stroke-width="5"/>
          </g>
        </g>
        <path d="M-16-61l-12 44" stroke="#b5a077" stroke-width="5"/>
        <path d="M-35-24q-16 0-14 19l3 21 23 1 6-29z" fill="#94794f"/>
        <path d="M-47-11l27 3-5 13-20-2z" fill="#af9060"/>
        <circle cx="-34" cy="0" r="2" fill="#d2ba85"/>
      </g>
    </g>
    <g fill="none" stroke="#eee1bf" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M155 394h34m-21 12h16M424 326h37m-25 12h18"/>
    </g>
  </g>

  <!-- Foreground flowers frame the chase. -->
  <g class="heather">
    <use href="#heather" transform="translate(59 527) scale(1.55)"/>
    <use href="#heather" transform="translate(86 532) scale(1.15)"/>
  </g>
  <g class="heather heather-late">
    <use href="#heather" transform="translate(706 524) scale(1.6)"/>
    <use href="#heather" transform="translate(746 539) scale(1.35)"/>
  </g>
  <g opacity=".9">
    <use href="#heather" transform="translate(151 570) scale(1.2)"/>
    <use href="#heather" transform="translate(362 554) scale(.9)"/>
    <use href="#heather" transform="translate(624 574) scale(1.35)"/>
    <use href="#grass" transform="translate(28 559)"/>
    <use href="#grass" transform="translate(216 514)"/>
    <use href="#grass" transform="translate(444 568) scale(1.2)"/>
    <use href="#grass" transform="translate(779 583) scale(1.3)"/>
  </g>
  <g fill="#85917a">
    <path d="M257 549q15-15 29 1z"/>
    <path d="M649 501q14-12 26 1z"/>
    <path d="M102 463q10-10 23 1z"/>
  </g>

  <g text-anchor="middle" fill="#354e48" font-family="Georgia, 'Times New Roman', serif">
    <text x="400" y="55" font-size="14" letter-spacing="5">A HIGHLAND MISADVENTURE</text>
    <text x="400" y="94" font-size="33" font-weight="bold" letter-spacing="2">THE GREAT HAGGIS CHASE</text>
    <path d="M283 111h91m52 0h91" stroke="#617b6d" stroke-width="1"/>
    <path d="M400 106l5 5-5 5-5-5z" fill="#886c82"/>
  </g>
</svg>