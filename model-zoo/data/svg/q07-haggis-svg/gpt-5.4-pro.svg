<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600">
  <title>Animated haggis chasing a Scottish gamekeeper across a heather moor</title>
  <desc>A looping animated SVG showing a shaggy haggis pursuing a red-haired Scottish gamekeeper over a purple-heather-covered moor.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd2ff"/>
      <stop offset="65%" stop-color="#dbe8ff"/>
      <stop offset="100%" stop-color="#efd4e4"/>
    </linearGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#91a4b6"/>
      <stop offset="100%" stop-color="#6f7f91"/>
    </linearGradient>

    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e9076"/>
      <stop offset="100%" stop-color="#5f6d59"/>
    </linearGradient>

    <linearGradient id="moor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8760"/>
      <stop offset="55%" stop-color="#5f6946"/>
      <stop offset="100%" stop-color="#4f4056"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff5bd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff5bd" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haggisFur" cx="58%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a87445"/>
      <stop offset="100%" stop-color="#5a3826"/>
    </radialGradient>

    <pattern id="tartan" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#2f6b42"/>
      <path d="M0 4H16M0 12H16M4 0V16M12 0V16" stroke="#7e3c3c" stroke-width="3" opacity="0.8"/>
      <path d="M0 8H16M8 0V16" stroke="#d8c56b" stroke-width="1.2" opacity="0.9"/>
    </pattern>

    <g id="heather">
      <path d="M0 0C0-18-1-34 0-48M0 0C4-14 8-28 12-38M0 0C-4-14-8-25-13-35M0 0C8-11 15-20 20-28M0 0C-8-11-15-20-20-29" fill="none" stroke="#5d7d42" stroke-width="2" stroke-linecap="round"/>
      <g fill="#8d4ba5">
        <circle cx="0" cy="-49" r="4.2"/>
        <circle cx="4" cy="-45" r="3.8"/>
        <circle cx="-4" cy="-45" r="3.8"/>
        <circle cx="12" cy="-39" r="3.4"/>
        <circle cx="17" cy="-31" r="3.2"/>
        <circle cx="-12" cy="-36" r="3.4"/>
        <circle cx="-18" cy="-28" r="3.2"/>
        <circle cx="20" cy="-28" r="3.1"/>
      </g>
      <g fill="#c992d7" opacity="0.75">
        <circle cx="2" cy="-48" r="1.8"/>
        <circle cx="14" cy="-38" r="1.5"/>
        <circle cx="-10" cy="-35" r="1.5"/>
        <circle cx="-16" cy="-27" r="1.3"/>
      </g>
    </g>

    <path id="keeperPath" d="M-140 432C90 405 200 448 342 430S620 397 910 426"/>
    <path id="haggisPath" d="M-240 446C0 420 120 466 278 440S572 408 850 442"/>

    <style><![CDATA[
