    <use xlink:href="#heather" transform="translate(90 432) scale(0.5)"/>
    <use xlink:href="#heather" transform="translate(160 426) scale(0.48)"/>
    <use xlink:href="#heather" transform="translate(228 435) scale(0.54)"/>
    <use xlink:href="#heather" transform="translate(295 425) scale(0.46)"/>
    <use xlink:href="#heather" transform="translate(360 432) scale(0.52)"/>
    <use xlink:href="#heather" transform="translate(428 422) scale(0.47)"/>
    <use xlink:href="#heather" transform="translate(500 430) scale(0.51)"/>
