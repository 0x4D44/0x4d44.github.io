      <circle cx="23.4" cy="-26" r="1.4" fill="#171717"/>
      <path d="M17-32Q24-35 29-32" fill="none" stroke="#2c1a12" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="44" cy="-15" rx="8.5" ry="7" fill="#7b4c30"/>
      <circle cx="50" cy="-16" r="3.3" fill="#1d1514"/>
      <path d="M34-12Q42-8 48-12" fill="none" stroke="#2c1a12" stroke-width="2" stroke-linecap="round"/>

      <g transform="translate(10 -16)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="18 0 0;-18 0 0;18 0 0" dur="0.4s" repeatCount="indefinite"/>
          <path d="M0 0L0 8L0 16" class="limb" stroke="#4a2c1d" stroke-width="5.5"/>
          <path d="M0 16L7 16" class="limb" stroke="#4a2c1d" stroke-width="5.5"/>
        </g>
      </g>

      <g transform="translate(26 -16)">
        <g>
