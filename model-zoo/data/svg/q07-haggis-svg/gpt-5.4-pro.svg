      <g transform="translate(9 -38)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-24 0 0;26 0 0;-24 0 0" dur="0.45s" repeatCount="indefinite"/>
          <path d="M0 0L2 18L0 38" class="limb" stroke="#e6d5b2" stroke-width="6"/>
