      <path d="M-20-106Q2-115 20-100L17-72Q2-66-16-70L-24-82Z" fill="#54793b" stroke="#2d4e21" stroke-width="2"/>
      <path d="M-24-72L20-72L25-38Q2-24-28-38Z" fill="url(#tartan)" stroke="#2d4e21" stroke-width="2"/>
      <path d="M-23-70H21" stroke="#2d4e21" stroke-width="2"/>
      <ellipse cx="-1" cy="-48" rx="6" ry="8" fill="#5f4633"/>
      <circle cx="-1" cy="-48" r="1.3" fill="#d8c7a5"/>
      <circle cx="-2" cy="-92" r="2.2" fill="#d8e0c8"/>
      <circle cx="4" cy="-84" r="2.2" fill="#