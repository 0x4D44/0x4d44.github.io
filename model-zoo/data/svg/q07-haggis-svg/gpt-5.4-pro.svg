  <path class="ridge" d="M0 454C122 432 233 470 350 450S599 437 800 458"/>
  <path class="ridge" d="M0 486C134 469 244 497 363 480S613 468 800 488"/>
  <path class="ridge" d="M0 520C121 506 266 530 386 516S635 500 800 522"/>

  <g opacity="0.85">
