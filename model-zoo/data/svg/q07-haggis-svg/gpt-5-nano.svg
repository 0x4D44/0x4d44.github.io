<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6d9ff"/>
      <stop offset="100%" stop-color="#78c6d8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d7f4a"/>
      <stop offset="100%" stop-color="#2f5a25"/>
    </linearGradient>
    <linearGradient id="haggisBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5e3a"/>
      <stop offset="100%" stop-color="#6a4025"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun (soft) -->
  <circle cx="700" cy="120" r="60" fill="#fff" opacity="0.15"/>

  <!-- Far hills (soft green) -->
  <path d="M-40,360 C120,320 260,360 420,340 C520,328 700,360 860,340 L860,420 L-40,420 Z" fill="#4a8b3a" opacity="0.45"/>

  <!-- Heather moor (purple tufts) -->
  <g fill="#8A2BE2" opacity="0.95">
    <ellipse cx="60" cy="480" rx="8" ry="14"/>
    <ellipse cx="100" cy="492" rx="6" ry="12"/>
    <ellipse cx="140" cy="470" rx="9" ry="16"/>
    <ellipse cx="190" cy="492" rx="7" ry="14"/>
    <ellipse cx="240" cy="476" rx="8" ry="14"/>
    <ellipse cx="300" cy="490" rx="7" ry="12"/>
    <ellipse cx="360" cy="470" rx="6" ry="14"/>
    <ellipse cx="420" cy="488" rx="9" ry="16"/>
    <ellipse cx="480" cy="470" rx="7" ry="14"/>
    <ellipse cx="540" cy="492" rx="8" ry="14"/>
    <ellipse cx="600" cy="476" rx="6" ry="12"/>
  </g>

  <!-- Ground / moor base -->
  <rect y="320" width="800" height="280" fill="url(#ground)"/>

  <!-- Gentle foreground ridge to imply depth -->
  <path d="M0,360 C120,380 240,360 360,372 C480,384 640,360 800,370 L800,460 L0,460 Z" fill="#3b6a2a" opacity=".25"/>

  <!-- Haggis (left, behind) -->
  <g id="haggis" transform="translate(40,320)">
    <!-- body (stylized capsule) -->
    <ellipse cx="100" cy="40" rx="72" ry="28" fill="url(#haggisBody)"/>

    <!-- small head hints (left/top) -->
    <ellipse cx="60" cy="12" rx="28" ry="18" fill="#7a4c2e"/>

    <!-- simple eye -->
    <circle cx="52" cy="6" r="3" fill="#000"/>

    <!-- simple legs (static for motion feel) -->
    <rect x="30" y="58" width="18" height="26" rx="4" fill="#5a3d26"/>
    <rect x="66" y="58" width="18" height="26" rx="4" fill="#5a3d26"/>

    <!-- subtle shadow under haggis -->
    <ellipse cx="100" cy="72" rx="40" ry="8" fill="#000" opacity="0.15"/>

    <!-- run animation: moves right across the moor, then back, looping -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 520,0; 0,0" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Keeper (right, red-headed) -->
  <g id="keeper" transform="translate(600,320)">
    <!-- coat / torso -->
    <rect x="0" y="40" width="68" height="90" rx="12" fill="#2e8b57"/>

    <!-- head -->
    <circle cx="34" cy="18" r="22" fill="#f1c8a2"/>

    <!-- red hair / cap (distinctive) -->
    <path d="M16,22 q18,-22 36,-6 q-3,6 -14,12 q-8,-4 -22,-6 z" fill="#d44a2f"/>

    <!-- eyes -->
    <circle cx="26" cy="14" r="3" fill="#000"/>
    <circle cx="42" cy="14" r="3" fill="#000"/>

    <!-- arms (simple) -->
    <rect x="0" y="52" width="14" height="40" rx="4" fill="#f1c8a2" transform="rotate(-5 7 72)"/>
    <rect x="54" y="52" width="14" height="40" rx="4" fill="#f1c8a2" transform="rotate(6 61 72)"/>

    <!-- legs / boots -->
    <rect x="10" y="120" width="20" height="18" rx="3" fill="#3b6e2b"/>
    <rect x="38" y="120" width="20" height="18" rx="3" fill="#3b6e2b"/>

    <!-- carrying shadow -->
    <ellipse cx="34" cy="136" rx="28" ry="8" fill="#000" opacity="0.15"/>

    <!-- left-right movement to imply chase pace -->
    <animateTransform attributeName="transform" type="translate" values="0,0; -520,0; 0,0" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Optional decorative wind wisps on moor via faint horizontal motion (SMIL) -->
  <g fill="#bfbfbf" opacity="0.25">
    <path d="M120,360 l20,-4" stroke="#bfbfbf" stroke-width="2" fill="none"/>
    <path d="M260,370 l26,-6" stroke="#bfbfbf" stroke-width="2" fill="none"/>
  </g>

  <!-- Small time-based shimmer on the moor to imply wind (subtle) -->
  <animateTransform xlink:href="#sun" attributeName="transform" type="rotate" from="0 700 120" to="360 700 120" dur="60s" repeatCount="indefinite" />

</svg>