<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">

  <!-- Background sky -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec0ee"/>
      <stop offset="60%" stop-color="#b0e0ff"/>
      <stop offset="100%" stop-color="#e4f7ff"/>
    </linearGradient>
    <linearGradient id="moorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d6b39"/>
      <stop offset="100%" stop-color="#26331d"/>
    </linearGradient>
    <radialGradient id="heatherFlower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3f5"/>
      <stop offset="60%" stop-color="#d470c7"/>
      <stop offset="100%" stop-color="#8a3a7b"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="350" fill="url(#skyGrad)"/>
  <rect x="0" y="350" width="800" height="250" fill="url(#moorGrad)"/>

  <!-- Distant hills -->
  <path d="M0 360 Q150 320 300 360 T600 360 T800 360 V350 H0 Z" fill="#46623a"/>
  <path d="M0 380 Q200 330 400 380 T800 380 V360 H0 Z" fill="#3d5631" opacity="0.9"/>

  <!-- Heather patches -->
  <g id="heather-clump">
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#352a47"/>
    <circle cx="-10" cy="-6" r="5" fill="url(#heatherFlower)"/>
    <circle cx="0" cy="-8" r="6" fill="url(#heatherFlower)"/>
    <circle cx="10" cy="-5" r="4.5" fill="url(#heatherFlower)"/>
  </g>

  <g opacity="0.9">
    <use href="#heather-clump" x="80" y="420"/>
    <use href="#heather-clump" x="150" y="390" transform="scale(1.2)"/>
    <use href="#heather-clump" x="260" y="440"/>
    <use href="#heather-clump" x="360" y="410" transform="scale(1.1)"/>
    <use href="#heather-clump" x="460" y="430"/>
    <use href="#heather-clump" x="560" y="395" transform="scale(1.3)"/>
    <use href="#heather-clump" x="670" y="425"/>
    <use href="#heather-clump" x="720" y="400" transform="scale(1.1)"/>
  </g>

  <!-- Simple clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="50" ry="22"/>
    <ellipse cx="175" cy="85" rx="35" ry="18"/>
    <ellipse cx="110" cy="95" rx="30" ry="15"/>

    <ellipse cx="520" cy="70" rx="50" ry="22"/>
    <ellipse cx="555" cy="65" rx="35" ry="18"/>
    <ellipse cx="490" cy="75" rx="30" ry="15"/>
  </g>

  <!-- Ground path for characters -->
  <path id="runPath" d="M 50 430 C 250 400 550 420 750 410" fill="none"/>

  <!-- Gamekeeper -->
  <g id="gamekeeper">
    <!-- Legs -->
    <g id="keeper-legs">
      <line x1="-5" y1="18" x2="-10" y2="35" stroke="#304030" stroke-width="4" stroke-linecap="round">
        <animate attributeName="x2" values="-8;-13;-8" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="37;32;37" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="5" y1="18" x2="10" y2="35" stroke="#304030" stroke-width="4" stroke-linecap="round">
        <animate attributeName="x2" values="13;8;13" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="32;37;32" dur="0.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Body -->
    <ellipse cx="0" cy="8" rx="11" ry="15" fill="#345c2c"/>

    <!-- Arms -->
    <line x1="-8" y1="5" x2="-18" y2="0" stroke="#304030" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y2" values="-3;2;-3" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="8" y1="5" x2="20" y2="3" stroke="#304030" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y2" values="0;6;0" dur="0.6s" repeatCount="indefinite"/>
    </line>

    <!-- Head -->
    <circle cx="0" cy="-16" r="8" fill="#f1c49b" stroke="#d5a47a" stroke-width="1"/>

    <!-- Red hair -->
    <path d="M -8 -18 Q 0 -26 8 -18 Q 0 -22 -8 -18 Z" fill="#c44526"/>

    <!-- Cap -->
    <path d="M -9 -20 Q 0 -27 9 -20 L 7 -22 Q 0 -28 -7 -22 Z" fill="#345c2c"/>
    <circle cx="0" cy="-23.5" r="1.5" fill="#c44526"/>

    <!-- Simple face -->
    <circle cx="-3" cy="-17" r="1.2" fill="#3b2a1a"/>
    <circle cx="3" cy="-17" r="1.2" fill="#3b2a1a"/>
    <path d="M -3 -13 Q 0 -11 3 -13" stroke="#b2764a" stroke-width="1" fill="none"/>

    <!-- Gun (stylised) -->
    <rect x="10" y="-4" width="20" height="3" fill="#555555" rx="1"/>
    <rect x="28" y="-5" width="15" height="2" fill="#999999" rx="1"/>
    <line x1="10" y1="-1.5" x2="6" y2="2" stroke="#444444" stroke-width="2" stroke-linecap="round"/>

    <!-- Bobbing motion -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -2; 0 0; 0 2; 0 0" dur="0.6s" repeatCount="indefinite"/>
  </g>

  <!-- Animate gamekeeper along path -->
  <animateMotion xlink:href="#gamekeeper" dur="7s" repeatCount="indefinite" rotate="auto">
    <mpath xlink:href="#runPath"/>
  </animateMotion>

  <!-- Haggis -->
  <g id="haggis">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#7b5a35" stroke="#5a4026" stroke-width="2"/>
    <path d="M -18 -4 Q 0 -10 18 -4" stroke="#5a4026" stroke-width="1.5" fill="none"/>

    <!-- Short legs -->
    <g stroke="#4a2e1a" stroke-width="3" stroke-linecap="round">
      <line x1="-10" y1="10" x2="-10" y2="18">
        <animate attributeName="y2" values="18;15;18" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="10" y1="10" x2="10" y2="18">
        <animate attributeName="y2" values="15;18;15" dur="0.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Face -->
    <circle cx="9" cy="-4" r="3" fill="#f2f2f2"/>
    <circle cx="9" cy="-4" r="1.5" fill="#2a1a10"/>
    <circle cx="3" cy="-2" r="1.5" fill="#2a1a10"/>
    <path d="M 5 2 Q 7 4 9 3" stroke="#2a1a10" stroke-width="1" fill="none"/>

    <!-- Little horns/ears -->
    <path d="M -10 -7 Q -12 -11 -8 -11" fill="#c7a37a" stroke="#8a6a46" stroke-width="1"/>
    <path d="M 10 -7 Q 12 -11 8 -11" fill="#c7a37a" stroke="#8a6a46" stroke-width="1"/>

    <!-- Tufts -->
    <path d="M -6 -13 Q -3 -18 0 -13 Q 3 -18 6 -13" fill="#8b6440"/>

    <!-- Squash and stretch bounce -->
    <animateTransform attributeName="transform" type="scale"
      values="1 1; 1.06 0.94; 1 1; 0.97 1.05; 1 1"
      dur="0.5s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Animate haggis along same path, slightly behind -->
  <animateMotion xlink:href="#haggis" dur="7s" repeatCount="indefinite" rotate="auto">
    <mpath xlink:href="#runPath"/>
    <animate attributeName="keyPoints" dur="7s" repeatCount="indefinite"
      values="0;1"/>
  </animateMotion>

  <!-- Offset haggis using an overall translate so it lags behind -->
  <g>
    <animateTransform xlink:href="#haggis" attributeName="transform" type="translate"
      values="-60 10;-60 10" dur="7s" repeatCount="indefinite"/>
  </g>

</svg>