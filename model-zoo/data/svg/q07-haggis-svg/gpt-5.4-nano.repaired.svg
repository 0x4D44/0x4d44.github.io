<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A haggis chasing a red-headed Scottish gamekeeper across a heather-covered moor.">
  <defs>
    <!-- Subtle moor wind shimmer -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#cfeef6"/>
    </linearGradient>

    <linearGradient id="moorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8f63"/>
      <stop offset="1" stop-color="#3f6a4a"/>
    </linearGradient>

    <linearGradient id="heatherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b55aa5"/>
      <stop offset="1" stop-color="#7d2f78"/>
    </linearGradient>

    <linearGradient id="heatherDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b266d"/>
      <stop offset="1" stop-color="#4b174b"/>
    </linearGradient>

    <!-- Smoke/breath puff -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Heather tuft symbol -->
    <g id="heatherTuft">
      <path d="M0,0 C6,-10 10,-10 16,0" fill="none" stroke="#8c3b86" stroke-width="3" stroke-linecap="round"/>
      <path d="M6,0 C10,-16 14,-16 18,0" fill="none" stroke="#6f2f6e" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <path d="M2,-2 C3,-12 8,-16 10,-2" fill="none" stroke="#a85aa1" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <circle cx="12" cy="-6" r="3" fill="#b66db3" opacity="0.9"/>
      <circle cx="4" cy="-6" r="2.5" fill="#cc88c8" opacity="0.85"/>
    </g>

    <!-- Running leg pair reusable -->
    <g id="runnerLegs">
      <!-- left leg -->
      <g transform="translate(0,0)">
        <path d="M-6,0 C-12,12 -14,22 -6,28 C2,34 6,24 2,14 C0,8 -2,4 -6,0 Z" fill="#2a1b12"/>
        <path d="M-5,26 L1,42" stroke="#1a120d" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- right leg -->
      <g transform="translate(12,0)">
        <path d="M-6,0 C-12,12 -14,22 -6,28 C2,34 6,24 2,14 C0,8 -2,4 -6,0 Z" fill="#2a1b12"/>
        <path d="M-5,26 L1,42" stroke="#1a120d" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Haggis head -->
    <g id="haggisHead">
      <ellipse cx="0" cy="0" rx="22" ry="18" fill="#b89a6a"/>
      <ellipse cx="-8" cy="-3" rx="7" ry="6" fill="#a88c5f"/>
      <circle cx="-7" cy="-1" r="2.8" fill="#1b120e"/>
      <circle cx="-2" cy="-2" r="2.2" fill="#1b120e" opacity="0.9"/>
      <path d="M-3,6 C-2,2 3,2 4,6" fill="none" stroke="#6b4b2f" stroke-width="2" stroke-linecap="round"/>
      <!-- nose/brow -->
      <path d="M-18,-2 C-8,-12 6,-12 18,-2" fill="none" stroke="#8d6a3e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <!-- small tuft -->
      <path d="M-2,-16 C-2,-25 10,-24 11,-15" fill="none" stroke="#8f673a" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Gamekeeper head -->
    <g id="keeperHead">
      <!-- face -->
      <ellipse cx="0" cy="0" rx="20" ry="18" fill="#e2a06f"/>
      <!-- beard -->
      <path d="M-18,2 C-14,22 14,22 18,2 C16,18 -16,18 -18,2 Z" fill="#a35a3d" opacity="0.95"/>
      <!-- hair/beard framing -->
      <path d="M-20,-6 C-16,-22 16,-22 20,-6 C16,-18 -16,-18 -20,-6 Z" fill="#c6452a"/>
      <!-- freckles -->
      <g opacity="0.35" fill="#9a4a2d">
        <circle cx="-10" cy="-2" r="1.2"/>
        <circle cx="-4" cy="2" r="1.1"/>
        <circle cx="3" cy="-1" r="1.1"/>
        <circle cx="9" cy="3" r="1.1"/>
      </g>
      <!-- eyes -->
      <circle cx="-7" cy="-1" r="2.3" fill="#1b120e"/>
      <circle cx="5" cy="-1" r="2.3" fill="#1b120e"/>
      <!-- brow -->
      <path d="M-13,-6 C-9,-9 -5,-9 -2,-7" stroke="#7a3a2a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M2,-7 C5,-9 9,-9 13,-6" stroke="#7a3a2a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- nose -->
      <path d="M-2,1 C-4,6 -3,8 0,10 C3,8 4,6 2,1" fill="#d08a5f"/>
      <!-- mouth -->
      <path d="M-6,10 C-1,14 2,14 7,10" fill="none" stroke="#7a3a2a" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Gamekeeper body -->
    <g id="keeperBody">
      <!-- torso -->
      <path d="M-38,10 C-34,-10 -18,-18 0,-18 C18,-18 34,-10 38,10
               C34,35 22,50 0,52 C-22,50 -34,35 -38,10 Z" fill="#274f34" stroke="#1a3a24" stroke-width="2"/>
      <!-- shirt front -->
      <path d="M-18,8 C-6,2 6,2 18,8 C14,30 8,41 0,42 C-8,41 -14,30 -18,8 Z" fill="#3b6b41" opacity="0.95"/>
      <!-- belt -->
      <path d="M-40,26 C-10,20 10,20 40,26" fill="none" stroke="#1a120d" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
      <!-- strap -->
      <path d="M-10,-4 C-18,12 -20,28 -16,45" fill="none" stroke="#0f2a19" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <path d="M10,-4 C18,12 20,28 16,45" fill="none" stroke="#0f2a19" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <!-- arms -->
      <path d="M-36,10 C-55,22 -62,38 -52,50 C-40,48 -30,36 -26,22 Z" fill="#274f34" stroke="#1a3a24" stroke-width="2"/>
      <path d="M36,10 C55,22 62,38 52,50 C40,48 30,36 26,22 Z" fill="#274f34" stroke="#1a3a24" stroke-width="2"/>
      <!-- sleeve hands -->
      <ellipse cx="-56" cy="44" rx="8" ry="6" fill="#e2a06f"/>
      <ellipse cx="56" cy="44" rx="8" ry="6" fill="#e2a06f"/>
      <!-- hat -->
      <g transform="translate(0,-30)">
        <ellipse cx="0" cy="8" rx="22" ry="10" fill="#2a1b12" opacity="0.95"/>
        <path d="M-18,8 C-8,-14 8,-14 18,8 C8,14 -8,14 -18,8 Z" fill="#1b120e"/>
        <path d="M-15,10 C-2,2 2,2 15,10" stroke="#6f2f6e" stroke-width="3" opacity="0.7" fill="none"/>
      </g>
    </g>

    <!-- Haggis body -->
    <g id="haggisBody">
      <!-- sack -->
      <path d="M-30,0 C-40,18 -38,46 -20,62 C-10,72 10,72 20,62
               C38,46 40,18 30,0
               C18,-12 -18,-12 -30,0 Z"
            fill="#b99966" stroke="#8c6a3e" stroke-width="2"/>
      <!-- lacing -->
      <path d="M-20,8 C-8,0 8,0 20,8" fill="none" stroke="#6f4a2f" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      <path d="M-22,24 C-10,16 10,16 22,24" fill="none" stroke="#6f4a2f" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      <path d="M-16,42 C-8,38 8,38 16,42" fill="none" stroke="#6f4a2f" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      <!-- feet -->
      <g opacity="0.98">
        <path d="M-12,64 C-4,60 2,60 10,64 C7,76 -7,76 -12,64 Z" fill="#2a1b12"/>
        <path d="M18,64 C26,62 30,66 34,74 C26,82 18,78 14,70 Z" fill="#2a1b12"/>
        <path d="M-34,74 C-30,66 -26,62 -18,64 C-14,78 -26,82 -34,74 Z" fill="#2a1b12"/>
      </g>
    </g>

    <!-- Heather patch background sprigs -->
    <g id="moorTuftsLayer">
      <!-- filled later by instances -->
    </g>

    <!-- Smoke puff shape -->
    <g id="puff">
      <path d="M-14,0 C-8,-10 8,-10 14,0 C8,12 -8,12 -14,0 Z" fill="#d7f2ff" opacity="0.85" filter="url(#softBlur)"/>
      <path d="M-8,-8 C-3,-14 3,-14 8,-8 C3,0 -3,0 -8,-8 Z" fill="#f3fdff" opacity="0.9" filter="url(#softBlur)"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>
  <rect x="0" y="250" width="800" height="350" fill="url(#moorGrad)"/>

  <!-- Distant haze -->
  <path d="M0,310 C120,290 220,330 330,305 C430,282 530,330 640,300 C710,282 760,292 800,295 L800,600 L0,600 Z"
        fill="#7bb07f" opacity="0.22"/>

  <!-- Heather field: back layer -->
  <g opacity="0.95">
    <!-- scatter tufts -->
    <g transform="translate(0,0)">
      <use href="#heatherTuft" transform="translate(70,420) scale(2.0) rotate(-8)"/>
      <use href="#heatherTuft" transform="translate(120,455) scale(1.6) rotate(12)"/>
      <use href="#heatherTuft" transform="translate(170,430) scale(1.9) rotate(-18)"/>
      <use href="#heatherTuft" transform="translate(220,470) scale(1.5) rotate(6)"/>
      <use href="#heatherTuft" transform="translate(260,440) scale(1.8) rotate(-6)"/>
      <use href="#heatherTuft" transform="translate(320,485) scale(1.4) rotate(15)"/>
      <use href="#heatherTuft" transform="translate(370,445) scale(1.9) rotate(-10)"/>
      <use href="#heatherTuft" transform="translate(430,490) scale(1.5) rotate(8)"/>
      <use href="#heatherTuft" transform="translate(490,455) scale(1.8) rotate(-14)"/>
      <use href="#heatherTuft" transform="translate(540,500) scale(1.4) rotate(10)"/>
      <use href="#heatherTuft" transform="translate(600,465) scale(1.9) rotate(-8)"/>
      <use href="#heatherTuft" transform="translate(660,510) scale(1.4) rotate(16)"/>
      <use href="#heatherTuft" transform="translate(720,470) scale(1.8) rotate(-12)"/>
      <use href="#heatherTuft" transform="translate(760,515) scale(1.3) rotate(7)"/>
    </g>
  </g>

  <!-- Heather field: mid layer -->
  <g opacity="0.98">
    <use href="#heatherTuft" transform="translate(40,470) scale(2.4) rotate(-7)" fill="url(#heatherGrad)"/>
    <use href="#heatherTuft" transform="translate(90,505) scale(2.0) rotate(11)"/>
    <use href="#heatherTuft" transform="translate(140,475) scale(2.2) rotate(-15)"/>
    <use href="#heatherTuft" transform="translate(190,525) scale(1.7) rotate(8)"/>
    <use href="#heatherTuft" transform="translate(240,490) scale(2.3) rotate(-4)"/>
    <use href="#heatherTuft" transform="translate(290,540) scale(1.6) rotate(14)"/>
    <use href="#heatherTuft" transform="translate(340,505) scale(2.2) rotate(-10)"/>
    <use href="#heatherTuft" transform="translate(390,550) scale(1.7) rotate(6)"/>
    <use href="#heatherTuft" transform="translate(440,515) scale(2.2) rotate(-16)"/>
    <use href="#heatherTuft" transform="translate(490,565) scale(1.6) rotate(12)"/>
    <use href="#heatherTuft" transform="translate(540,525) scale(2.3) rotate(-6)"/>
    <use href="#heatherTuft" transform="translate(590,575) scale(1.5) rotate(10)"/>
    <use href="#heatherTuft" transform="translate(640,535) scale(2.2) rotate(-18)"/>
    <use href="#heatherTuft" transform="translate(690,585) scale(1.55) rotate(7)"/>
    <use href="#heatherTuft" transform="translate(740,545) scale(2.1) rotate(-12)"/>
    <use href="#heatherTuft" transform="translate(785,575) scale(1.3) rotate(10)"/>
  </g>

  <!-- Heather foreground shadow blobs -->
  <path d="M0,560 C120,520 220,585 330,555 C440,525 530,580 640,550 C720,525 770,535 800,540 L800,600 L0,600 Z"
        fill="#2f523a" opacity="0.35"/>

  <!-- Moving ground dust puffs -->
  <g opacity="0.95">
    <g id="dust1" filter="url(#softBlur)" transform="translate(0,0)">
      <use href="#puff" transform="scale(0.65) translate(-20,-8)" fill="#d9f6ff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
                        values="520,500;540,505;520,500" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.0;0.55;0.0" dur="1.0s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- PATHS FOR CHARACTER MOTION -->
  <!-- Keeper runs left->right across moor -->
  <path id="keeperPath" d="M130,360 C210,335 275,345 325,362 C365,375 420,390 470,385 C520,380 570,345 640,352 C710,360 740,382 760,402"/>
  <!-- Haggis chases behind -->
  <path id="haggisPath" d="M210,380 C260,365 310,360 355,370 C400,380 438,395 475,410 C515,425 570,420 600,405 C640,385 680,385 715,405 C740,420 760,435 790,460"/>

  <!-- Keeper group -->
  <g id="keeper" filter="url(#shadow)">
    <!-- translate with motion -->
    <animateMotion dur="4.8s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.25 0 0.2 1"
      calcMode="spline" rotate="auto" origin="0.5 0.5" >
      <mpath href="#keeperPath"/>
    </animateMotion>

    <!-- Keeper body/pose (built around local origin) -->
    <g transform="translate(0,0)">
      <!-- torso and head -->
      <g transform="translate(-10,-40) rotate(-4)">
        <use href="#keeperHead" transform="translate(40,0)"/>
        <use href="#keeperBody" transform="translate(40,42)"/>
      </g>

      <!-- legs (animated) -->
      <g transform="translate(40,92)">
        <g id="keeperLegAnim" opacity="0.98">
          <!-- legs base -->
          <g transform="translate(0,0)">
            <use href="#runnerLegs" transform="scale(0.95)"/>
          </g>
          <!-- Add an oscillation on rotation to fake running -->
          <animateTransform attributeName="transform" type="translate"
                            values="0,0;0,1.2;0,0" dur="0.45s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate"
                            additive="sum"
                            values="-7 0 0;7 0 0;-7 0 0" dur="0.45s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- carrying/gesture (forearm) -->
      <path d="M20,58 C5,50 0,42 3,36 C15,35 25,40 30,48"
            fill="none" stroke="#1a120d" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

      <!-- waving motion on body (subtle) -->
      <animateTransform attributeName="transform" type="rotate"
                        additive="sum"
                        values="-2;2;-2" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
                        additive="sum"
                        values="0,0;0,-2;0,0" dur="0.9s" repeatCount="indefinite"/>
    </g>

    <!-- Occasional breath puff -->
    <g opacity="0.0">
      <g id="keeperPuff">
        <use href="#puff" transform="translate(0,0) scale(0.55)" opacity="0.7"/>
        <animate attributeName="opacity" values="0;0;0.6;0" keyTimes="0;0.35;0.44;0.52" dur="4.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0,0;0,0;0,-10;0,-22" keyTimes="0;0.35;0.44;0.52" dur="4.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Haggis group -->
  <g id="haggis" filter="url(#shadow)">
    <animateMotion dur="4.8s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.25 0 0.2 1"
      calcMode="spline" rotate="auto" origin="0.5 0.5">
      <mpath href="#haggisPath"/>
    </animateMotion>

    <g transform="translate(0,0)">
      <!-- Haggis main -->
      <g transform="translate(60,65)">
        <!-- head -->
        <g transform="translate(0,-35)">
          <use href="#haggisHead"/>
          <path d="M-8,2 C-4,10 6,10 10,2" fill="#a47f4f" opacity="0.35"/>
        </g>

        <!-- body -->
        <g transform="translate(0,0)">
          <use href="#haggisBody"/>
        </g>

        <!-- legs as running sticks -->
        <g transform="translate(0,98)">
          <path d="M-22,0 C-26,18 -18,30 -6,34" fill="none" stroke="#1a120d" stroke-width="6" stroke-linecap="round"/>
          <path d="M-6,34 C0,42 4,42 10,38" fill="none" stroke="#1a120d" stroke-width="6" stroke-linecap="round"/>
          <path d="M22,0 C18,18 26,30 36,34" fill="none" stroke="#1a120d" stroke-width="6" stroke-linecap="round"/>
          <path d="M6,34 C2,42 -2,42 -6,38" fill="none" stroke="#1a120d" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
          <animateTransform attributeName="transform" type="rotate"
                            values="-10;10;-10" dur="0.42s" repeatCount="indefinite"/>
        </g>

        <!-- haggis bounce -->
        <animateTransform attributeName="transform" additive="sum" type="translate"
                          values="0,0;0,-3;0,0" dur="0.55s" repeatCount="indefinite"/>
      </g>

      <!-- Head bob and chase attitude -->
      <animateTransform attributeName="transform" type="rotate"
                        additive="sum"
                        values="0;-5;0" dur="0.5s" repeatCount="indefinite"/>
    </g>

    <!-- Haggis snarl/breath puff trailing behind -->
    <g opacity="0.0">
      <g>
        <use href="#puff" transform="translate(40,18) scale(0.52)" opacity="0.75" filter="url(#softBlur)"/>
        <animate attributeName="opacity" values="0;0;0.55;0" keyTimes="0;0.5;0.58;0.72" dur="4.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="40,18;40,18;40,-10;40,-35" keyTimes="0;0.5;0.58;0.72" dur="4.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Foreground heather sweep over legs (mask-like feel without masks) -->
  <g opacity="0.55">
    <use href="#heatherTuft" transform="translate(90,560) scale(2.8) rotate(-12)"/>
    <use href="#heatherTuft" transform="translate(180,585) scale(2.1) rotate(10)"/>
    <use href="#heatherTuft" transform="translate(330,590) scale(2.4) rotate(-18)"/>
    <use href="#heatherTuft" transform="translate(520,585) scale(2.2) rotate(14)"/>
    <use href="#heatherTuft" transform="translate(700,590) scale(2.3) rotate(-9)"/>
  </g>

  <!-- Wind sway for some tufts (subtle loop) -->
  <g opacity="0.98">
    <animate attributeName="opacity" values="0.98;1;0.98" dur="6.0s" repeatCount="indefinite"/>
  </g>
</svg>