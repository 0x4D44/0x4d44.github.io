<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Heather bushes -->
    <g id="heather">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="#a57caf"/>
      <ellipse cx="18" cy="-4" rx="13" ry="6" fill="#c7a3d6"/>
      <ellipse cx="-15" cy="4" rx="11" ry="5" fill="#836099"/>
    </g>
    <!-- Haggis body -->
    <g id="haggis">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="34" ry="22" fill="#94623e" stroke="#6d482d" stroke-width="2"/>
      <!-- Left legs -->
      <ellipse cx="-22" cy="17" rx="7" ry="4" fill="#865837">
        <animate attributeName="cy" values="17;21;17" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-12" cy="21" rx="7" ry="4" fill="#7c5231">
        <animate attributeName="cy" values="21;18;21" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Right legs -->
      <ellipse cx="16" cy="17" rx="7" ry="4" fill="#82583b">
        <animate attributeName="cy" values="17;21;17" keyTimes="0;0.5;1" begin="0.45s" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="27" cy="21" rx="7" ry="4" fill="#866042">
        <animate attributeName="cy" values="21;18;21" keyTimes="0;0.5;1" begin="0.45s" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Face -->
      <ellipse cx="20" cy="-6" rx="10" ry="9" fill="#b88e5c" stroke="#674928" stroke-width="1"/>
      <ellipse cx="25" cy="-8" rx="1.9" ry="2" fill="#502b11"/>
      <ellipse cx="15" cy="-7" rx="1.9" ry="2" fill="#502b11"/>
      <ellipse cx="22" cy="-2" rx="3" ry="1.8" fill="#83411d"/>
      <!-- Sprig of heather in mouth -->
      <rect x="29" y="-5" width="20" height="2" fill="#7a3b15" rx="1" ry="1" transform="rotate(15 29 -5)"/>
      <ellipse cx="41" cy="-4" rx="2.8" ry="3" fill="#c7a3d6"/>
      <ellipse cx="44" cy="-2" rx="1.7" ry="1.3" fill="#dfc6e6"/>
      <!-- Tail -->
      <ellipse cx="-31" cy="-9" rx="7" ry="2.6" fill="#62411d" transform="rotate(-23 -31 -9)"/>
      <!-- Spots -->
      <ellipse cx="-5" cy="-7" rx="2" ry="1" fill="#775334"/>
      <ellipse cx="-10" cy="5" rx="1.4" ry="0.7" fill="#6a4326"/>
      <!-- Eyebrow (angry) -->
      <rect x="17" y="-13" width="6" height="1.2" fill="#522d14" rx="1" ry="0.6" transform="rotate(-20 20 -12)" />
    </g>
    <!-- Gamekeeper -->
    <g id="gamekeeper">
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="11" ry="12" fill="#fcd5b6" stroke="#c28e60" stroke-width="1"/>
      <!-- Red hair -->
      <ellipse cx="0" cy="-13" rx="14" ry="6" fill="#d95920"/>
      <ellipse cx="7" cy="-10" rx="5" ry="3" fill="#ec6830"/>
      <ellipse cx="-8" cy="-10" rx="5" ry="3" fill="#ec6830"/>
      <!-- Eyebrows -->
      <rect x="-7" y="-8" width="4" height="1.2" fill="#b94b09" rx="1" ry="1"/>
      <rect x="3" y="-8" width="4" height="1.2" fill="#b94b09" rx="1" ry="1"/>
      <!-- Eyes -->
      <ellipse cx="-4" cy="-5" rx="1" ry="1.2" fill="#45341a"/>
      <ellipse cx="4" cy="-5" rx="1" ry="1.2" fill="#45341a"/>
      <!-- Nose -->
      <ellipse cx="0" cy="-1" rx="1.2" ry="1.7" fill="#daaf7a"/>
      <!-- Smile -->
      <path d="M-4,3 Q0,6 4,3" stroke="#ad7a3d" stroke-width="2" fill="none"/>
      <!-- Body -->
      <rect x="-8" y="11" width="16" height="24" rx="7" fill="#4f8047" stroke="#376528" stroke-width="1"/>
      <!-- Arms -->
      <rect x="-19" y="14" width="10" height="3" rx="2" fill="#fcd5b6"/>
      <rect x="9" y="14" width="10" height="3" rx="2" fill="#fcd5b6"/>
      <ellipse cx="-21" cy="15.5" rx="2.1" ry="2.2" fill="#fcd5b6"/>
      <ellipse cx="21" cy="15.5" rx="2.1" ry="2.2" fill="#fcd5b6"/>
      <!-- Legs -->
      <rect x="-6" y="35" width="5" height="18" rx="2" fill="#1d1b20"/>
      <rect x="1" y="35" width="5" height="18" rx="2" fill="#1d1b20"/>
      <!-- Shoes -->
      <ellipse cx="-3.5" cy="54" rx="3.6" ry="2.6" fill="#564327"/>
      <ellipse cx="3.5" cy="54" rx="3.6" ry="2.6" fill="#564327"/>
      <!-- Cap -->
      <ellipse cx="0" cy="-16" rx="13" ry="5" fill="#368034"/>
      <rect x="-7" y="-19" width="14" height="4" rx="2" fill="#237923"/>
      <ellipse cx="0" cy="-19.5" rx="2" ry="1.2" fill="#e65812"/>
      <!-- Kilt -->
      <rect x="-8" y="28" width="16" height="7" fill="#46759e" stroke="#1f3140" stroke-width="1"/>
      <rect x="-8" y="28" width="2" height="7" fill="#d6e8ee"/>
      <rect x="-2" y="28" width="2" height="7" fill="#d6e8ee"/>
      <rect x="4" y="28" width="2" height="7" fill="#d6e8ee"/>
    </g>
  </defs>
  <!-- Heather background -->
  <g>
    <use href="#heather" x="110" y="500" />
    <use href="#heather" x="300" y="540" />
    <use href="#heather" x="207" y="570" />
    <use href="#heather" x="415" y="520" />
    <use href="#heather" x="650" y="540" />
    <use href="#heather" x="760" y="510" />
    <use href="#heather" x="720" y="590" />
    <use href="#heather" x="545" y="585" />
    <use href="#heather" x="370" y="580" />
    <use href="#heather" x="520" y="545"/>
    <use href="#heather" x="680" y="575"/>
  </g>

  <!-- Moor background -->
  <rect x="0" y="400" width="800" height="200" fill="#7bbd89"/>
  <rect x="0" y="560" width="800" height="40" fill="#7a5e96"/>

  <!-- Animate the gamekeeper running right-to-left -->
  <g>
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="700,475" to="200,475"
        dur="4s"
        repeatCount="indefinite"/>
      <!-- up and down run bounce -->
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0,0" to="0,-13;0,0"
        keyTimes="0;0.5;1"
        values="0,0;0,-13;0,0"
        dur="0.5s"
        repeatCount="indefinite"/>
      <g>
        <use href="#gamekeeper"/>
      </g>
    </g>
  </g>

  <!-- Animate the haggis following the keeper -->
  <g>
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="600,500" to="140,500"
        dur="4s"
        repeatCount="indefinite"/>
      <!-- up and down running bounce -->
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0,0" to="0,-9;0,0"
        keyTimes="0;0.5;1"
        values="0,0;0,-9;0,0"
        dur="0.3s"
        repeatCount="indefinite"/>
      <g>
        <use href="#haggis"/>
      </g>
    </g>
  </g>
</svg>