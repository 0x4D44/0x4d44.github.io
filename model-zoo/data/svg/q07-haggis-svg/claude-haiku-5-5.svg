<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccbe8"/>
      <stop offset="1" stop-color="#e9f1d8"/>
    </linearGradient>
    <linearGradient id="moor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6a32"/>
      <stop offset="1" stop-color="#4a4a22"/>
    </linearGradient>
    <g id="cluster">
      <ellipse cx="10" cy="470" rx="14" ry="9" fill="#7d3f8f"/>
      <ellipse cx="26" cy="466" rx="12" ry="8" fill="#9a56a8"/>
      <ellipse cx="18" cy="462" rx="9" ry="6" fill="#b06cbc"/>
      <rect x="16" y="470" width="2" height="10" fill="#3d4d24"/>
    </g>
    <g id="tile">
      <use xlink:href="#cluster" href="#cluster"/>
      <use xlink:href="#cluster" href="#cluster" x="45"/>
      <use xlink:href="#cluster" href="#cluster" x="95"/>
      <use xlink:href="#cluster" href="#cluster" x="140" y="8"/>
      <use xlink:href="#cluster" href="#cluster" x="170" y="-4"/>
      <ellipse cx="70" cy="530" rx="6" ry="4" fill="#8f5aa0"/>
      <ellipse cx="120" cy="560" rx="9" ry="5" fill="#7d3f8f"/>
      <ellipse cx="185" cy="520" rx="7" ry="4" fill="#9a56a8"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Distant hills -->
  <path d="M0,360 Q120,280 260,340 T520,320 T800,350 L800,600 L0,600Z" fill="#7f7a9a"/>
  <path d="M0,390 Q160,330 320,380 T640,370 T800,385 L800,600 L0,600Z" fill="#5f5a7a"/>
  <!-- Moor ground -->
  <rect x="0" y="420" width="800" height="180" fill="url(#moor)"/>

  <!-- Scrolling heather -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="1.2s" repeatCount="indefinite"/>
    <use xlink:href="#tile" href="#tile" x="0"/>
    <use xlink:href="#tile" href="#tile" x="200"/>
    <use xlink:href="#tile" href="#tile" x="400"/>
    <use xlink:href="#tile" href="#tile" x="600"/>
    <use xlink:href="#tile" href="#tile" x="800"/>
  </g>

  <!-- Haggis (chaser), feet at (230,500) -->
  <g transform="translate(230,500)">
    <animateTransform attributeName="transform" type="translate" values="230,500; 230,494; 230,500" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite" additive="replace"/>
    <!-- legs -->
    <g transform="translate(-30,-16)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3e2314" stroke-width="10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-30 0 0;30 0 0;-30 0 0" dur="0.3s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(30,-16)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3e2314" stroke-width="10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="30 0 0;-30 0 0;30 0 0" dur="0.3s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="-42" rx="60" ry="40" fill="#6b3e26"/>
    <ellipse cx="-20" cy="-36" rx="18" ry="12" fill="#5a331e"/>
    <ellipse cx="18" cy="-54" rx="14" ry="9" fill="#7d4b2e"/>
    <circle cx="-38" cy="-50" r="4" fill="#4a2a18"/>
    <circle cx="6" cy="-20" r="4" fill="#4a2a18"/>
    <circle cx="-8" cy="-66" r="3" fill="#4a2a18"/>
    <path d="M-30,-22 q4,6 8,0 q4,6 8,0 q4,6 8,0" fill="none" stroke="#3e2314" stroke-width="2"/>
    <!-- head end (right) -->
    <ellipse cx="48" cy="-48" rx="18" ry="16" fill="#7a4628"/>
    <path d="M44,-58 l-4,-14 l8,10 M52,-60 l2,-14 l4,12" stroke="#5a331e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- angry eyes -->
    <circle cx="48" cy="-54" r="6" fill="#fff"/>
    <circle cx="50" cy="-54" r="3" fill="#111"/>
    <path d="M40,-64 l14,4" stroke="#2a160b" stroke-width="3"/>
    <!-- mouth with teeth -->
    <path d="M52,-42 q10,6 14,-2" fill="#3a1a10" stroke="#2a160b" stroke-width="2"/>
    <path d="M56,-40 l2,5 l2,-5 l2,5" fill="#fff"/>
  </g>

  <!-- Gamekeeper (chased), feet at (430,500) -->
  <g transform="translate(430,500)">
    <animateTransform attributeName="transform" type="translate" values="430,500; 430,494; 430,500" keyTimes="0;0.5;1" dur="0.4s" repeatCount="indefinite" additive="replace"/>
    <!-- legs -->
    <g transform="translate(-8,-72)">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#e0b48a" stroke-width="11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-35 0 0;35 0 0;-35 0 0" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(8,-72)">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#e0b48a" stroke-width="11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="35 0 0;-35 0 0;35 0 0" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- boots -->
    <ellipse cx="-14" cy="0" rx="8" ry="5" fill="#2b1d12"/>
    <ellipse cx="14" cy="0" rx="8" ry="5" fill="#2b1d12"/>
    <!-- kilt with tartan -->
    <path d="M-24,-124 L24,-124 L32,-68 L-32,-68Z" fill="#2f5b8a"/>
    <path d="M-22,-110 L22,-110 M-26,-96 L26,-96 M-29,-82 L29,-82" stroke="#b5361e" stroke-width="4"/>
    <path d="M-12,-124 L-12,-68 M0,-124 L0,-68 M12,-124 L12,-68" stroke="#2f7a3a" stroke-width="2"/>
    <!-- torso jacket -->
    <path d="M-26,-172 L26,-172 L24,-120 L-24,-120Z" fill="#2f5e3a"/>
    <path d="M0,-170 L0,-124" stroke="#1d3d24" stroke-width="2"/>
    <circle cx="0" cy="-150" r="2" fill="#d8c27a"/>
    <circle cx="0" cy="-134" r="2" fill="#d8c27a"/>
    <!-- arms -->
    <g transform="translate(-24,-166)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#2f5e3a" stroke-width="11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="30 0 0;-30 0 0;30 0 0" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(24,-166)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#2f5e3a" stroke-width="11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-30 0 0;30 0 0;-30 0 0" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- head -->
    <path d="M-22,-202 Q-26,-232 0,-230 Q26,-232 22,-202 L24,-180 L-24,-180Z" fill="#b83a1f"/>
    <circle cx="0" cy="-198" r="16" fill="#f2c8a2"/>
    <path d="M-17,-204 Q0,-222 17,-204 Q6,-210 -17,-204Z" fill="#b83a1f"/>
    <path d="M-14,-188 Q0,-168 14,-188 Q8,-178 0,-180 Q-8,-178 -14,-188Z" fill="#c4451f"/>
    <circle cx="-6" cy="-198" r="2" fill="#222"/>
    <circle cx="6" cy="-198" r="2" fill="#222"/>
    <path d="M-6,-186 q6,-2 12,0" stroke="#7a2a14" stroke-width="2" fill="none"/>
    <!-- flat bonnet -->
    <ellipse cx="2" cy="-220" rx="20" ry="5" fill="#2f5b8a"/>
    <path d="M-16,-220 Q2,-236 18,-220 Z" fill="#2f5b8a"/>
    <!-- sporran -->
    <rect x="-12" y="-66" width="24" height="14" rx="2" fill="#3a2a1a"/>
    <line x1="-12" y1="-62" x2="12" y2="-62" stroke="#d8c27a" stroke-width="2"/>
    <!-- startled hop -->
  </g>

  <!-- Dust puffs kicked up -->
  <g fill="#d8cfa8" opacity="0.7">
    <circle cx="330" cy="500" r="6">
      <animate attributeName="r" values="4;12;4" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="506" r="5">
      <animate attributeName="r" values="12;4;12" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title banner -->
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#2b2412" opacity="0.85">
    Run, Gamekeeper, Run!
  </text>
</svg>