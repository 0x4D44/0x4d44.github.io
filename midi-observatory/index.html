<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Asterion MIDI Observatory</title>
<meta name="description" content="A celestial in-browser MIDI listening room: play curated demo pieces or upload .mid files and drive a Web Audio synth with four visualizer scenes. Fully self-contained — no runtime network calls.">
<link rel="icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,180,255,.2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
input[type=range]{accent-color:#5effa8}
@keyframes glowPulse{0%,100%{box-shadow:0 0 18px rgba(94,255,168,.35)}50%{box-shadow:0 0 30px rgba(94,255,168,.6)}}
</style>
</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#05070f"/><circle cx="50" cy="42" r="16" fill="none" stroke="#5effa8" stroke-width="2"/><circle cx="50" cy="42" r="8" fill="none" stroke="#6fe6ff" stroke-width="1.6"/><circle cx="50" cy="42" r="2.4" fill="#5effa8"/><path d="M18 72 h8 l4 -10 4 16 4 -8 3 4 h37" fill="none" stroke="#5effa8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></template>
<div style="position:fixed;inset:0;overflow:hidden;background:#05070f;color:#eaf2ff;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">

  <canvas ref="{{ skyRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 6%, transparent 42%, rgba(3,5,12,.82) 100%);"></div>
  <div style="position:absolute;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#dfefff 0 1px,transparent 1px 3px);"></div>

  <header style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;z-index:30;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:13px;">
      <div style="width:32px;height:32px;border:1.5px solid #5effa8;border-radius:50%;position:relative;box-shadow:0 0 16px rgba(94,255,168,.4);flex:none;">
        <div style="position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(111,230,255,.7);"></div>
        <div style="position:absolute;inset:12px;border-radius:50%;background:#5effa8;"></div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#7f95bd;font-weight:500;">Asterion</div>
        <div style="font-size:16px;font-weight:600;letter-spacing:.01em;line-height:1.1;">MIDI Observatory</div>
      </div>
    </div>

    <div style="display:flex;gap:5px;padding:4px;border-radius:13px;background:rgba(9,13,26,.6);border:1px solid rgba(120,180,255,.14);backdrop-filter:blur(12px);flex-wrap:wrap;">
      <sc-for list="{{ scenes }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.onPick }}" style="{{ s.style }}">{{ s.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button onClick="{{ onToggleLeft }}" style="{{ leftBtnStyle }}">Playlist</button>
      <button onClick="{{ onToggleRight }}" style="{{ rightBtnStyle }}">Mixer</button>
      <button onClick="{{ onFocusToggle }}" style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid rgba(120,180,255,.2);background:rgba(12,18,34,.6);color:#cfe0ff;font:inherit;font-size:12px;cursor:pointer;" style-hover="border-color:rgba(94,255,168,.5);color:#fff;">Focus</button>
      <label style="display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:1px solid rgba(120,180,255,.2);background:rgba(12,18,34,.6);color:#cfe0ff;font-size:12px;cursor:pointer;" style-hover="border-color:rgba(94,255,168,.5);">↥ Upload<input type="file" accept=".mid,.midi,audio/midi" multiple onChange="{{ onFiles }}" style="display:none;"></label>
      <button onClick="{{ onFullscreen }}" title="Fullscreen" style="width:38px;height:38px;border-radius:10px;border:1px solid rgba(120,180,255,.2);background:rgba(12,18,34,.6);color:#cfe0ff;font-size:16px;cursor:pointer;display:grid;place-items:center;" style-hover="border-color:rgba(94,255,168,.5);">⤢</button>
    </div>
  </header>

  <aside style="{{ leftPanelStyle }}">
    <div style="flex:1;display:flex;flex-direction:column;border-radius:20px;background:rgba(9,13,26,.78);border:1px solid rgba(120,180,255,.14);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 10px;">
        <div style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7f95bd;font-weight:600;">Playlist</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5effa8;">{{ trackCount }} tracks</div>
      </div>
      <div style="padding:0 14px 8px;">
        <div onDrop="{{ onDrop }}" onDragOver="{{ onDragOver }}" style="border:1px dashed rgba(94,255,168,.4);border-radius:12px;padding:11px;text-align:center;color:#9fb6d8;font-size:12px;">Drop .mid files here to add</div>
      </div>
      <div style="flex:1;overflow:auto;padding:0 14px 14px;">
        <sc-for list="{{ trackRows }}" as="row" hint-placeholder-count="4">
          <div style="{{ row.style }}">
            <button onClick="{{ row.onSelect }}" style="{{ row.glyphStyle }}">{{ row.glyph }}</button>
            <div style="min-width:0;">
              <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ row.title }}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3c8;margin-top:2px;">{{ row.meta }}</div>
            </div>
            <div style="display:flex;gap:4px;">
              <button onClick="{{ row.onUp }}" style="{{ miniBtn }}">↑</button>
              <button onClick="{{ row.onDown }}" style="{{ miniBtn }}">↓</button>
              <button onClick="{{ row.onDel }}" style="{{ miniBtn }}">✕</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </aside>

  <aside style="{{ rightPanelStyle }}">
    <div style="flex:1;display:flex;flex-direction:column;border-radius:20px;background:rgba(9,13,26,.78);border:1px solid rgba(120,180,255,.14);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden;">
      <div style="padding:16px 18px 10px;">
        <div style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7f95bd;font-weight:600;">Spectrum</div>
      </div>
      <div style="padding:0 16px 12px;">
        <canvas ref="{{ spectrumRef }}" style="width:100%;height:72px;display:block;border-radius:10px;background:#040a12;border:1px solid rgba(120,180,255,.1);"></canvas>
      </div>
      <div style="padding:2px 18px 8px;display:flex;align-items:baseline;justify-content:space-between;">
        <div style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7f95bd;font-weight:600;">Mixer</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3c8;">{{ chanCount }} active ch</div>
      </div>
      <div style="flex:1;overflow:auto;padding:0 16px 16px;">
        <sc-for list="{{ chanRows }}" as="chan" hint-placeholder-count="5">
          <div style="{{ chan.style }}">
            <span style="{{ chan.pillStyle }}">{{ chan.label }}</span>
            <div style="display:flex;flex-direction:column;gap:5px;min-width:0;">
              <div style="position:relative;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;">
                <div ref="{{ chan.meterRef }}" style="position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#5effa8,#6fe6ff);"></div>
              </div>
              <input key="vol{{ chan.i }}" type="range" min="0" max="100" defaultValue="{{ chan.volPct }}" onInput="{{ chan.onVol }}" style="width:100%;height:4px;">
            </div>
            <button onClick="{{ chan.onMute }}" style="{{ chan.muteStyle }}">{{ chan.muteLabel }}</button>
          </div>
        </sc-for>
      </div>
    </div>
  </aside>

  <footer style="position:absolute;left:0;right:0;bottom:0;z-index:30;padding:14px 20px 20px;pointer-events:none;">
    <div style="max-width:940px;margin:0 auto;pointer-events:auto;border-radius:22px;background:rgba(8,12,24,.82);border:1px solid rgba(120,180,255,.16);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.6);padding:14px 20px 16px;">

      <div style="display:flex;align-items:center;gap:16px;margin-bottom:13px;">
        <canvas ref="{{ scopeRef }}" style="width:132px;height:40px;flex:none;display:block;border-radius:9px;background:#04120b;border:1px solid rgba(94,255,168,.2);"></canvas>
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ nowTitle }}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8ea3c8;margin-top:1px;">{{ nowSub }}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;">
          <div style="font-size:9px;letter-spacing:.24em;color:#7f95bd;text-transform:uppercase;">Master</div>
          <canvas ref="{{ vuRef }}" style="width:150px;height:12px;display:block;"></canvas>
        </div>
      </div>

      <div style="position:relative;height:12px;display:flex;align-items:center;margin-bottom:12px;">
        <div style="position:absolute;left:0;right:0;height:6px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden;">
          <div ref="{{ barRef }}" style="height:100%;width:0;background:linear-gradient(90deg,#5effa8,#6fe6ff);box-shadow:0 0 12px rgba(94,255,168,.7);"></div>
        </div>
        <input ref="{{ scrubRef }}" type="range" min="0" max="1000" defaultValue="0" onInput="{{ onScrub }}" style="position:absolute;left:0;right:0;width:100%;margin:0;height:20px;opacity:0;cursor:pointer;">
      </div>

      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:9px;">
          <button onClick="{{ onShuffle }}" title="Shuffle" style="{{ shuffleStyle }}">⇄</button>
          <button onClick="{{ onPrev }}" style="{{ ctrlBtn }}">⏮</button>
          <button onClick="{{ onPlay }}" style="width:56px;height:56px;border-radius:50%;border:1.5px solid #5effa8;background:radial-gradient(circle at 32% 28%,rgba(94,255,168,.4),rgba(94,255,168,.08));color:#eafff2;font-size:19px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 22px rgba(94,255,168,.4);">{{ playGlyph }}</button>
          <button onClick="{{ onNext }}" style="{{ ctrlBtn }}">⏭</button>
          <button onClick="{{ onLoop }}" title="Loop: off / all / one" style="{{ loopStyle }}">{{ loopGlyph }}</button>
          <button onClick="{{ onStop }}" style="{{ ctrlBtn }}">⏹</button>
          <span ref="{{ clockRef }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#bcd0f2;margin-left:4px;white-space:nowrap;">0:00 / 0:00</span>
        </div>

        <div style="flex:1;"></div>

        <select value="{{ preset }}" onChange="{{ onPreset }}" style="padding:9px 12px;border-radius:10px;border:1px solid rgba(120,180,255,.2);background:rgba(12,18,34,.8);color:#eaf2ff;font:inherit;font-size:13px;cursor:pointer;">
          <sc-for list="{{ presetOptions }}" as="p" hint-placeholder-count="5"><option value="{{ p.k }}" style="background:#0a0e1c;">{{ p.label }}</option></sc-for>
        </select>

        <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:#8ea3c8;text-transform:uppercase;letter-spacing:.08em;">Tempo<input type="range" min="50" max="180" defaultValue="{{ defTempo }}" onInput="{{ onTempo }}" onChange="{{ onTempoCommit }}" style="width:78px;"><span ref="{{ tempoOutRef }}" style="font-family:'IBM Plex Mono',monospace;color:#bcd0f2;width:34px;">{{ defTempoLbl }}</span></label>

        <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:#8ea3c8;text-transform:uppercase;letter-spacing:.08em;">Vol<input type="range" min="0" max="100" defaultValue="{{ defVol }}" onInput="{{ onVol }}" style="width:78px;"><span ref="{{ volOutRef }}" style="font-family:'IBM Plex Mono',monospace;color:#bcd0f2;width:34px;">{{ defVolLbl }}</span></label>

        <button onClick="{{ onExport }}" style="padding:9px 14px;border-radius:10px;border:1px solid rgba(94,255,168,.35);background:rgba(94,255,168,.08);color:#9dffce;font:inherit;font-size:12px;cursor:pointer;" style-hover="background:rgba(94,255,168,.16);">Export WAV</button>
      </div>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accentPhosphor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5effa8&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#5effa8&quot;,&quot;#6fe6ff&quot;,&quot;#ffd24a&quot;,&quot;#ff7bd5&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;constellations&quot;,&quot;options&quot;:[&quot;constellations&quot;,&quot;spectrogram&quot;,&quot;oscilloscope&quot;,&quot;pianoroll&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;starDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:180,&quot;min&quot;:0,&quot;max&quot;:360,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot; stars&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:14,&quot;min&quot;:0,&quot;max&quot;:30,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;reverbMix&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;×&quot;,&quot;section&quot;:&quot;Sound&quot;}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.TAU = Math.PI * 2;
    this.P = {
      real:['Realistic Observatory','sine',.15,.08,.7,4,.12],
      la:['LA Studio 1986','square',.22,.18,.65,8,.06],
      dream:['Dream Orchestra','triangle',.28,.35,.55,10,.3],
      hybrid:['Celestial Hybrid','sine',.36,.42,.5,7,.34],
      exp:['Experimental Telescope','sawtooth',.18,.5,.45,14,.42]
    };
    this.chanChar = Array.from({length:16},(_,i)=>{
      const flav=[['sine',1.0],['triangle',1.18],['sawtooth',.8],['square',.92],['triangle',1.32]];
      return flav[i%flav.length];
    });
    this.channels = Array.from({length:16},(_,i)=>({v:.8,p:(i==9?0:(i%8-3)/4),m:0}));
    this.chanRefs = Array.from({length:16},()=>React.createRef());
    this.rings=[]; this.stars=[]; this.chanLevel=new Float32Array(16);
    this.acNotes=[]; this.pos=0; this.tempoVal=1; this.volVal=.82;
    this.startT=0; this.peak=0; this.level=0; this.ended=false; this.dpr=1;
    this.skyRef=React.createRef(); this.scopeRef=React.createRef();
    this.vuRef=React.createRef(); this.spectrumRef=React.createRef();
    this.clockRef=React.createRef(); this.barRef=React.createRef(); this.scrubRef=React.createRef();
    this.tempoOutRef=React.createRef(); this.volOutRef=React.createRef();
    const sv=this.loadSettings();
    if(sv.tempoVal)this.tempoVal=sv.tempoVal;
    if(sv.volVal!=null)this.volVal=sv.volVal;
    if(Array.isArray(sv.channels))sv.channels.forEach((c,i)=>{ if(c&&this.channels[i]){ this.channels[i].v=c.v; this.channels[i].m=c.m; } });
    this._savedTrack=sv.track||0;
    this.state={ playing:false, track:0, preset:sv.preset&&this.P[sv.preset]?sv.preset:'real', tracks:[], scene:sv.scene||this.props.scene||'constellations', leftOpen:sv.leftOpen!==false, rightOpen:sv.rightOpen!==false, loop:sv.loop||'off', shuffle:!!sv.shuffle, mobile:innerWidth<760 };
  }

  componentDidMount(){
    const lib=this.library();
    this.setState({tracks:lib, track:Math.max(0,Math.min(this._savedTrack,lib.length-1))});
    this.idbAll().then(rows=>{ if(!rows||!rows.length)return; const ups=rows.map(r=>({id:r.id,title:r.title,events:r.events,dur:r.dur,src:'upload'})); const all=this.library().concat(ups); this.setState({tracks:all, track:Math.max(0,Math.min(this._savedTrack,all.length-1))}); });
    this.resize=()=>{ this.sizeCanvases(); const m=innerWidth<760; if(m!==this.state.mobile)this.setState({mobile:m}); };
    addEventListener('resize',this.resize);
    this.keyh=(e)=>this.onKey(e); addEventListener('keydown',this.keyh);
    this.sizeCanvases(); setTimeout(()=>{ this.sizeCanvases(); const m=innerWidth<760; if(m!==this.state.mobile)this.setState({mobile:m}); },80); this.loop();
  }
  componentWillUnmount(){ removeEventListener('resize',this.resize); removeEventListener('keydown',this.keyh); cancelAnimationFrame(this.raf); this.hardStop(); }
  componentDidUpdate(){ this.saveLater(); }

  loadSettings(){ try{ return JSON.parse(localStorage.getItem('asterion.v2'))||{}; }catch(e){ return {}; } }
  saveSettings(){ try{ const S=this.state; localStorage.setItem('asterion.v2',JSON.stringify({ track:S.track, preset:S.preset, scene:S.scene, loop:S.loop, shuffle:S.shuffle, leftOpen:S.leftOpen, rightOpen:S.rightOpen, tempoVal:this.tempoVal, volVal:this.volVal, channels:this.channels.map(c=>({v:c.v,m:c.m})) })); }catch(e){} }
  saveLater(){ clearTimeout(this._sv); this._sv=setTimeout(()=>this.saveSettings(),350); }

  idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('asterion',1); r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async idbAll(){ try{ const db=await this.idb(); return await new Promise(res=>{ const q=db.transaction('tracks').objectStore('tracks').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }); }catch(e){ return []; } }
  async idbPut(rec){ try{ const db=await this.idb(); db.transaction('tracks','readwrite').objectStore('tracks').put(rec); }catch(e){} }
  async idbDel(id){ try{ const db=await this.idb(); db.transaction('tracks','readwrite').objectStore('tracks').delete(id); }catch(e){} }

  onKey(e){ const t=e.target; if(t&&/INPUT|SELECT|TEXTAREA/.test(t.tagName))return;
    if(e.code==='Space'){ e.preventDefault(); this.play(); }
    else if(e.code==='ArrowRight'){ e.preventDefault(); this.seek(Math.min(1,(this.pos+5)/this.dur())); }
    else if(e.code==='ArrowLeft'){ e.preventDefault(); this.seek(Math.max(0,(this.pos-5)/this.dur())); }
    else if(e.code==='ArrowUp'){ e.preventDefault(); this.setVol(Math.min(1,this.volVal+.05)); }
    else if(e.code==='ArrowDown'){ e.preventDefault(); this.setVol(Math.max(0,this.volVal-.05)); }
    else if(e.code==='KeyN'){ this.next(); }
    else if(e.code==='KeyP'){ this.prev(); }
    else if(e.code==='KeyS'){ this.toggleShuffle(); }
    else if(e.code==='KeyL'){ this.cycleLoop(); } }
  setVol(v){ this.volVal=v; if(this.master)this.master.gain.value=v; if(this.volOutRef.current)this.volOutRef.current.textContent=Math.round(v*100)+'%'; this.saveLater(); }
  cycleLoop(){ const seq=['off','all','one'],i=(seq.indexOf(this.state.loop)+1)%3; this.setState({loop:seq[i]}); }
  toggleShuffle(){ this.setState(s=>({shuffle:!s.shuffle})); }

  accent(){ return this.props.accentPhosphor||'#5effa8'; }
  glowAmt(){ return this.props.glow==null?14:this.props.glow; }
  reverb(){ return this.props.reverbMix==null?1:this.props.reverbMix; }
  fmt(s){ const m=s/60|0; return m+':'+String(s%60|0).padStart(2,'0'); }
  dur(){ const c=this.state.tracks[this.state.track]; return c?c.dur:1; }

  demo(name,base){ const ev=[],scale=[0,2,4,7,9,12]; let t=0;
    for(let i=0;i<96;i++){ const ch=i%5,n=base+scale[i%scale.length]+(i%24>11?12:0),d=i%7?.22:.8;
      ev.push({t,n,d,ch,v:.35+(i%5)/12});
      if(i%4==0)ev.push({t,n:base-24+(i%3)*5,d:.9,ch:1,v:.55});
      if(i%4==0)ev.push({t,n:36,d:.08,ch:9,v:.8});
      if(i%8==4)ev.push({t,n:42,d:.05,ch:9,v:.5});
      t+=.18; }
    return {id:crypto.randomUUID(),title:name,events:ev,dur:t+1,src:'generated'}; }

  library(){ return [ this.buildBells(), this.buildAscension(), this.buildAmarok(), this.buildMastermind() ]; }
  _mk(title,ev,dur){ return {id:crypto.randomUUID(),title,events:ev.sort((a,b)=>a.t-b.t),dur,src:'demo'}; }

  buildBells(){
    const ev=[], S=0.15, P=[69,72,76,72,69,64,67,64,69,72,76,74,72,69,64], BL=P.length, bars=16, barT=BL*S;
    for(let b=0;b<bars;b++){ let t=b*barT; for(let i=0;i<BL;i++){ ev.push({t,n:P[i]-12,d:S*0.9,ch:0,v:0.24+0.07*Math.sin((b*BL+i)/7)}); t+=S; } }
    const roots=[45,41,48,43], pads={45:[57,60,64],41:[53,57,60],48:[52,55,60],43:[50,55,59]};

    x.fillStyle='#05070f'; x.fillRect(0,0,W,H);
    const tr=this.state.tracks[this.state.track], pos=this.pos, past=1.6, fut=6.4, span=past+fut, phX=W*(past/span);
    let lo=127,hi=0; if(tr){ for(const e of tr.events){ if(e.n<lo)lo=e.n; if(e.n>hi)hi=e.n; } } if(hi<=lo){lo=48;hi=84;} lo-=2; hi+=2;
    const yOf=n=>H-((n-lo)/(hi-lo))*H*.86-H*.07;
    x.strokeStyle='rgba(120,180,255,.06)'; x.lineWidth=1; for(let n=Math.ceil(lo/12)*12;n<=hi;n+=12){ const y=yOf(n); x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke(); }
    x.fillStyle='rgba(94,255,168,.06)'; x.fillRect(0,0,phX,H);
    x.strokeStyle=this.accent(); x.lineWidth=2*this.dpr; x.beginPath(); x.moveTo(phX,0); x.lineTo(phX,H); x.stroke();
    if(tr){ const t0=pos-past, t1=pos+fut, hb=Math.max(4*this.dpr,H*.018);
      for(const e of tr.events){ if(e.t+e.d<t0||e.t>t1)continue; if(this.channels[e.ch]&&this.channels[e.ch].m)continue;
        const xs=phX+((e.t-pos)/span)*W, xe=phX+((e.t+e.d-pos)/span)*W, y=yOf(e.n), hue=e.ch*31, active=e.t<=pos&&e.t+e.d>=pos, w=Math.max(3*this.dpr,xe-xs);
        x.fillStyle='hsla('+hue+','+(active?95:78)+'%,'+(active?72:56)+'%,'+(active?1:.72)+')';
        if(active){ x.shadowColor='hsl('+hue+',90%,66%)'; x.shadowBlur=13*this.dpr; }
        this.roundRect(x,xs,y-hb/2,w,hb,hb/2); x.fill(); x.shadowBlur=0; } } }
  roundRect(x,X,Y,w,h,r){ r=Math.min(r,w/2,h/2); x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }

  drawScope(){ const c=this.scopeRef.current; if(!c||!this.time)return; const x=c.getContext('2d'),W=c.width,H=c.height;
    x.clearRect(0,0,W,H); x.fillStyle='#04120b'; x.fillRect(0,0,W,H); const acc=this.accent();
    x.strokeStyle=acc; x.lineWidth=1.4*this.dpr; x.shadowColor=acc; x.shadowBlur=6*this.dpr;
    const td=this.time,step=W/td.length; x.beginPath(); for(let i=0;i<td.length;i++){ const v=(td[i]-128)/128,px=i*step,py=H/2+v*H*.4; i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); x.shadowBlur=0; }

  drawSpectrum(){ const c=this.spectrumRef.current; if(!c||!this.freq)return; const x=c.getContext('2d'),W=c.width,H=c.height;
    x.clearRect(0,0,W,H); const bins=this.freq,n=48,bw=W/n;
    for(let i=0;i<n;i++){ const bi=Math.floor(i/n*bins.length*.6),v=(bins[bi]||0)/255,h=v*H,hue=150-v*120; x.fillStyle='hsl('+hue+',95%,'+(46+v*14)+'%)'; x.fillRect(i*bw+1,H-h,bw-2,h); } }

  drawVU(){ const c=this.vuRef.current; if(!c||!this.time)return; let sum=0; const td=this.time;
    for(let i=0;i<td.length;i++){ const v=(td[i]-128)/128; sum+=v*v; }
    this.level=Math.min(1,Math.sqrt(sum/td.length)*2.6); this.peak=Math.max((this.peak||0)*.95,this.level);
    const x=c.getContext('2d'),W=c.width,H=c.height; x.clearRect(0,0,W,H);
    const N=26,gap=2*this.dpr,sw=(W-(N-1)*gap)/N;
    for(let i=0;i<N;i++){ const frac=i/N,on=frac<this.level,col=frac<.6?'#5effa8':frac<.85?'#ffd24a':'#ff5f5f';
      x.fillStyle=on?col:'rgba(255,255,255,.06)'; x.fillRect(i*(sw+gap),0,sw,H); }
    const pi=Math.min(N-1,Math.floor(this.peak*N)); x.fillStyle='#eafff4'; x.fillRect(pi*(sw+gap),0,sw,H); }

  renderVals(){
    const S=this.state,P=this.P,tr=S.tracks,cur=tr[S.track];
    const glyphStyle='width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;font-size:14px;display:grid;place-items:center;color:#5effa8;background:rgba(94,255,168,.1);';
    const miniBtn='width:26px;height:26px;border-radius:7px;border:1px solid rgba(120,180,255,.16);background:rgba(255,255,255,.04);color:#9fb6d8;font-size:12px;cursor:pointer;display:grid;place-items:center;';
    const trackRows=tr.map((t,i)=>({
      title:t.title,
      meta:(t.src||'MIDI')+' · '+this.fmt(t.dur)+' · '+new Set(t.events.map(e=>e.ch+1)).size+' ch',
      glyph:i===S.track?'◆':'◇', glyphStyle,
      style:'display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:10px;border-radius:14px;margin:8px 0;background:'+(i===S.track?'rgba(94,255,168,.10)':'rgba(255,255,255,.035)')+';border:1px solid '+(i===S.track?'rgba(94,255,168,.42)':'rgba(120,180,255,.1)')+';',
      onSelect:()=>this.select(i), onUp:()=>this.move(i,-1), onDown:()=>this.move(i,1), onDel:()=>this.del(i),
    }));
    const present=cur?[...new Set(cur.events.map(e=>e.ch))].sort((a,b)=>a-b):[];
    const chanRows=present.map(i=>({
      i, label:(i+1)+(i===9?'⋆':''), muted:!!this.channels[i].m,
      muteLabel:this.channels[i].m?'○':'●', volPct:this.channels[i].v*100, meterRef:this.chanRefs[i],
      pillStyle:'font-family:\'IBM Plex Mono\',monospace;font-size:12px;text-align:center;padding:5px 0;border-radius:8px;background:hsla('+(i*31)+',80%,60%,.16);color:hsl('+(i*31)+',85%,74%);border:1px solid hsla('+(i*31)+',80%,60%,.3);',
      muteStyle:'width:28px;height:28px;border-radius:8px;border:1px solid rgba(120,180,255,.18);background:'+(this.channels[i].m?'rgba(255,95,95,.16)':'rgba(255,255,255,.04)')+';color:'+(this.channels[i].m?'#ff8f8f':'#8ea3c8')+';font-size:11px;cursor:pointer;display:grid;place-items:center;',
      style:'display:grid;grid-template-columns:40px 1fr 28px;gap:9px;align-items:center;padding:7px 8px;border-radius:11px;margin:5px 0;background:rgba(255,255,255,.03);'+(this.channels[i].m?'opacity:.42;':''),
      onMute:()=>{ this.channels[i].m^=1; this.forceUpdate(); this.saveLater(); },
      onVol:(e)=>{ this.channels[i].v=e.target.value/100; this.saveLater(); },
    }));
    const scenes=[['constellations','Constellations'],['spectrogram','Spectrogram'],['oscilloscope','Oscilloscope'],['pianoroll','Piano Roll']].map(([k,label])=>({
      label, onPick:()=>this.setScene(k),
      style:'border:none;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.01em;padding:7px 13px;border-radius:9px;color:'+(S.scene===k?'#04120b':'#cfe0ff')+';background:'+(S.scene===k?'#5effa8':'transparent')+';font-weight:'+(S.scene===k?'600':'400')+';',
    }));
    const toggleBtn=on=>'display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid '+(on?'rgba(94,255,168,.5)':'rgba(120,180,255,.2)')+';background:'+(on?'rgba(94,255,168,.12)':'rgba(12,18,34,.6)')+';color:'+(on?'#9dffce':'#cfe0ff')+';font:inherit;font-size:12px;cursor:pointer;';
    const panel=(open,side)=>{ if(S.mobile){ return 'position:absolute;left:8px;right:8px;top:auto;bottom:172px;height:44vh;z-index:'+(side==='left'?16:15)+';display:flex;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s;'+(open?'transform:translateY(0);opacity:1;':'transform:translateY(130%);opacity:0;pointer-events:none;'); }
      return 'position:absolute;'+side+':16px;top:90px;bottom:160px;width:322px;z-index:15;display:flex;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s;'+(open?'transform:translateX(0);opacity:1;':'transform:translateX('+(side==='left'?'-':'')+'370px);opacity:0;pointer-events:none;'); };
    const ctrlBtn='width:42px;height:42px;border-radius:50%;border:1px solid rgba(120,180,255,.22);background:rgba(12,18,34,.66);color:#dbe7ff;font-size:15px;cursor:pointer;display:grid;place-items:center;';
    const ctrlBtnA=on=>'width:42px;height:42px;border-radius:50%;border:1px solid '+(on?'rgba(94,255,168,.6)':'rgba(120,180,255,.22)')+';background:'+(on?'rgba(94,255,168,.14)':'rgba(12,18,34,.66)')+';color:'+(on?'#9dffce':'#8ea3c8')+';font-size:14px;cursor:pointer;display:grid;place-items:center;';
    return {
      skyRef:this.skyRef, scopeRef:this.scopeRef, vuRef:this.vuRef, spectrumRef:this.spectrumRef,
      clockRef:this.clockRef, barRef:this.barRef, scrubRef:this.scrubRef, tempoOutRef:this.tempoOutRef, volOutRef:this.volOutRef,
      trackRows, chanRows, scenes, miniBtn, ctrlBtn,
      trackCount:tr.length, chanCount:chanRows.length,
      nowTitle:cur?cur.title:'—', nowSub:cur?(P[S.preset][0]+' · '+cur.events.length+' events'):'No track',
      playGlyph:S.playing?'❚❚':'▶',
      preset:S.preset, presetOptions:Object.keys(P).map(k=>({k,label:P[k][0]})),
      leftPanelStyle:panel(S.leftOpen,'left'), rightPanelStyle:panel(S.rightOpen,'right'),
      leftBtnStyle:toggleBtn(S.leftOpen), rightBtnStyle:toggleBtn(S.rightOpen),
      loopGlyph:S.loop==='one'?'↻¹':'↻', loopStyle:ctrlBtnA(S.loop!=='off'), shuffleStyle:ctrlBtnA(S.shuffle),
      defTempo:Math.round(this.tempoVal*100), defTempoLbl:Math.round(this.tempoVal*100)+'%',
      defVol:Math.round(this.volVal*100), defVolLbl:Math.round(this.volVal*100)+'%',
      onPlay:()=>this.play(), onStop:()=>this.stop(), onNext:()=>this.next(), onPrev:()=>this.prev(),
      onLoop:()=>this.cycleLoop(), onShuffle:()=>this.toggleShuffle(),
      onScrub:(e)=>this.seek(e.target.value/1000),
      onPreset:(e)=>this.setState({preset:e.target.value},()=>{ if(this.sendGain)this.sendGain.gain.value=(this.P[this.state.preset][6]||.12)*this.reverb(); this.reschedule(); }),
      onTempoCommit:(e)=>{ this.tempoVal=e.target.value/100; this.reschedule(); this.saveLater(); },
      onTempo:(e)=>{ this.tempoVal=e.target.value/100; if(this.tempoOutRef.current)this.tempoOutRef.current.textContent=Math.round(e.target.value)+'%'; },
      onVol:(e)=>{ this.volVal=e.target.value/100; if(this.master)this.master.gain.value=this.volVal; if(this.volOutRef.current)this.volOutRef.current.textContent=Math.round(e.target.value)+'%'; this.saveLater(); },
      onFiles:(e)=>this.addFiles(e.target.files),
      onDrop:(e)=>{ e.preventDefault(); this.addFiles(e.dataTransfer.files); },
      onDragOver:(e)=>e.preventDefault(),
      onFullscreen:()=>{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); },
      onToggleLeft:()=>this.setState(s=>({leftOpen:!s.leftOpen, rightOpen:s.mobile?false:s.rightOpen})),
      onToggleRight:()=>this.setState(s=>({rightOpen:!s.rightOpen, leftOpen:s.mobile?false:s.leftOpen})),
      onFocusToggle:()=>this.setState(s=>{ const hide=s.leftOpen||s.rightOpen; return {leftOpen:!hide,rightOpen:!hide}; }),
      onExport:()=>this.exportWav(),
    };
  }
}
</script>
