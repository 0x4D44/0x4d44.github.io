<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Explorer — Fleet Atlas</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head{padding:54px 0 30px;}
  .controls{position:sticky;top:62px;z-index:40;padding:16px 0;margin-bottom:8px;
    background:rgba(4,9,16,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);}
  .ctl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .ctl-lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-right:2px;}
  .search{flex:1;min-width:170px;background:rgba(10,20,34,0.7);border:1px solid var(--hair);border-radius:9px;
    padding:10px 14px;color:var(--ink);font-family:var(--mono);font-size:13px;}
  .search::placeholder{color:var(--ink-3);}
  .search:focus{outline:none;border-color:var(--cyan);box-shadow:var(--glow);}
  select.sel{background:rgba(10,20,34,0.7);border:1px solid var(--hair);border-radius:9px;padding:10px 14px;color:var(--ink);font-family:var(--mono);font-size:12px;cursor:pointer;}
  .seg{display:flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden;}
  .seg button{background:transparent;border:none;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 15px;cursor:pointer;transition:.18s;}
  .seg button.on{background:var(--cyan);color:#04121a;font-weight:600;}
  .count{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;}

  /* grid view */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:24px 0 60px;}
  .sc{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--hair);
    background:linear-gradient(165deg,rgba(18,34,54,0.55),rgba(8,16,28,0.5));transition:.22s;display:block;}
  .sc:hover{transform:translateY(-3px);border-color:var(--cc);box-shadow:0 14px 36px rgba(0,0,0,0.4);}
  .sc-top{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .sc-name{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.05;}
  .sc-cls{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cc);margin-top:5px;}
  .sc-year{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap;}
  .sc-sil{display:flex;align-items:flex-end;justify-content:center;min-height:74px;padding:4px 18px 8px;}
  .sc-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);}
  .sc-stats > div{padding:13px 8px;text-align:center;border-right:1px solid var(--hair);}
  .sc-stats > div:last-child{border-right:none;}
  .sc-stats b{font-family:var(--display);font-size:16px;font-weight:600;display:block;}
  .sc-stats span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .badge{position:absolute;top:14px;right:14px;}
  .flame{position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cc);box-shadow:0 0 12px var(--cc);}

  /* scale view */
  .scale-wrap{padding:24px 0 70px;}
  .ruler{position:relative;border-left:1px solid var(--hair);padding-left:0;}
  .srow{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(120,190,230,0.06);cursor:pointer;transition:.15s;}
  .srow:hover{background:rgba(63,224,255,0.04);}
  .srow .meta .nm{font-family:var(--display);font-weight:600;font-size:15px;}
  .srow .meta .mm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:3px;}
  .srow .bar{position:relative;min-height:46px;display:flex;align-items:flex-end;}
  .srow .bar > div svg{width:100%!important;height:auto!important;display:block;}
  .srow .len{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-3);}
  .refnote{font-family:var(--mono);font-size:11px;color:var(--buoy);letter-spacing:.06em;margin:6px 0 18px;display:flex;align-items:center;gap:10px;}
  .reftower{position:relative;margin:0 0 18px;border-bottom:1px dashed rgba(255,180,84,0.4);}
  @media(max-width:680px){.srow{grid-template-columns:120px 1fr;gap:10px;}.srow .meta .nm{font-size:13px;}}
</style>
</head>
<body>
<div class="bg-deep"></div>
<div class="bg-grid"></div>

<section class="head">
  <div class="wrap">
    <div class="eyebrow">Fleet explorer</div>
    <h1 style="font-size:clamp(36px,6vw,68px);margin-top:14px">All hands on deck</h1>
    <p class="muted" style="max-width:560px;margin-top:14px">Every active Royal Caribbean ship. Filter by class or region, sort by size or age, or switch to scale view to see the whole fleet measured against each other — and the Eiffel Tower.</p>
  </div>
</section>

<div class="controls">
  <div class="wrap">
    <div class="ctl-row" style="margin-bottom:12px">
      <span class="ctl-lab">Class</span>
      <div id="classChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="ctl-row">
      <input class="search" id="q" placeholder="Search ships…" autocomplete="off">
      <span class="ctl-lab" style="margin-left:6px">Region</span>
      <select class="sel" id="region">
        <option value="">All regions</option>
        <option>Caribbean</option><option>Bahamas</option><option>Alaska</option>
        <option>Europe</option><option>Asia-Pacific</option>
      </select>
      <select class="sel" id="sort">
        <option value="gt">Sort: largest first</option>
        <option value="gt-">Sort: smallest first</option>
        <option value="year-">Sort: newest first</option>
        <option value="year">Sort: oldest first</option>
        <option value="max">Sort: most berths</option>
        <option value="name">Sort: A–Z</option>
      </select>
      <div class="seg"><button id="vGrid" class="on">Grid</button><button id="vScale">Scale</button></div>
    </div>
    <div style="margin-top:12px"><span class="count" id="count"></span></div>
  </div>
</div>

<div class="wrap">
  <div id="gridView" class="grid"></div>
  <div id="scaleView" class="scale-wrap" style="display:none"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const S = FLEET.SHIPS.slice();
const CL = FLEET.CLASSES;
const state = { class:'', region:'', q:'', sort:'gt', view:'grid' };

/* preselect from ?class= */
const qp = new URLSearchParams(location.search).get('class');
if(qp && CL.find(c=>c.key===qp)) state.class = qp;

/* class chips */
const chips = [{key:'',name:'All classes',accent:'#3fe0ff'}].concat(CL);
document.getElementById('classChips').innerHTML = chips.map(c=>
  `<button class="chip ${state.class===c.key?'active':''}" data-k="${c.key}" style="--cc:${c.accent}">${c.name}${c.key?` · ${c.count}`:''}</button>`).join('');
document.getElementById('classChips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  state.class=b.dataset.k;
  [...document.querySelectorAll('#classChips .chip')].forEach(x=>x.classList.toggle('active',x.dataset.k===state.class));
  render();
};

document.getElementById('q').oninput=e=>{state.q=e.target.value.toLowerCase();render();};
document.getElementById('region').onchange=e=>{state.region=e.target.value;render();};
document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
document.getElementById('vGrid').onclick=()=>setView('grid');
document.getElementById('vScale').onclick=()=>setView('scale');
function setView(v){state.view=v;
  document.getElementById('vGrid').classList.toggle('on',v==='grid');
  document.getElementById('vScale').classList.toggle('on',v==='scale');
  document.getElementById('gridView').style.display=v==='grid'?'grid':'none';
  document.getElementById('scaleView').style.display=v==='scale'?'block':'none';
  render();
}

function filtered(){
  let r=S.filter(s=>
    (!state.class||s.clsKey===state.class)&&
    (!state.region||s.regions.includes(state.region))&&
    (!state.q||s.name.toLowerCase().includes(state.q)||s.cls.toLowerCase().includes(state.q)));
  const [k,desc]=[state.sort.replace('-',''),!state.sort.endsWith('-')];
  // default semantics: gt/max/year => want descending unless name; '-' suffix flips
  r.sort((a,b)=>{
    if(state.sort==='name')return a.name.localeCompare(b.name);
    if(state.sort==='gt')return b.gt-a.gt;
    if(state.sort==='gt-')return a.gt-b.gt;
    if(state.sort==='year-')return b.year-a.year||b.gt-a.gt;
    if(state.sort==='year')return a.year-b.year||b.gt-a.gt;
    if(state.sort==='max')return b.max-a.max;
    return 0;
  });
  return r;
}

function render(){
  const r=filtered();
  document.getElementById('count').textContent=`${r.length} ship${r.length!==1?'s':''} · ${compactGt(r.reduce((a,s)=>a+s.gt,0)).toUpperCase()} combined GT`;
  if(state.view==='grid') renderGrid(r); else renderScale(r);
}

function renderGrid(r){
  document.getElementById('gridView').innerHTML = r.map(s=>{
    const sil=shipSilhouette({lenFt:s.lenFt,decks:s.decks,color:s.accent,w:280,era:'modern'});
    const tag = s.year>=2024?`<span class="chip badge" style="--cc:${s.accent};background:var(--accent,${s.accent});color:#04121a;border-color:${s.accent}">Newest</span>`
      : s.first?`<span class="chip badge" style="border-color:${s.accent};color:${s.accent}">Lead ship</span>`:'';
    return `<a class="sc c-${s.clsKey}" href="ship.html?id=${s.id}" style="--cc:${s.accent}">
      <div class="flame"></div>
      <div class="sc-top">
        <div><div class="sc-name">${s.name}</div><div class="sc-cls">${s.cls} · ${s.year}</div></div>
        <div class="sc-year">${s.flag}<br>flag</div>
      </div>
      <div class="sc-sil">${sil}</div>
      <div class="sc-stats">
        <div><b>${compactGt(s.gt)}</b><span>gross tons</span></div>
        <div><b>${fmt(s.max)}</b><span>max guests</span></div>
        <div><b>${s.decks}</b><span>decks</span></div>
      </div>
    </a>`;
  }).join('') || `<div class="muted mono" style="padding:40px">No ships match these filters.</div>`;
}

function renderScale(r){
  // longest length among ALL ships for consistent scale
  const maxLen = Math.max(...S.map(s=>s.lenFt));
  const pxPerFt = 1; // we use % widths instead
  const eiffelFt = 1083; // Eiffel tower 330m
  const wrap=document.getElementById('scaleView');
  const tower = `<div class="refnote">▦ Reference · Eiffel Tower laid on its side = 330 m (1,083 ft)</div>
    <div class="reftower" style="width:${(eiffelFt/maxLen*100).toFixed(1)}%">
      <div style="height:18px;background:linear-gradient(90deg,rgba(255,180,84,0.5),rgba(255,180,84,0.12));border-radius:3px"></div>
    </div>`;
  wrap.innerHTML = tower + `<div class="ruler">` + r.map(s=>{
    const pct=(s.lenFt/maxLen*100).toFixed(2);
    const sil=shipSilhouette({lenFt:s.lenFt,decks:s.decks,color:s.accent,w:600,era:'modern'});
    return `<div class="srow" onclick="location.href='ship.html?id=${s.id}'">
      <div class="meta"><div class="nm">${s.name}</div><div class="mm">${s.cls} · ${s.year} · ${compactGt(s.gt)} GT</div></div>
      <div class="bar"><div style="width:${pct}%;min-width:60px;filter:drop-shadow(0 0 8px ${s.accent}40)">${sil}</div>
        <div class="len">${s.lenM} m</div></div>
    </div>`;
  }).join('') + `</div>`;
}

__buildFooter();
render();
</script>
</body>
</html>
