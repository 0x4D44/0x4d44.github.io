<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship File — Fleet Atlas</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .shero{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);}
  .shero-glow{position:absolute;top:-30%;right:-5%;width:600px;height:600px;border-radius:50%;filter:blur(80px);opacity:.16;}
  .shero-in{position:relative;z-index:2;padding:46px 0 30px;}
  .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .crumb a:hover{color:var(--cyan);}
  .shero h1{font-size:clamp(38px,6vw,76px);margin:14px 0 0;}
  .shero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,transparent);}
  .pill.dim{border-color:var(--hair);color:var(--ink-2);background:rgba(120,190,230,0.05);}
  .bigsil{display:flex;justify-content:center;align-items:flex-end;margin:24px 0 6px;}

  .keyrow{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin-top:30px;}
  .keyrow > div{background:rgba(8,16,28,0.75);padding:20px 16px;}
  .keyrow .stat-val{font-size:clamp(22px,2.6vw,32px);color:var(--cc);}
  @media(max-width:820px){.keyrow{grid-template-columns:repeat(2,1fr);}.keyrow>div:last-child{grid-column:span 2;}}

  .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:start;margin-top:14px;}
  @media(max-width:880px){.cols{grid-template-columns:1fr;}}
  .blockh{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px;display:flex;align-items:center;gap:9px;}
  .blockh::before{content:"";width:18px;height:1px;background:var(--cyan);}

  .hl{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair);align-items:flex-start;}
  .hl:last-child{border:none;}
  .hl .dot{color:var(--cc);font-family:var(--mono);flex:none;}
  .inc{border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .inc .id{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);}
  .inc p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);}
  .noinc{font-family:var(--mono);font-size:12px;color:var(--aqua);letter-spacing:.06em;display:flex;align-items:center;gap:9px;}

  .sisters{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .sis{padding:13px 16px;border-radius:11px;border:1px solid var(--hair);background:rgba(10,20,34,0.5);transition:.18s;flex:1;min-width:150px;}
  .sis:hover{border-color:var(--cc);transform:translateY(-2px);}
  .sis .sn{font-family:var(--display);font-weight:600;font-size:15px;}
  .sis .sy{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;}
  .sis.cur{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 10%,transparent);}

  .prevnext{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--hair);}
  .pn{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.08em;}
  .pn:hover{color:var(--cyan);}
  .pn small{display:block;color:var(--ink-3);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:5px;}
  .rankbar{height:7px;border-radius:4px;background:rgba(120,190,230,0.12);overflow:hidden;margin-top:8px;}
  .rankbar > div{height:100%;border-radius:4px;background:var(--cc);box-shadow:0 0 10px var(--cc);}
</style>
</head>
<body>
<div class="bg-deep"></div>
<div class="bg-grid"></div>
<div id="app"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const S = FLEET.SHIPS;
const id = new URLSearchParams(location.search).get('id') || 'icon';
const s = S.find(x=>x.id===id) || S[0];
const cc = s.accent;
document.title = s.name + ' — Fleet Atlas';

const sorted = S.slice().sort((a,b)=>b.gt-a.gt);
const sizeRank = sorted.findIndex(x=>x.id===s.id)+1;
const byAge = S.slice().sort((a,b)=>a.year-b.year);
const ageRank = byAge.findIndex(x=>x.id===s.id)+1;
const maxGt = sorted[0].gt;

const sisters = S.filter(x=>x.clsKey===s.clsKey).sort((a,b)=>a.year-b.year);
const idx = sorted.findIndex(x=>x.id===s.id);
const prev = sorted[idx-1], next = sorted[idx+1];

function spec(dt,dd){return dd&&dd!=='—'?`<div class="spec"><dt>${dt}</dt><dd>${dd}</dd></div>`:`<div class="spec"><dt>${dt}</dt><dd class="faint">—</dd></div>`;}

const app = document.getElementById('app');
app.innerHTML = `
<section class="shero c-${s.clsKey}" style="--cc:${cc}">
  <div class="shero-glow" style="background:${cc}"></div>
  <div class="wrap shero-in">
    <div class="crumb"><a href="fleet.html">Fleet</a> &nbsp;/&nbsp; <a href="fleet.html?class=${s.clsKey}">${s.cls}</a> &nbsp;/&nbsp; <span style="color:var(--ink)">${s.name}</span></div>
    <h1>${s.name}</h1>
    <div class="shero-meta">
      <span class="pill">${s.cls}</span>
      <span class="pill dim">Delivered ${s.year}</span>
      <span class="pill dim">${s.fuel}</span>
      <span class="pill dim">Flag · ${s.flag}</span>
      ${s.first?`<span class="pill">Lead ship of class</span>`:''}
      ${s.gt===maxGt?`<span class="pill">Largest in fleet</span>`:''}
    </div>
    <div class="bigsil">${shipSilhouette({lenFt:s.lenFt,decks:s.decks,color:cc,w:Math.round(s.lenFt/1198*660),era:'modern'})}</div>
    <div class="keyrow">
      <div><div class="stat-val">${fmt(s.gt)}</div><div class="stat-lab">gross tons</div></div>
      <div><div class="stat-val">${s.lenM}<span class="stat-unit">m</span></div><div class="stat-lab">length</div></div>
      <div><div class="stat-val">${fmt(s.max)}</div><div class="stat-lab">max guests</div></div>
      <div><div class="stat-val">${s.decks}</div><div class="stat-lab">decks</div></div>
      <div><div class="stat-val">${2026-s.year}<span class="stat-unit">yrs</span></div><div class="stat-lab">in service</div></div>
    </div>
  </div>
</section>

<section class="section" style="--cc:${cc};padding-top:50px">
  <div class="wrap">
    <p style="font-size:clamp(17px,2vw,22px);color:var(--ink);max-width:760px;line-height:1.55;font-family:var(--display);font-weight:400">${s.blurb}</p>

    <div class="cols">
      <div>
        <h3 class="blockh">Full specification</h3>
        <dl style="margin:0">
          ${spec('Ship class', s.cls)}
          ${spec('Delivered', s.year)}
          ${spec('Gross tonnage', fmt(s.gt)+' GT')}
          ${spec('Length', s.lenM+' m · '+fmt(s.lenFt)+' ft')}
          ${spec('Beam', s.beamFt+' ft')}
          ${spec('Decks', s.decks)}
          ${spec('Guests (double occ.)', fmt(s.dbl))}
          ${spec('Guests (maximum)', fmt(s.max))}
          ${spec('Crew', fmt(s.crew))}
          ${spec('Staterooms', fmt(s.rooms))}
          ${spec('Shipyard', s.yard)}
          ${spec('Propulsion', s.fuel)}
          ${spec('Power / drive', s.power)}
          ${spec('Service speed', s.speed?s.speed+' knots':'—')}
          ${spec('Flag state', s.flag)}
          ${spec('Godparent', s.godparent)}
          ${spec('Home port', s.homeport)}
          ${spec('Cruising regions', s.regions.join(' · '))}
          ${spec('Last refurbishment', s.refit)}
        </dl>
      </div>

      <div>
        <h3 class="blockh">Notable for</h3>
        <div style="margin-bottom:34px">
          ${s.highlights.map(h=>`<div class="hl"><span class="dot">◆</span><span>${h}</span></div>`).join('')}
        </div>

        <h3 class="blockh">Incident log</h3>
        ${s.incidents.length? s.incidents.map(i=>`<div class="inc"><div class="id">▲ ${i.date}</div><p>${i.text}</p></div>`).join('')
          : `<div class="noinc">● No major recorded incidents.</div>`}

        <h3 class="blockh" style="margin-top:34px">Fleet ranking</h3>
        <div style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">
          <div style="display:flex;justify-content:space-between"><span>By size</span><span style="color:var(--ink)">#${sizeRank} of ${S.length}</span></div>
          <div class="rankbar"><div style="width:${(s.gt/maxGt*100).toFixed(1)}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:16px"><span>By age (oldest = #1)</span><span style="color:var(--ink)">#${ageRank} of ${S.length}</span></div>
          <div class="rankbar"><div style="width:${(ageRank/S.length*100).toFixed(1)}%"></div></div>
        </div>
      </div>
    </div>

    <div style="margin-top:46px">
      <h3 class="blockh">Sister ships · ${s.cls}</h3>
      <div class="sisters">
        ${sisters.map(x=>`<a class="sis ${x.id===s.id?'cur':''}" href="ship.html?id=${x.id}" style="--cc:${cc}">
          <div class="sn">${x.name}</div><div class="sy">${x.year} · ${compactGt(x.gt)} GT</div></a>`).join('')}
      </div>
    </div>

    <div class="prevnext">
      ${prev?`<a class="pn" href="ship.html?id=${prev.id}"><small>◂ Larger</small>${prev.name}</a>`:`<span></span>`}
      ${next?`<a class="pn" style="text-align:right" href="ship.html?id=${next.id}"><small>Smaller ▸</small>${next.name}</a>`:`<span></span>`}
    </div>
  </div>
</section>
`;
__buildFooter();
</script>
</body>
</html>
