<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare — Fleet Atlas</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .head{padding:54px 0 24px;}
  .head h1{font-size:clamp(36px,6vw,68px);}
  .picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  .addsel{background:rgba(10,20,34,0.7);border:1px solid var(--hair-strong);border-radius:9px;padding:11px 16px;color:var(--ink);font-family:var(--mono);font-size:12.5px;cursor:pointer;}
  .addsel:focus{outline:none;border-color:var(--cyan);}
  .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;}

  .cmp{display:grid;gap:14px;margin-top:30px;overflow-x:auto;padding-bottom:10px;}
  .col{border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:linear-gradient(165deg,rgba(18,34,54,0.5),rgba(8,16,28,0.45));min-width:200px;}
  .col-head{padding:18px;border-bottom:1px solid var(--hair);position:relative;}
  .col-head .x{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:6px;border:1px solid var(--hair);background:transparent;color:var(--ink-3);cursor:pointer;font-family:var(--mono);font-size:13px;line-height:1;}
  .col-head .x:hover{border-color:var(--coral);color:var(--coral);}
  .col-head .cn{font-family:var(--display);font-size:18px;font-weight:600;padding-right:26px;line-height:1.1;}
  .col-head .cc{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cc);margin-top:5px;}
  .col-sil{display:flex;justify-content:center;align-items:flex-end;min-height:60px;padding:10px;}
  .crow2{display:flex;flex-direction:column;}
  .crow2 .cell{padding:12px 16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:3px;position:relative;}
  .crow2 .cell .v{font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
  .crow2 .cell .l{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .crow2 .cell.best .v{color:var(--cyan);}
  .crow2 .cell.best::after{content:"▲ max";position:absolute;right:14px;top:13px;font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--cyan);}
  .empty{border:1px dashed var(--hair-strong);border-radius:14px;min-width:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--mono);font-size:12px;text-align:center;padding:30px;min-height:340px;}
  .quickadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
</style>
</head>
<body>
<div class="bg-deep"></div>
<div class="bg-grid"></div>

<section class="head">
  <div class="wrap">
    <div class="eyebrow">Comparison bench</div>
    <h1>Ship vs. ship</h1>
    <p class="muted" style="max-width:560px;margin:14px 0 22px">Add up to four ships and weigh them spec for spec. The leading value in each row is highlighted.</p>
    <div class="picker">
      <select class="addsel" id="add"><option value="">+ Add a ship…</option></select>
      <span class="hint" id="hint"></span>
    </div>
    <div class="quickadd" id="quick"></div>
  </div>
</section>

<section class="section-sm" style="padding-top:6px">
  <div class="wrap"><div class="cmp" id="cmp"></div></div>
</section>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const S = FLEET.SHIPS;
let sel = ['icon','wonder','quantum','grandeur'].filter(id=>S.find(s=>s.id===id));

const addSel=document.getElementById('add');
function refreshOptions(){
  addSel.innerHTML='<option value="">+ Add a ship…</option>'+
    S.filter(s=>!sel.includes(s.id)).map(s=>`<option value="${s.id}">${s.name} · ${compactGt(s.gt)} GT</option>`).join('');
}
addSel.onchange=e=>{ if(e.target.value&&sel.length<4){sel.push(e.target.value);render();} e.target.value=''; };

/* quick add chips */
document.getElementById('quick').innerHTML = ['icon','oasis','quantum','voyager','radiance','vision','grandeur','symphony']
  .map(id=>{const s=S.find(x=>x.id===id);return `<button class="chip" data-id="${id}">+ ${s.name.replace(' of the Seas','')}</button>`;}).join('');
document.getElementById('quick').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  if(!sel.includes(b.dataset.id)&&sel.length<4){sel.push(b.dataset.id);render();}};

const ROWS=[
  ['gt','Gross tonnage',v=>fmt(v)+' GT',true],
  ['lenM','Length',v=>v+' m',true],
  ['beamFt','Beam',v=>v+' ft',true],
  ['decks','Decks',v=>v,true],
  ['max','Guests (max)',v=>fmt(v),true],
  ['crew','Crew',v=>fmt(v),true],
  ['rooms','Staterooms',v=>fmt(v),true],
  ['year','Delivered',v=>v,false],
  ['speed','Service speed',v=>v?v+' kn':'—',true],
  ['fuel','Propulsion',v=>v,false],
  ['yard','Shipyard',v=>v,false],
  ['flag','Flag',v=>v,false],
  ['homeport','Home port',v=>v,false],
];

function render(){
  refreshOptions();
  document.getElementById('hint').textContent = sel.length>=4?'Maximum of 4 ships — remove one to add another.':`${sel.length} of 4 selected`;
  const ships=sel.map(id=>S.find(s=>s.id===id));
  const cmp=document.getElementById('cmp');
  cmp.style.gridTemplateColumns=`repeat(${Math.max(sel.length,1)},minmax(200px,1fr))`;
  // compute best per numeric row
  const best={};
  ROWS.forEach(([k,,,num])=>{ if(num){best[k]=Math.max(...ships.map(s=>+s[k]||0));} });
  cmp.innerHTML = ships.map(s=>`
    <div class="col" style="--cc:${s.accent}">
      <div class="col-head">
        <button class="x" data-id="${s.id}">✕</button>
        <div class="cn">${s.name}</div>
        <div class="cc">${s.cls} · ${s.year}</div>
        <div class="col-sil">${shipSilhouette({lenFt:s.lenFt,decks:s.decks,color:s.accent,w:170,era:'modern'})}</div>
      </div>
      <div class="crow2">
        ${ROWS.map(([k,lab,fn,num])=>{
          const isBest=num&&(+s[k]||0)===best[k]&&best[k]>0&&ships.length>1;
          return `<div class="cell ${isBest?'best':''}"><span class="v">${fn(s[k])}</span><span class="l">${lab}</span></div>`;
        }).join('')}
        <div class="cell"><a href="ship.html?id=${s.id}" style="font-family:var(--mono);font-size:11px;color:var(--cc);letter-spacing:.1em">OPEN FULL FILE ▸</a></div>
      </div>
    </div>`).join('') || '';
  if(sel.length<4){
    cmp.innerHTML += `<div class="empty">Add a ship<br>to compare</div>`;
  }
  cmp.querySelectorAll('.x').forEach(b=>b.onclick=()=>{sel=sel.filter(id=>id!==b.dataset.id);render();});
}
render();
__buildFooter();
</script>
</body>
</html>
