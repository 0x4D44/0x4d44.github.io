<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESTWHI.EXE — a tour of a 3,952-line Pascal card game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================ tokens ============================ */
  :root {
    --teal: #008080;
    --teal-deep: #006a6a;
    --felt: #1a6a3a;
    --felt-dark: #0e4023;
    --bezel: #c0c0c0;
    --bezel-light: #dfdfdf;
    --bezel-shadow: #808080;
    --bezel-deep: #404040;
    --title-blue: #000080;
    --title-blue-2: #1084d0;
    --paper: #fffef8;
    --ink: #111111;
    --ink-soft: #3a3a3a;
    --ink-mute: #6b6b6b;
    --red: #b00020;
    --red-card: #c0181f;
    --gold: #d4a017;
    --bone: #ece9d8;
    --line: #d6d3c4;
    --highlight: #fff7c2;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--teal);
    /* faint dithered desktop */
    background-image:
      radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px);
    background-size: 4px 4px, 4px 4px;
    background-position: 0 0, 2px 2px;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 100px;
  }

  /* ============================ Win3.1 window chrome ============================ */
  .win {
    background: var(--bezel);
    border-top: 2px solid var(--bezel-light);
    border-left: 2px solid var(--bezel-light);
    border-right: 2px solid var(--bezel-deep);
    border-bottom: 2px solid var(--bezel-deep);
    box-shadow: 1px 1px 0 0 var(--bezel-shadow), 3px 3px 0 0 rgba(0,0,0,.25);
    margin: 28px 0;
    color: var(--ink);
  }
  .win__bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 4px;
    background: linear-gradient(180deg, var(--title-blue-2) 0%, var(--title-blue) 100%);
    color: white;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    user-select: none;
  }
  .win__sys {
    width: 18px; height: 16px;
    background: var(--bezel);
    border-top: 1px solid var(--bezel-light);
    border-left: 1px solid var(--bezel-light);
    border-right: 1px solid var(--bezel-deep);
    border-bottom: 1px solid var(--bezel-deep);
    display: grid;
    place-items: center;
    color: var(--ink);
    flex: 0 0 auto;
  }
  .win__sys::before { content: ""; display: block; width: 10px; height: 2px; background: var(--ink); }
  .win__title { flex: 1 1 auto; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win__min, .win__max {
    width: 18px; height: 16px;
    background: var(--bezel);
    border-top: 1px solid var(--bezel-light);
    border-left: 1px solid var(--bezel-light);
    border-right: 1px solid var(--bezel-deep);
    border-bottom: 1px solid var(--bezel-deep);
    display: grid; place-items: center;
    color: var(--ink); flex: 0 0 auto;
    font-size: 9px; font-weight: 700;
  }
  .win__min::after { content: "▾"; font-size: 8px; transform: translateY(-2px); }
  .win__max::after { content: "▴"; font-size: 8px; transform: translateY(1px); }
  .win__menu {
    background: var(--bezel);
    border-bottom: 1px solid var(--bezel-shadow);
    padding: 2px 6px;
    font-size: 13px;
    display: flex; gap: 16px;
    color: var(--ink);
  }
  .win__menu span { padding: 1px 6px; cursor: default; }
  .win__menu span:hover { background: var(--title-blue); color: white; }
  .win__menu .ul { text-decoration: underline; }
  .win__body {
    background: var(--paper);
    padding: 24px 28px;
    color: var(--ink);
  }
  .win__statusbar {
    background: var(--bezel);
    border-top: 1px solid var(--bezel-light);
    padding: 3px 8px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; gap: 6px;
    min-height: 22px;
  }
  .win__statusbar::before {
    content: "";
    width: 0; height: 0;
    border: 1px inset var(--bezel-shadow);
    flex: 0 0 0;
  }

  /* ============================ typography ============================ */
  h1, h2, h3, h4 { font-family: 'IBM Plex Sans', sans-serif; margin: 0; }
  h1 { font-size: 56px; line-height: 1.02; letter-spacing: -.02em; font-weight: 700; }
  h2 { font-size: 30px; line-height: 1.1; margin: 0 0 14px; font-weight: 700; letter-spacing: -.01em; }
  h3 { font-size: 18px; margin: 0 0 8px; font-weight: 700; }
  p { margin: 0 0 14px; max-width: 70ch; text-wrap: pretty; }
  .lead { font-size: 17px; color: var(--ink-soft); }
  code, .mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .ink-mute { color: var(--ink-mute); }
  .ink-soft { color: var(--ink-soft); }
  a { color: var(--title-blue); }

  /* ============================ Hero ============================ */
  .hero {
    margin-top: 0;
  }
  .hero__body {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 32px;
    padding: 40px 40px 32px;
  }
  .hero h1 .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    background: var(--ink);
    color: var(--paper);
    padding: 4px 8px;
    vertical-align: middle;
    margin-right: 12px;
    letter-spacing: .04em;
    font-weight: 500;
    border-radius: 2px;
  }
  .hero p.lead { font-size: 19px; max-width: 56ch; margin-top: 18px; }
  .hero__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .chip {
    background: var(--bone);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .chip strong { color: var(--ink); font-weight: 600; }

  /* hand of cards illustration */
  .hand {
    position: relative;
    height: 260px;
  }
  .card {
    position: absolute;
    width: 110px;
    height: 156px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 8px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.2);
    font-family: 'IBM Plex Serif', Georgia, serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 8px 10px;
    transform-origin: bottom center;
  }
  .card.red { color: var(--red-card); }
  .card.black { color: var(--ink); }
  .card__pip { font-weight: 700; font-size: 22px; line-height: 1; }
  .card__suit { font-size: 22px; line-height: 1; }
  .card__center { display: grid; place-items: center; font-size: 52px; line-height: 1; }
  .card__pip--br { transform: rotate(180deg); justify-self: end; align-self: end; }
  .card__suit--br { transform: rotate(180deg); justify-self: end; align-self: end; }
  .card__row { display: flex; justify-content: space-between; align-items: flex-start; }

  /* ============================ Grid helpers ============================ */
  .row { display: grid; gap: 24px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: repeat(3, 1fr); }
  .row-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 800px) {
    .row-2, .row-3, .row-4 { grid-template-columns: 1fr; }
    .hero__body { grid-template-columns: 1fr; }
    h1 { font-size: 38px; }
  }

  /* ============================ Cards/Stat blocks ============================ */
  .stat {
    background: var(--bone);
    border: 1px solid var(--line);
    padding: 14px 16px;
    border-radius: 4px;
  }
  .stat__num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.1;
  }
  .stat__lbl {
    font-size: 12px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-top: 4px;
  }

  /* ============================ Win3.1 buttons + controls ============================ */
  .btn {
    background: var(--bezel);
    color: var(--ink);
    border: none;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-top: 2px solid var(--bezel-light);
    border-left: 2px solid var(--bezel-light);
    border-right: 2px solid var(--bezel-deep);
    border-bottom: 2px solid var(--bezel-deep);
    box-shadow: 1px 1px 0 var(--bezel-shadow);
    user-select: none;
  }
  .btn:active, .btn.is-active {
    border-top: 2px solid var(--bezel-deep);
    border-left: 2px solid var(--bezel-deep);
    border-right: 2px solid var(--bezel-light);
    border-bottom: 2px solid var(--bezel-light);
    box-shadow: none;
  }
  .btn--small { padding: 3px 8px; font-size: 12px; }
  .btn[disabled] { color: var(--ink-mute); cursor: not-allowed; }

  .inset {
    background: var(--paper);
    border-top: 2px solid var(--bezel-deep);
    border-left: 2px solid var(--bezel-deep);
    border-right: 2px solid var(--bezel-light);
    border-bottom: 2px solid var(--bezel-light);
    padding: 14px;
    overflow-x: auto;
    min-width: 0;
  }
  .panel {
    background: var(--bezel);
    border-top: 2px solid var(--bezel-light);
    border-left: 2px solid var(--bezel-light);
    border-right: 2px solid var(--bezel-deep);
    border-bottom: 2px solid var(--bezel-deep);
    padding: 14px;
    min-width: 0;
  }

  /* Prevent grid children from expanding past their column. */
  .row > * { min-width: 0; }

  /* ============================ Code blocks ============================ */
  pre.code, .code-block {
    background: #f5f3e7;
    border: 1px solid var(--line);
    border-left: 3px solid var(--title-blue);
    padding: 12px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink);
    overflow-x: auto;
    margin: 12px 0;
    white-space: pre;
  }
  .tok-kw { color: #6f08a4; font-weight: 600; }
  .tok-com { color: #2e7d32; font-style: italic; }
  .tok-str { color: #a04a00; }
  .tok-num { color: #0050a4; }
  .tok-fn { color: #b71c1c; }

  /* Lists with dotted bullets */
  .list { padding-left: 0; list-style: none; margin: 8px 0 16px; }
  .list li {
    position: relative;
    padding-left: 22px;
    margin: 6px 0;
    max-width: 70ch;
  }
  .list li::before {
    content: "♦";
    position: absolute; left: 0; top: 0;
    color: var(--red-card);
  }
  .list--good li::before { content: "♣"; color: #0a6a2e; }
  .list--bad li::before { content: "♠"; color: var(--ink); }
  .list--cur li::before { content: "♥"; color: var(--red-card); }

  /* Section labels */
  .section-label {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    border-radius: 2px;
  }

  /* Architecture diagram */
  .arch {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 800px) { .arch { grid-template-columns: 1fr 1fr; } }
  .arch__node {
    background: var(--bezel);
    border-top: 2px solid var(--bezel-light);
    border-left: 2px solid var(--bezel-light);
    border-right: 2px solid var(--bezel-deep);
    border-bottom: 2px solid var(--bezel-deep);
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    font-family: inherit;
  }
  .arch__node:hover { background: var(--bezel-light); }
  .arch__node.is-active {
    background: var(--title-blue);
    color: white;
    border-top: 2px solid var(--bezel-deep);
    border-left: 2px solid var(--bezel-deep);
    border-right: 2px solid var(--bezel-light);
    border-bottom: 2px solid var(--bezel-light);
  }
  .arch__name { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; }
  .arch__kind { font-size: 11px; opacity: .7; margin-top: 2px; }

  /* Source map */
  .srcmap {
    display: grid;
    grid-template-columns: repeat(40, 1fr);
    gap: 2px;
    margin-top: 12px;
  }
  .srcmap__cell {
    height: 26px;
    background: var(--bone);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .srcmap__cell:hover { outline: 2px solid var(--ink); outline-offset: -1px; z-index: 2; position: relative; }
  .srcmap__legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 12px; }
  .srcmap__sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.2); }

  /* Card encoding */
  .enc {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 20px;
    align-items: center;
  }
  @media (max-width: 800px) { .enc { grid-template-columns: 1fr; } }
  .enc__big {
    background: var(--bone);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1.8;
  }
  .enc__big strong { font-size: 28px; }
  .slider { width: 100%; }
  .slider-row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
  .slider-row label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; min-width: 110px; }
  .grid-of-52 {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 2px;
    margin-top: 14px;
  }
  .gc {
    aspect-ratio: 1/1.4;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    line-height: 1;
  }
  .gc.red { color: var(--red-card); }
  .gc.is-selected { outline: 3px solid var(--gold); outline-offset: 0; transform: translateY(-2px); }

  /* AI table */
  .aitable-wrap { overflow-x: auto; }
  .aitable { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .aitable th, .aitable td { border: 1px solid var(--line); padding: 4px 3px; text-align: center; }
  .aitable th:first-child, .aitable td:first-child { padding: 4px 6px; text-align: right; white-space: nowrap; }
  .aitable th { background: var(--bone); font-weight: 600; }
  .aitable td.is-on { background: var(--highlight); font-weight: 700; }
  .aitable .rank { background: var(--bone); }

  /* Hand builder */
  .hb-deck {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 2px;
  }

  /* Random things felt */
  .felt {
    position: relative;
    background: var(--felt);
    border-top: 3px solid var(--bezel-deep);
    border-left: 3px solid var(--bezel-deep);
    border-right: 3px solid var(--bezel-light);
    border-bottom: 3px solid var(--bezel-light);
    height: 360px;
    overflow: hidden;
    border-radius: 2px;
  }
  .felt__thing {
    position: absolute;
    width: 31px; height: 31px;
    display: grid; place-items: center;
    transition: left .2s linear, top .2s linear;
  }
  .felt__thing svg { width: 26px; height: 26px; }
  .felt__logo {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    display: grid; place-items: center;
    color: white; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    border-radius: 2px;
  }

  /* Trump cycle */
  .trumps { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 6px 0; flex-wrap: wrap; }
  .trumps__suit {
    width: 60px; height: 60px;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 6px;
    display: grid; place-items: center;
    font-size: 30px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.15);
  }
  .trumps__suit.red { color: var(--red-card); }
  .trumps__suit.is-active { outline: 4px solid var(--gold); outline-offset: 2px; }
  .trumps__arrow { font-size: 24px; color: var(--ink-mute); }

  /* Round bar */
  .rounds { display: grid; grid-template-columns: repeat(25, 1fr); gap: 2px; margin-top: 8px; }
  .rounds__cell {
    height: 36px;
    background: var(--bone);
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .rounds__cell.is-here { background: var(--gold); color: var(--ink); font-weight: 700; }
  .rounds__cell.is-passed { background: var(--bezel-light); color: var(--ink-mute); }

  /* Scoring */
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .score-chart { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; height: 180px; }
  .score-chart__bar { background: var(--title-blue); width: 100%; align-self: end; position: relative; }
  .score-chart__bar.match { background: var(--gold); }
  .score-chart__lbl { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-mute); margin-top: 2px; }
  .score-chart__cell { display: grid; grid-template-rows: 1fr auto; }

  /* Timeline */
  .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 800px) { .timeline { grid-template-columns: 1fr; } }
  .tl-item { background: var(--bone); border: 1px solid var(--line); padding: 14px 16px; border-radius: 4px; position: relative; }
  .tl-item__year {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    color: var(--red-card);
    font-size: 22px;
  }
  .tl-item__ver {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--ink);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    display: inline-block;
    margin: 4px 0 6px;
  }

  /* Callouts */
  .callout {
    background: var(--highlight);
    border: 1px solid #e9d36b;
    border-left: 4px solid var(--gold);
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 14px;
    color: var(--ink);
  }
  .callout strong { font-weight: 700; }
  .callout.callout--bad { background: #ffe0e0; border-color: #e8a4a4; border-left-color: var(--red); }
  .callout.callout--good { background: #e2f3e2; border-color: #a5cba5; border-left-color: #2c8a2c; }

  /* Anchored signpost */
  .signpost {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    margin-left: 8px;
  }

  /* Console */
  .console {
    background: #000;
    color: #c0ffc0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 2px;
    min-height: 60px;
  }
  .console .prompt { color: #56ff56; }

  /* Footer */
  footer {
    text-align: center;
    color: rgba(255,255,255,.7);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-top: 28px;
  }

  /* Utility */
  .gap-16 { margin-top: 16px; }
  .gap-24 { margin-top: 24px; }
  .kbd {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bezel);
    border-top: 1px solid var(--bezel-light);
    border-left: 1px solid var(--bezel-light);
    border-right: 1px solid var(--bezel-deep);
    border-bottom: 1px solid var(--bezel-deep);
    padding: 1px 6px;
    font-size: 11.5px;
  }
  .pill {
    display: inline-block;
    background: var(--title-blue);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
