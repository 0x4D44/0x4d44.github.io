name: PMR final review corrections
on:
  push:
    branches: ['feat/polymyalgia-visual-guide']
    paths: ['.github/workflows/pmr-final-review.yml']
permissions:
  contents: write
jobs:
  corrections:
    if: github.ref == 'refs/heads/feat/polymyalgia-visual-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/polymyalgia-visual-guide
          sparse-checkout: |
            polymyalgia
            .github/workflows
      - name: Apply exact, source-checked edits
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('polymyalgia/index.html')
          text = p.read_text()
          replacements = [
            ('online 20 December 2025, publication 2026', 'online 21 December 2025, publication April 2026'),
            ('Methotrexate or placebo alongside glucocorticoid treatment.', 'Methotrexate or placebo alongside the same 24-week glucocorticoid-tapering protocol.'),
            ('<strong>Endpoint:</strong> glucocorticoid-free remission at week 52.', '<strong>Endpoint:</strong> PMR activity score below 10 and no glucocorticoid use at week 52. The primary statistical test was one-sided.'),
            ('A population-based Norwegian cohort followed for up to 38 years', 'A population-based Norwegian cohort observed over a 38-year study period'),
            ('Original PMR molecular and tofacitinib study.', 'Ma X et al. EAST PMR: an open-label randomised tofacitinib trial.'),
            ('Author-institution abstract; also listed by', 'Author-institution abstract; publication date cross-checked in <a href="https://pubmed.ncbi.nlm.nih.gov/42481270/">PubMed</a>; also listed by'),
            ('The methotrexate and PMR-SPARE summaries use their published abstracts/indexed records.', 'The methotrexate, PMR-SPARE and REPLENISH summaries use their published abstracts/indexed records.')
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          text = re.sub(r'<a class="cite" href="#ref-(\d+)">', lambda m: f'<a class="cite" href="#ref-{m[1]}" aria-label="Source {m[1]}">', text)
          p.write_text(text)
          p = Path('polymyalgia/tests/test_browser.py')
          text = p.read_text()
          start = text.index('            for target in [\'#title\',')
          end = text.index('    def test_keyboard_and_reduced_motion', start)
          replacement = '''            for target in [None, '#anatomy-lab', '#trial-lab', '#sources']:
                          if target is None:
                              self.page.evaluate('window.scrollTo(0,0)')
                          else:
                              self.page.locator(target).scroll_into_view_if_needed()
                          self.assertLessEqual(self.page.evaluate('document.documentElement.scrollWidth-document.documentElement.clientWidth'), 1, (width, target))
                          # Ordinary prose can scroll beneath the opaque masthead.
                          # Test every control initially, then all pinned controls.
                          covered = self.page.evaluate("""atTop => [...document.querySelectorAll('a,button,input,select,summary')].filter(e => {
                            const s=getComputedStyle(e), r=e.getBoundingClientRect();
                            let pinned=false;
                            for(let n=e;n;n=n.parentElement) {
                              if(['fixed','sticky'].includes(getComputedStyle(n).position)) { pinned=true; break; }
                            }
                            return (atTop||pinned) && s.visibility!=='hidden' && s.display!=='none' && r.width>0 && r.height>0 && r.left<112 && r.right>0 && r.top<41 && r.bottom>0;
                          }).map(e=>e.outerHTML.slice(0,180))""", target is None)
                          self.assertEqual(covered, [], (width, target, covered))
                          for control in self.page.locator('.mast-actions a:visible, .mast-actions button:visible').all():
                              self.assertTrue(control.evaluate("""e => {
                                const r=e.getBoundingClientRect();
                                return e.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2));
                              }"""))
          '''
          text = text[:start] + replacement.rstrip() + '\n' + text[end:]
          compile(text, str(p), 'exec')
          p.write_text(text)
      - name: Validate and commit only reviewed paths; remove this helper
        run: |
          node --check polymyalgia/explorers.js
          node --check data.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/pmr-final-review.yml
          git add -- polymyalgia/index.html polymyalgia/tests/test_browser.py
          git commit -m 'fix(pmr): verify trial definitions and dates; test pinned controls with hit-testing'
          git push origin HEAD:refs/heads/feat/polymyalgia-visual-guide
