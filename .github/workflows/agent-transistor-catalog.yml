name: Publish transistor package atlas

on:
  push:
    branches:
      - agent/transistor-packages

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transistor-packages

      - name: Materialise page and catalog entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transistor-packages
          cat .agent/transistor-page.*.txt > transistor-packages/index.html
          python .agent/patch_catalog.py
          node --check data.js
          grep -q 'slug: "transistor-packages"' data.js
          grep -q 'src="/almanac-back.js"' transistor-packages/index.html
          test "$(wc -c < transistor-packages/index.html)" -gt 70000

      - name: Commit publication and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js transistor-packages/index.html
          git rm -r .agent
          git rm .github/workflows/agent-transistor-catalog.yml
          git commit -m "transistor-packages: add interactive coin-scale atlas"
          git push origin HEAD:agent/transistor-packages
