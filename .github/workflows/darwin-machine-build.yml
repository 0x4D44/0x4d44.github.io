name: Darwin Machine — build and verify

on:
  push:
    branches: [agent/darwin-machine]
    paths:
      - ".darwin-bootstrap/**"
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - ".github/workflows/darwin-machine-build.yml"
  pull_request:
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      # The first branch push is bootstrapped through the connected GitHub API,
      # which can write text but cannot upload a source tree as a git pack. The
      # workflow replaces those temporary chunks with the real, reviewable tree
      # in its first verified commit. Subsequent runs never take this path.
      - name: Expand one-time source bootstrap
        shell: bash
        run: |
          if [[ -d .darwin-bootstrap ]]; then
            wc -c .darwin-bootstrap/part-* .darwin-bootstrap/fix-09-*
            sha256sum .darwin-bootstrap/part-* .darwin-bootstrap/fix-09-*
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.darwin-bootstrap')
          parts = (
              [root / f'part-{index:02d}' for index in range(9)]
              + [root / 'fix-09-0', root / 'fix-09-1']
              + [root / f'part-{index:02d}' for index in range(10, 15)]
          )
          text = ''.join(part.read_text(encoding='utf-8') for part in parts)
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          bad = [(index, character, ord(character)) for index, character in enumerate(text) if character not in alphabet]
          print(f'bootstrap characters={len(text)} invalid={bad[:16]}')
          compact = ''.join(character for character in text if character in alphabet and not character.isspace())
          compact = compact.replace('=', '')
          compact += '=' * ((4 - len(compact) % 4) % 4)
          payload = base64.b64decode(compact, validate=False)
          Path('/tmp/darwin-machine-source.tar.xz').write_bytes(payload)
          print(f'archive bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()}')
          PY
            echo "bb2d367384e67a64cc171b40441a10948d6fb1b8cf990c7566d3ba9315667db9  /tmp/darwin-machine-source.tar.xz" | sha256sum --check --strict
            tar -xJf /tmp/darwin-machine-source.tar.xz
            rm -rf .darwin-bootstrap
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: darwin-machine/rust
          cache-on-failure: true

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Canonicalise Rust formatting
        run: cargo fmt --manifest-path darwin-machine/rust/Cargo.toml --all

      - name: Build Wasm and generate native evidence
        run: ./darwin-machine/scripts/build-wasm.sh

      - name: Integrate the Almanac catalog idempotently
        run: node darwin-machine/scripts/integrate-root.mjs

      - name: Static project and catalog validation
        run: node darwin-machine/tests/validate-static.mjs

      - name: Real-browser acceptance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node darwin-machine/tests/browser.test.mjs

      - name: Repository responsive oracle
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:responsive

      - name: Diff hygiene
        run: git diff --check

      - name: Upload implementation evidence
        uses: actions/upload-artifact@v4
        with:
          name: darwin-machine-evidence
          path: |
            darwin-machine/reports/
            darwin-machine/pkg/build-info.json
          if-no-files-found: error

      - name: Commit materialised source, generated state and root integration
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source, generated output and integration already match."
          else
            git commit -m "feat(darwin-machine): implement the evolutionary laboratory"
            git push
          fi

      - name: Require a clean reproducible PR build
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
