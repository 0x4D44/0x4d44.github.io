name: Darwin Machine — repair, build and verify

on:
  push:
    branches: [agent/darwin-machine]
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-machine-repair-agent-darwin-machine
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/darwin-machine

      - name: Remove accidentally tracked build products
        shell: bash
        run: |
          git rm -r --ignore-unmatch darwin-machine/rust/target
          git rm -f --ignore-unmatch darwin-machine/reports/rustfmt-diagnostic.txt
          printf '/target/\n' > darwin-machine/rust/.gitignore

      - name: Apply findings from the final adversarial review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("darwin-machine/rust/crates/darwin-core/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''            "first-replicator" => {
                let mut config = WorldConfig::default();
                config.width = 48;
                config.height = 32;
                config.mutation = MutationConfig {
                    substitution_ppm: 0,
                    insertion_ppm: 0,
                    deletion_ppm: 0,
                };
                config.occupancy_policy = OccupancyPolicy::EmptyOnly;''',
                  '''            "first-replicator" => {
                let config = WorldConfig {
                    width: 48,
                    height: 32,
                    mutation: MutationConfig {
                        substitution_ppm: 0,
                        insertion_ppm: 0,
                        deletion_ppm: 0,
                    },
                    occupancy_policy: OccupancyPolicy::EmptyOnly,
                    ..WorldConfig::default()
                };''',
                  "first-replicator preset construction",
              ),
              (
                  '''            "mutation-meltdown" => {
                let mut config = WorldConfig::default();
                config.width = 96;
                config.height = 64;
                config.mutation = MutationConfig {
                    substitution_ppm: 28_000,
                    insertion_ppm: 12_000,
                    deletion_ppm: 12_000,
                };''',
                  '''            "mutation-meltdown" => {
                let config = WorldConfig {
                    width: 96,
                    height: 64,
                    mutation: MutationConfig {
                        substitution_ppm: 28_000,
                        insertion_ppm: 12_000,
                        deletion_ppm: 12_000,
                    },
                    ..WorldConfig::default()
                };''',
                  "mutation-meltdown preset construction",
              ),
              (
                  '''            "bottleneck" => {
                let mut config = WorldConfig::default();
                config.width = 96;
                config.height = 64;
                config.mutation = MutationConfig {
                    substitution_ppm: 2_000,
                    insertion_ppm: 2_500,
                    deletion_ppm: 2_500,
                };''',
                  '''            "bottleneck" => {
                let config = WorldConfig {
                    width: 96,
                    height: 64,
                    mutation: MutationConfig {
                        substitution_ppm: 2_000,
                        insertion_ppm: 2_500,
                        deletion_ppm: 2_500,
                    },
                    ..WorldConfig::default()
                };''',
                  "bottleneck preset construction",
              ),
              (
                  '''            "blue-nutrient" => {
                let mut config = WorldConfig::default();
                config.width = 96;
                config.height = 64;
                config.capabilities = CAP_LOGIC | CAP_MOVE | CAP_SIGNAL | CAP_SHARE;
                config.resource_replenish = 2;
                config.logic_reward = 120;
                config.seasonal_period = 600;''',
                  '''            "blue-nutrient" => {
                let config = WorldConfig {
                    width: 96,
                    height: 64,
                    capabilities: CAP_LOGIC | CAP_MOVE | CAP_SIGNAL | CAP_SHARE,
                    resource_replenish: 2,
                    logic_reward: 120,
                    seasonal_period: 600,
                    ..WorldConfig::default()
                };''',
                  "blue-nutrient preset construction",
              ),
              (
                  "            15 | 16 | 17 => {",
                  "            15..=17 => {",
                  "conditional opcode range",
              ),
              (
                  '''pub fn sandbox_trace(genome: &[u8], steps: u32) -> Result<SandboxTrace, String> {
    let mut config = WorldConfig::default();
    config.width = 3;
    config.height = 3;
    config.instructions_per_update = 1;
    config.mutation = MutationConfig {
        substitution_ppm: 0,
        insertion_ppm: 0,
        deletion_ppm: 0,
    };
    config.occupancy_policy = OccupancyPolicy::EmptyOnly;
    config.min_genome = 1;
    config.max_genome = MAX_GENOME_HARD as u16;''',
                  '''pub fn sandbox_trace(genome: &[u8], steps: u32) -> Result<SandboxTrace, String> {
    let config = WorldConfig {
        width: 3,
        height: 3,
        instructions_per_update: 1,
        mutation: MutationConfig {
            substitution_ppm: 0,
            insertion_ppm: 0,
            deletion_ppm: 0,
        },
        occupancy_policy: OccupancyPolicy::EmptyOnly,
        min_genome: 1,
        max_genome: MAX_GENOME_HARD as u16,
        ..WorldConfig::default()
    };''',
                  "sandbox configuration construction",
              ),
              (
                  '''        let mut config = WorldConfig::default();
        config.width = 8;
        config.height = 8;
        config.max_fossils = 4;
        config.max_genotypes = 132;
        let mut world = World::new(config, 9, "prune-test").unwrap();''',
                  '''        let config = WorldConfig {
            width: 8,
            height: 8,
            max_fossils: 4,
            max_genotypes: 132,
            ..WorldConfig::default()
        };
        let mut world = World::new(config, 9, "prune-test").unwrap();''',
                  "bounded-history test configuration",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} site, found {count}")
              source = source.replace(old, new)
              print(f"Applied {label}.")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: darwin-machine/rust
          cache-on-failure: true

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Canonicalise Rust formatting
        run: cargo fmt --manifest-path darwin-machine/rust/Cargo.toml --all

      - name: Build Wasm and generate native evidence
        run: ./darwin-machine/scripts/build-wasm.sh

      - name: Integrate the Almanac catalog idempotently
        run: node darwin-machine/scripts/integrate-root.mjs

      - name: Static project and catalog validation
        run: node darwin-machine/tests/validate-static.mjs

      - name: Real-browser acceptance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node darwin-machine/tests/browser.test.mjs

      - name: Repository responsive oracle
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:responsive

      - name: Diff hygiene and build-product exclusion
        shell: bash
        run: |
          git diff --check
          if git status --short | grep -E 'darwin-machine/rust/target|rustfmt-diagnostic'; then
            echo "Build products escaped their ignore boundary." >&2
            exit 1
          fi

      - name: Upload implementation evidence
        uses: actions/upload-artifact@v4
        with:
          name: darwin-machine-final-review-${{ github.run_id }}
          path: |
            darwin-machine/reports/
            darwin-machine/pkg/build-info.json
          if-no-files-found: error

      - name: Commit the fully verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A darwin-machine data.js index.html package.json wrk_journals/2026-08-01-darwin-machine.md
          if git diff --cached --quiet; then
            echo "No reviewed repair remained to commit."
          else
            git commit -m "fix(darwin-machine): complete final adversarial review"
            git push origin HEAD:agent/darwin-machine
          fi
