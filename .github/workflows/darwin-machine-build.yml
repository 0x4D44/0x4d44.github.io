name: Darwin Machine — build and verify

on:
  push:
    branches: [agent/darwin-machine]
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  pull_request:
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: darwin-machine/rust
          cache-on-failure: true

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Apply reviewed Rust corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("darwin-machine/rust/crates/darwin-core/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1:
                  source = source.replace(old, new)
                  print(f"Applied {label}.")
              elif old_count == 0 and new_count == 1:
                  print(f"{label} already materialised.")
              else:
                  raise SystemExit(
                      f"Expected one known {label} site or its corrected form; "
                      f"old={old_count} new={new_count}"
                  )

          replace_once(
              "if self.max_genotypes as usize < required_genotypes || self.max_genotypes > 200_000 {",
              "if (self.max_genotypes as usize) < required_genotypes || self.max_genotypes > 200_000 {",
              "cast comparison correction",
          )
          replace_once(
              "            genotype_count,\n            lineage_count: lineages.len() as u32,",
              "            genotype_count,\n            retired_genotype_count: self.retired_genotypes,\n            lineage_count: lineages.len() as u32,",
              "retired-genotype statistics sample",
          )
          replace_once(
              "            let mut signal = ExecSignal::Continue;\n",
              "",
              "unused execution-signal initialisation removal",
          )
          replace_once(
              "                signal =\n                    self.execute_instruction(cell_index, &mut organism, &mut births, &mut moves);",
              "                let signal =\n                    self.execute_instruction(cell_index, &mut organism, &mut births, &mut moves);",
              "per-instruction execution signal binding",
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Canonicalise Rust formatting and preserve diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path darwin-machine/rust/Cargo.toml --all > darwin-machine/reports/rustfmt-diagnostic.txt 2>&1
          status=$?
          cat darwin-machine/reports/rustfmt-diagnostic.txt
          exit "$status"

      - name: Build Wasm and generate native evidence
        run: ./darwin-machine/scripts/build-wasm.sh

      - name: Integrate the Almanac catalog idempotently
        run: node darwin-machine/scripts/integrate-root.mjs

      - name: Static project and catalog validation
        run: node darwin-machine/tests/validate-static.mjs

      - name: Real-browser acceptance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node darwin-machine/tests/browser.test.mjs

      - name: Repository responsive oracle
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:responsive

      - name: Diff hygiene
        run: git diff --check

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-machine-evidence-${{ github.run_id }}
          path: |
            darwin-machine/reports/
            darwin-machine/pkg/build-info.json
          if-no-files-found: warn

      - name: Commit canonical source, generated state and integration
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source, generated output and integration already match."
          else
            git commit -m "chore(darwin-machine): record reviewed generated state"
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${branch}"
          fi

      - name: Require a clean reproducible PR build
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
