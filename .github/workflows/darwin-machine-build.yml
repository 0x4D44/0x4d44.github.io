name: Darwin Machine — build and verify

on:
  push:
    branches: [agent/darwin-machine]
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  pull_request:
    paths:
      - "darwin-machine/**"
      - "wrk_journals/2026-08-01-darwin-machine.md"
      - "data.js"
      - "index.html"
      - "package.json"
      - ".github/workflows/darwin-machine-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darwin-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: darwin-machine/rust
          cache-on-failure: true

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Canonicalise Rust formatting and preserve diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path darwin-machine/rust/Cargo.toml --all > darwin-machine/reports/rustfmt-diagnostic.txt 2>&1
          status=$?
          cat darwin-machine/reports/rustfmt-diagnostic.txt
          exit "$status"

      - name: Build Wasm and generate native evidence
        run: ./darwin-machine/scripts/build-wasm.sh

      - name: Integrate the Almanac catalog idempotently
        run: node darwin-machine/scripts/integrate-root.mjs

      - name: Static project and catalog validation
        run: node darwin-machine/tests/validate-static.mjs

      - name: Real-browser acceptance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node darwin-machine/tests/browser.test.mjs

      - name: Repository responsive oracle
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:responsive

      - name: Diff hygiene
        run: git diff --check

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-machine-evidence-${{ github.run_id }}
          path: |
            darwin-machine/reports/
            darwin-machine/pkg/build-info.json
          if-no-files-found: warn

      - name: Commit canonical source, generated state and integration
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source, generated output and integration already match."
          else
            git commit -m "chore(darwin-machine): record verified generated state"
            git push
          fi

      - name: Require a clean reproducible PR build
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
