name: PMR final branch polish
on:
  push:
    branches: ['feat/polymyalgia-visual-guide']
    paths: ['.github/workflows/pmr-branch-bootstrap.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.ref == 'refs/heads/feat/polymyalgia-visual-guide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/polymyalgia-visual-guide
          sparse-checkout: |
            polymyalgia
            .github/workflows
      - name: Apply narrowly scoped reviewed corrections
        shell: python
        run: |
          from pathlib import Path
          def edit(path, changes):
              p=Path(path)
              text=p.read_text()
              for old,new in changes:
                  assert text.count(old)==1, (path,old[:100],text.count(old))
                  text=text.replace(old,new,1)
              p.write_text(text)
          edit('polymyalgia/style.css', [
              ('.hero h1{font-size:3.1rem}', '.hero h1{font-size:clamp(2.4rem,12.5vw,3.1rem)}'),
              ('.node.dim{opacity:.4;border-style:dashed}', '.node.dim{border-style:dashed}.node.dim .glyph{opacity:.4}')
          ])
          edit('polymyalgia/explorers.js', [
              ('`Pooled estimate still receiving glucocorticoids at ${year}', '`Pooled estimate: ${value}% still receiving glucocorticoids at ${year}')
          ])
          p=Path('polymyalgia/index.html')
          text=p.read_text().replace('<a class="cite" href="#ref-29">[29]</a>', '')
          start=text.index('<li id="ref-29">')
          end=text.index('</li>',start)+5
          text=text[:start]+'<li id="ref-29"><a href="https://www.medicines.org.uk/emc/product/11973/smpc">Cosentyx (secukinumab): UK Summary of Product Characteristics.</a><small>Primary product label · emc version updated 19 August 2025, checked 15 September 2026. Section 4.1 does not list PMR in this retrieved version. Separate from the positive 2026 REPLENISH trial.</small></li>'+text[end:]
          p.write_text(text)
          edit('polymyalgia/index.html', [
              ('<span class="pull-number" id="fraction-result">', '<span class="pull-number" id="fraction-result" aria-live="polite">'),
              ('id="artery-lumen" r="43"', 'id="artery-lumen" r="42.8"'),
              ('https://www.sciencedirect.com/science/article/pii/S0003496724020600', 'https://pubmed.ncbi.nlm.nih.gov/26376658/'),
              ('Original imaging study · 2015 · extracapsular inflammation.', 'Original imaging study · 2015 · DOI 10.1136/annrheumdis-2015-207395 · extracapsular inflammation.'),
              ('<a href="https://www.nhs.uk/medicines/methotrexate/how-and-when-to-take-methotrexate/">NHS. How and when to take methotrexate.</a>', '<a href="https://www.nhs.uk/medicines/methotrexate/how-and-when-to-take-methotrexate/">NHS. How and when to take methotrexate.</a> Also: <a href="https://www.nhs.uk/medicines/methotrexate/side-effects-of-methotrexate/">side effects and when to seek help</a>.'),
              ('It is important new phase-3 evidence, not a reason to assume routine PMR availability from a trial result alone.', 'It is important new phase-3 evidence, not a reason to assume routine PMR availability from a trial result alone. The UK product label retrieved for this edition does not list PMR among its indications. <a class="cite" href="#ref-29">[29]</a>'),
              ('<p><strong>Polymyalgia, Explained</strong> · Part of the 0x4D44 Almanac.', '<p><strong>Polymyalgia, Explained</strong> · Part of the 0x4D44 Almanac.<noscript> <a href="/">Return to the Almanac</a>.</noscript>')
          ])
          edit('data.js', [('"slug": "polymyalgia",','"slug": "polymyalgia",\n    "words": 5102,\n    "readingMin": 26,')])
      - name: Validate and remove this temporary write-enabled workflow
        run: |
          node --check polymyalgia/explorers.js
          node --check data.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898281+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/pmr-branch-bootstrap.yml
          git add -- data.js polymyalgia/index.html polymyalgia/style.css polymyalgia/explorers.js
          git commit -m 'fix(pmr): polish mobile layout, source precision and accessible updates; remove bootstrap'
          git push origin HEAD:refs/heads/feat/polymyalgia-visual-guide
