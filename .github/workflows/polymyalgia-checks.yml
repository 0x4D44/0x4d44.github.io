name: Polymyalgia guide checks
on:
  push:
    branches: ['feat/polymyalgia-visual-guide']
    paths: ['polymyalgia/**', 'data.js', 'almanac-back.js', '.github/workflows/polymyalgia-checks.yml']
  pull_request:
    paths: ['polymyalgia/**', 'data.js', 'almanac-back.js', '.github/workflows/polymyalgia-checks.yml']
permissions:
  contents: read
concurrency:
  group: pmr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            polymyalgia
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/pmr-axe --no-audit --no-fund axe-core@4.10.3
      - name: Check JavaScript syntax
        run: |
          node --check polymyalgia/explorers.js
          node --check data.js
      - name: Run browser, accessibility and integration tests
        env:
          AXE_SCRIPT: /tmp/pmr-axe/node_modules/axe-core/axe.min.js
          PMR_TEST_OUTPUT: test-results/polymyalgia
        run: python -m unittest discover -s polymyalgia/tests -v
      - name: Export review bundle and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymyalgia-review
          path: |
            polymyalgia
            data.js
            index.html
            style.css
            app.js
            almanac-back.js
            test-results/polymyalgia
            /tmp/pmr-axe/node_modules/axe-core/axe.min.js
          retention-days: 14
