[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scribeprint-model"
version = "0.1.0"
description = "Leakage-safe training and evaluation tools for Scribeprint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "0x4D44" }]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
benchmark = [
  "datasets>=3,<5",
  "huggingface-hub>=0.28,<2",
]
dev = ["pytest>=8,<10"]

[project.scripts]
scribeprint-import-m4 = "scribeprint_model.import_m4:main"
scribeprint-baseline = "scribeprint_model.baseline:main"
scribeprint-evaluate = "scribeprint_model.evaluate:main"
scribeprint-audit = "scribeprint_model.audit:main"
scribeprint-human-benchmark = "scribeprint_model.human_benchmark:main"
scribeprint-human-evaluate = "scribeprint_model.human_evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
