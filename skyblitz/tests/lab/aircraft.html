<!doctype html>
<meta charset="utf-8">
<title>skyblitz lab: aircraft</title>
<!-- Aircraft lab. ?craft=falcon&livery=0&view=three|top|side|front|rear|under   ?all=1[&livery=n] shows the whole roster in a row
     ?fly=1 : fly-by with vapour trails (needs Fx).  ?spin=0 stops the turntable.  window.__lab.ready / __lab.info -->
<style>html,body{margin:0;background:#000;overflow:hidden;font:12px system-ui;color:#fff}canvas{display:block}#hud{position:fixed;left:8px;bottom:8px;white-space:pre;text-shadow:0 0 3px #000}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.min.js","three/addons/":"../../vendor/addons/"}}</script>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { AIRCRAFT } from '../../src/craft/roster.js';
import { buildAircraft, updateAircraft } from '../../src/craft/aircraft.js';
import { makeSkyEnvironment } from '../../src/craft/env.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fb2f0);
scene.fog = new THREE.Fog(0x9cc4f2, 80, 400);
scene.environment = makeSkyEnvironment(renderer);
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2); sun.position.set(25, 40, 18); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 }); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd8ff, 0x6a7a55, 0.7));
const floor = new THREE.Mesh(new THREE.CircleGeometry(300, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5f8f57, roughness: 1 }));
floor.position.y = -6; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 1000);
const hud = document.getElementById('hud');

const fakeRacer = { controls: { roll: 0, pitch: 0, yaw: 0, boost: false }, flight: { throttle: 0.85, boost: { active: false, meter: 50 } }, tumble: 0 };
let models = [], t0 = 0, view = q.get('view') || 'three', spin = q.get('spin') !== '0';
const all = q.has('all');
function setup() {
  for (const m of models) scene.remove(m); models = [];
  const lv = Number(q.get('livery') || 0);
  const list = all ? AIRCRAFT : [AIRCRAFT.find((a) => a.id === (q.get('craft') || 'falcon')) || AIRCRAFT[0]];
  const info = [];
  list.forEach((spec, i) => {
    const m = buildAircraft(spec, lv, { scene, renderer }); const tb = performance.now();
    m.position.set(all ? (i - (list.length - 1) / 2) * 17 : 0, 0, 0); scene.add(m); models.push(m);
    info.push(`${spec.id}: tris ${m.userData.tris} meshes ${m.userData.draws}`);
  });
  hud.textContent = info.join('\n');
  window.__lab.info = info;
}
function frame(now) {
  const t = now / 1000;
  fakeRacer.controls.roll = Math.sin(t * 0.9) * (q.has('anim') ? 1 : 0); fakeRacer.controls.pitch = Math.sin(t * 0.6) * (q.has('anim') ? 1 : 0);
  fakeRacer.flight.boost.active = q.has('boost');
  for (const m of models) updateAircraft(m, fakeRacer, 1 / 60);
  const ang = (spin ? t * 0.35 : 0) + Number(q.get('az') || 0.6);
  let r = all ? 56 : Math.max(...models.map((m) => m.userData.radius)) * 2.3, el = 0.22;
  let tx = 0, ty = 0.4, tz = 0, cx, cy, cz;
  if (view === 'top') { el = 1.4; r *= 0.9; } else if (view === 'side') { el = 0.02; } else if (view === 'front') { el = 0.08; } else if (view === 'rear') { el = 0.1; } else if (view === 'under') { el = -0.9; }
  const az = view === 'front' ? Math.PI : view === 'rear' ? 0 : view === 'side' ? Math.PI / 2 : view === 'top' || view === 'under' ? 0.15 : ang;
  cx = Math.sin(az) * Math.cos(el) * r; cz = Math.cos(az) * Math.cos(el) * r; cy = Math.sin(el) * r + ty;
  if (view === 'three' && q.get('az')) { /* fixed */ }
  cam.position.set(cx, cy, cz); cam.lookAt(tx, ty, tz);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
window.__lab = { ready: false, info: [], setView(v) { view = v; }, THREE, renderer, scene };
setup(); window.__lab.ready = true; requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
</script>
