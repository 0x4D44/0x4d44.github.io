<title>0x4D44 — Documents</title>
<meta name="description" content="A small, growing collection of standalone documents and essays by 0x4D44." />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<div class="paper-bg" aria-hidden="true"></div>
<div class="scan-bg" aria-hidden="true"></div>
<div class="noise-bg" aria-hidden="true"></div>

<main class="wrap">

  <header class="masthead">
    <div class="kicker">─── 0x4D44 :: ALMANAC ─── BUILT <span id="build-date">2026</span> ──</div>
    <h1 class="title">
      <span class="amber">$</span> documents <span class="amber">--list</span>
    </h1>
    <p class="lede">
      A small, growing collection of standalone pieces. Filed by hand,
      indexed by machine, served as static HTML.
    </p>
    <a href="about.html" class="whoami">$ whoami →</a>
  </header>

  <div class="statusbar" id="statusbar">
    <span id="stat-tot"></span>
    <span id="stat-last"></span>
    <span class="online">● online</span>
  </div>

  <section class="controls">
    <div class="frame">
      <div class="frame-title">┌── filter:tag ──</div>
      <div class="btn-row" id="filter-row"></div>
    </div>
    <div class="frame">
      <div class="frame-title">┌── sort:by ──</div>
      <div class="btn-row" id="sort-row"></div>
    </div>
    <div class="frame">
      <div class="frame-title">┌── view:layout ──</div>
      <div class="btn-row" id="layout-row"></div>
    </div>
  </section>

  <section class="listing" id="listing" aria-live="polite"></section>

  <footer class="page-footer">
    <span>$ end-of-stream</span>
    <span>// hosted on <a href="https://pages.github.com/">github pages</a></span>
    <span class="cursor">_</span>
  </footer>

</main>
