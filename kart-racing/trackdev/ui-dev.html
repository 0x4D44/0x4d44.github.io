<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UI dev harness</title>
<link rel="stylesheet" href="../style.css">
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>
html,body{margin:0;height:100%;background:#0a1030;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 70%,#3a6a2a 0 18%,transparent 19%),linear-gradient(180deg,#7ec8ff 0 42%,#4a8f3a 42% 60%,#555 60%)}
#fakepill{position:fixed;left:0;top:0;width:109px;height:41px;background:#e33;color:#fff;font:12px sans-serif;z-index:99;display:flex;align-items:center;justify-content:center;opacity:.85;pointer-events:none}
</style></head><body>
<div id="fakepill">&larr; Almanac</div>
<div id="ui"></div>
<script type="module">
import { ROSTER } from "../roster.js";
let TD, outlinePoints, buildKartMesh;
try { const m = await import("../trackdefs.js"); TD = m.TRACK_DEFS; outlinePoints = m.outlinePoints; } catch (e) { console.log("no trackdefs", e.message); }
try { const m = await import("../kart.js"); buildKartMesh = m.buildKartMesh; } catch (e) { console.log("no kart.js", e.message); }
if (!TD) {
  const mk = (id, name, d, pts, blurb) => ({ id, name, blurb, difficulty: d, laps: 3, theme: id, width: 18, points: pts });
  TD = [
    mk("sunset", "Sunset Coast", 1, [[0,0],[120,-20],[220,40],[250,140],[180,220],[60,200],[-20,260],[-120,220],[-150,120],[-80,50]], "Sweeping seaside bends under a low orange sun."),
    mk("snow", "Frostbite Pass", 2, [[0,0],[100,-60],[200,-20],[160,60],[240,120],[140,200],[40,150],[-40,210],[-140,150],[-100,60]], "Icy hairpins and pine-lined drops."),
    mk("neon", "Neon Docks", 3, [[0,0],[160,0],[240,60],[200,140],[100,120],[60,200],[-60,220],[-140,140],[-100,40]], "Night racing between cranes and glowing containers."),
  ];
}
const { UI } = await import("../ui.js");
const ui = new UI(document.getElementById("ui"), { roster: ROSTER, trackDefs: TD, outlinePoints, buildKartMesh });
window.ui = ui;
ui.setBestTimes({ [TD[0].id]: { bestLap: 52.318, bestRace: 161.904 }, [TD[1].id]: 71.2 });
ui.onSettings = (s) => console.log("settings", JSON.stringify(s));
const started = (o) => { console.log("START", JSON.stringify(o)); ui.toast("Start: " + JSON.stringify(o)); };
const q = new URLSearchParams(location.search), scr = q.get("screen") || "title";

// fake HUD data
function mmPts() { const P = []; const def = TD[0]; const pts = outlinePoints ? outlinePoints(def, 160) : null;
  if (pts) return pts.map(p => ({ x: p.x, z: p.z ?? p.y }));
  for (let i = 0; i < 160; i++) { const a = i / 160 * Math.PI * 2; P.push({ x: Math.cos(a) * 200 + Math.sin(a * 3) * 40, z: Math.sin(a) * 130 }); } return P; }
const pts = mmPts();
const bounds = pts.reduce((b, p) => ({ minX: Math.min(b.minX, p.x), maxX: Math.max(b.maxX, p.x), minZ: Math.min(b.minZ, p.z), maxZ: Math.max(b.maxZ, p.z) }), { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9 });
let T0 = performance.now(), hudItem = q.get("item") || "boost", rolling = q.get("roll") === "1";
function hud() {
  const t = (performance.now() - T0) / 1000;
  ui.updateHUD({ place: 3, racers: 8, lap: 2, laps: 3, speedKmh: 128 + Math.sin(t) * 20, item: rolling ? null : hudItem, itemCount: hudItem === "triple" ? 3 : 1, rolling, rollIcon: null,
    time: 83.4 + t, lapTime: 31.2 + t, bestLap: 52.318, wrongWay: q.get("wrong") === "1", boostPct: (t * .25) % 1,
    minimap: { points: pts, bounds, karts: ROSTER.map((k, i) => { const p = pts[(i * 18 + Math.floor(t * 10)) % pts.length]; return { x: p.x, z: p.z, color: k.color, isPlayer: i === 2, place: i + 1 }; }) },
    standings: ROSTER.map((k, i) => ({ place: i + 1, name: k.name, color: k.color, isPlayer: i === 2 })) });
  requestAnimationFrame(hud);
}
const rows = ROSTER.map((k, i) => ({ place: i + 1, name: k.name, color: k.color, isPlayer: i === 2, time: 150 + i * 3.17, bestLap: 49.1 + i * .6, dnf: i === 7, points: [15,12,10,8,6,4,2,1][i], totalPoints: [15,12,10,8,6,4,2,1][i] * 2 }));
rows[7].time = null;
const cupSt = ROSTER.map((k, i) => ({ name: k.name, color: k.color, isPlayer: i === 2, points: 60 - i * 6 }));
const cbs = { onNext: () => console.log("next"), onRetry: () => console.log("retry"), onMenu: () => console.log("menu") };
const base = { trackName: TD[0].name, mode: "race", laps: 3, difficulty: "normal", playerPlace: 3, bestLap: 50.2, newRecord: true, totalTime: 153.2, rows };
const S = {
  title: () => ui.showTitle(() => { console.log("title->menu"); ui.showMenu({ onStart: started }); }),
  menu: () => ui.showMenu({ onStart: started }),
  kart: () => { ui.showMenu({ onStart: started }); ui.openScreen("kart", "race"); },
  track: () => { ui.showMenu({ onStart: started }); ui.openScreen("track", "race"); },
  cuptrack: () => { ui.showMenu({ onStart: started }); ui.openScreen("track", "cup"); },
  settings: () => { ui.showMenu({ onStart: started }); ui.openScreen("settings"); },
  how: () => { ui.showMenu({ onStart: started }); ui.openScreen("how"); },
  best: () => { ui.showMenu({ onStart: started }); ui.openScreen("best"); },
  loading: () => ui.showLoading("Building track", 0.6),
  hud: () => { ui.showHUD(); hud(); },
  countdown: () => { ui.showHUD(); hud(); ui.showCountdown(q.get("n") || "3"); },
  banner: () => { ui.showHUD(); hud(); ui.banner("Final Lap!", 60000); },
  pause: () => { ui.showHUD(); hud(); ui.showPause({ onResume: () => console.log("resume"), onRestart: () => console.log("restart"), onQuit: () => console.log("quit") }); },
  results: () => ui.showResults({ ...base, rows: rows.map(r => ({ ...r, points: null, totalPoints: null })) }, cbs),
  cup: () => ui.showResults({ ...base, mode: "cup", cup: { round: 1, rounds: 3, final: false, standings: cupSt } }, cbs),
  cupfinal: () => ui.showResults({ ...base, mode: "cup", playerPlace: 2, cup: { round: 3, rounds: 3, final: true, standings: cupSt } }, cbs),
};
(S[scr] || S.title)();
window.__ready = true;
</script></body></html>
