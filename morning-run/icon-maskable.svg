<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Morning Run">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#0a2a20"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background for maskable safe-zone; content kept within central 80% -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="350" cy="168" r="40" fill="#fbbf24" opacity="0.95"/>
  <path d="M170 372
           C 170 320, 244 324, 244 286
           C 244 248, 170 253, 170 212
           C 170 172, 252 179, 296 158"
        fill="none" stroke="url(#route)" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="2 42"/>
  <circle cx="170" cy="372" r="27" fill="#0a2a20" stroke="#4ade80" stroke-width="11"/>
  <circle cx="170" cy="372" r="8" fill="#4ade80"/>
</svg>
