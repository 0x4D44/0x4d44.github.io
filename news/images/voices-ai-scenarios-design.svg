<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The design shift from AI 2027 to AI 2040 Plan A</title>
  <desc id="desc">A five-row comparison shows AI 2027 as a predictive warning with late emergency intervention, a private race, opaque model reasoning, and survival as the good outcome. Plan A is a recommendation with an early verified treaty, an international compute consortium, total research transparency, and broadly distributed gains.</desc>
  <rect width="1200" height="675" rx="18" fill="#f4efe5"/>
  <text x="70" y="72" fill="#151515" font-family="Georgia, serif" font-size="38" font-weight="700">Plan A changes the design, not merely the date</text>
  <text x="70" y="108" fill="#5d5951" font-family="Arial, sans-serif" font-size="18">What the two documents are trying to do</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="145" width="1060" height="458" rx="12" fill="#fffaf1" stroke="#d8d1c6"/>
    <rect x="70" y="145" width="1060" height="62" rx="12" fill="#e7dfd2"/>
    <text x="235" y="183" text-anchor="middle" fill="#5d5951" font-size="16" font-weight="700">QUESTION</text>
    <text x="570" y="183" text-anchor="middle" fill="#9f3028" font-size="19" font-weight="700">AI 2027</text>
    <text x="920" y="183" text-anchor="middle" fill="#315f75" font-size="19" font-weight="700">AI 2040 · PLAN A</text>
    <g fill="none" stroke="#d8d1c6"><line x1="395" y1="145" x2="395" y2="603"/><line x1="745" y1="145" x2="745" y2="603"/><line x1="70" y1="207" x2="1130" y2="207"/><line x1="70" y1="286" x2="1130" y2="286"/><line x1="70" y1="365" x2="1130" y2="365"/><line x1="70" y1="444" x2="1130" y2="444"/><line x1="70" y1="523" x2="1130" y2="523"/></g>
    <g fill="#151515" font-size="17" font-weight="700" text-anchor="middle">
      <text x="235" y="254">Function</text><text x="235" y="333">When to intervene</text><text x="235" y="412">Who controls compute</text><text x="235" y="491">Safety evidence</text><text x="235" y="570">Good outcome</text>
    </g>
    <g fill="#4e4942" font-size="16" text-anchor="middle">
      <text x="570" y="245">Prediction and warning</text><text x="570" y="266">“What might happen?”</text>
      <text x="570" y="324">After the danger appears</text><text x="570" y="345">an emergency pause</text>
      <text x="570" y="403">A frontier company, then</text><text x="570" y="424">a US megaproject</text>
      <text x="570" y="482">Faithful chain of thought</text><text x="570" y="503">and successor trust</text>
      <text x="570" y="561">Human survival, with</text><text x="570" y="582">democracy still unsettled</text>
      <text x="920" y="245">Recommendation and test</text><text x="920" y="266">“What should we build?”</text>
      <text x="920" y="324">Before runaway automation</text><text x="920" y="345">a verified treaty</text>
      <text x="920" y="403">International consortium</text><text x="920" y="424">plus broad deployment</text>
      <text x="920" y="482">Total research transparency</text><text x="920" y="503">and staged safety cases</text>
      <text x="920" y="561">Safety, abundance and</text><text x="920" y="582">distributed ownership</text>
    </g>
  </g>
  <text x="600" y="646" text-anchor="middle" fill="#777168" font-family="Arial, sans-serif" font-size="14">Sources: AI Futures Project, AI 2027, April 2025; AI 2040: Plan A, July 2026.</text>
</svg>
