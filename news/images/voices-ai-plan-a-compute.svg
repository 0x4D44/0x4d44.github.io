<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Plan A's projected growth in world AI compute</title>
  <desc id="desc">A logarithmic line chart shows world AI compute rising from 20 million H100 equivalents in 2026 to 60 billion in 2034, a three-thousand-fold increase in eight years.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b54136" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#b54136" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="18" fill="#f4efe5"/>
  <text x="70" y="70" fill="#151515" font-family="Georgia, serif" font-size="37" font-weight="700">The plan slows the race — after a 3,000× build-out</text>
  <text x="70" y="105" fill="#5d5951" font-family="Arial, sans-serif" font-size="18">Projected world AI compute, H100 equivalents · logarithmic scale</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#666158">
    <line x1="150" y1="500" x2="1080" y2="500" stroke="#c8c0b3" stroke-width="1"/>
    <line x1="150" y1="402.5" x2="1080" y2="402.5" stroke="#d8d1c6" stroke-width="1" stroke-dasharray="5 7"/>
    <line x1="150" y1="305" x2="1080" y2="305" stroke="#d8d1c6" stroke-width="1" stroke-dasharray="5 7"/>
    <line x1="150" y1="207.5" x2="1080" y2="207.5" stroke="#d8d1c6" stroke-width="1" stroke-dasharray="5 7"/>
    <line x1="150" y1="110" x2="1080" y2="110" stroke="#d8d1c6" stroke-width="1" stroke-dasharray="5 7"/>
    <text x="130" y="506" text-anchor="end">10m</text>
    <text x="130" y="408" text-anchor="end">100m</text>
    <text x="130" y="311" text-anchor="end">1bn</text>
    <text x="130" y="214" text-anchor="end">10bn</text>
    <text x="130" y="116" text-anchor="end">100bn</text>
  </g>

  <path d="M170 471 L510 334 L740 258 L1040 127 L1040 500 L170 500 Z" fill="url(#area)"/>
  <path d="M170 471 L510 334 L740 258 L1040 127" fill="none" stroke="#9f3028" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <circle cx="170" cy="471" r="9" fill="#f4efe5" stroke="#9f3028" stroke-width="5"/>
      <circle cx="510" cy="334" r="9" fill="#f4efe5" stroke="#9f3028" stroke-width="5"/>
      <circle cx="740" cy="258" r="9" fill="#f4efe5" stroke="#9f3028" stroke-width="5"/>
      <circle cx="1040" cy="127" r="11" fill="#9f3028" stroke="#f4efe5" stroke-width="4"/>
    </g>
    <g fill="#151515" font-size="20" font-weight="700">
      <text x="170" y="443">20m</text>
      <text x="510" y="304">500m</text>
      <text x="740" y="228">3bn</text>
      <text x="1040" y="166">60bn</text>
    </g>
    <g fill="#5d5951" font-size="17">
      <text x="170" y="535">2026</text>
      <text x="510" y="535">2030</text>
      <text x="740" y="535">2032</text>
      <text x="1040" y="535">2034</text>
    </g>
  </g>

  <g transform="translate(815 184)">
    <rect width="265" height="66" rx="10" fill="#151515"/>
    <text x="132.5" y="28" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">3,000× in eight years</text>
    <text x="132.5" y="50" text-anchor="middle" fill="#d8d1c6" font-family="Arial, sans-serif" font-size="14">before the post-2035 cap</text>
  </g>

  <line x1="70" y1="580" x2="1130" y2="580" stroke="#c8c0b3"/>
  <text x="70" y="615" fill="#5d5951" font-family="Arial, sans-serif" font-size="15">Source: AI Futures Project, AI 2040: Plan A, pp. 20–21. “H100 equivalents” normalises different AI chips.</text>
  <text x="70" y="640" fill="#777168" font-family="Arial, sans-serif" font-size="14">The vertical scale is logarithmic: each grid step represents a tenfold increase.</text>
</svg>
