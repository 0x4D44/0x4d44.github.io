<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nine months from superhuman coding to artificial superintelligence in the AI 2027 race ending</title>
  <desc id="desc">A 2027 timeline marks superhuman coder in March, superhuman AI researcher in August, superintelligent AI researcher in November, and artificial superintelligence in December. The report's median takeoff forecast is slightly slower than the narrated race ending.</desc>
  <rect width="1200" height="675" rx="18" fill="#f4efe5"/>
  <text x="70" y="72" fill="#151515" font-family="Georgia, serif" font-size="38" font-weight="700">The decisive transition takes nine months</text>
  <text x="70" y="108" fill="#5d5951" font-family="Arial, sans-serif" font-size="18">AI 2027 race ending · capability milestones during 2027</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <line x1="125" y1="310" x2="1075" y2="310" stroke="#bdb5a8" stroke-width="8"/>
    <line x1="300" y1="310" x2="1050" y2="310" stroke="#b54136" stroke-width="8"/>
    <text x="675" y="375" fill="#9f3028" font-size="18" font-weight="700">9 MONTHS</text>
    <circle cx="125" cy="310" r="12" fill="#8a857c"/><text x="125" y="282" fill="#5d5951" font-size="16" font-weight="700">JAN</text>
    <circle cx="300" cy="310" r="19" fill="#315f75"/>
    <text x="300" y="210" fill="#315f75" font-size="19" font-weight="700">MARCH</text><text x="300" y="241" fill="#151515" font-size="23" font-weight="700">Superhuman coder</text><text x="300" y="267" fill="#5d5951" font-size="15">best coding work, fast and copied</text>
    <circle cx="675" cy="310" r="22" fill="#315f75"/>
    <text x="675" y="424" fill="#315f75" font-size="19" font-weight="700">AUGUST</text><text x="675" y="455" fill="#151515" font-size="23" font-weight="700">Superhuman AI researcher</text><text x="675" y="481" fill="#5d5951" font-size="15">better than the best human researcher</text>
    <circle cx="925" cy="310" r="27" fill="#b54136"/>
    <text x="925" y="210" fill="#9f3028" font-size="19" font-weight="700">NOVEMBER</text><text x="925" y="241" fill="#151515" font-size="22" font-weight="700">Superintelligent researcher</text><text x="925" y="267" fill="#5d5951" font-size="15">vastly beyond the best researchers</text>
    <circle cx="1050" cy="310" r="34" fill="#151515"/>
    <text x="1050" y="424" fill="#151515" font-size="19" font-weight="700">DECEMBER</text><text x="1050" y="455" fill="#151515" font-size="23" font-weight="700">ASI</text><text x="1050" y="481" fill="#5d5951" font-size="15">beyond humans across cognition</text>
  </g>
  <rect x="70" y="535" width="1060" height="64" rx="10" fill="#e7dfd2"/>
  <text x="600" y="562" text-anchor="middle" fill="#4e4942" font-family="Arial, sans-serif" font-size="16" font-weight="700">The technical supplement's conditional median reaches ASI in April 2028.</text>
  <text x="600" y="585" text-anchor="middle" fill="#5d5951" font-family="Arial, sans-serif" font-size="14">Its 80% interval stretches from June 2027 beyond 2100—far wider than the story's clean sequence.</text>
  <text x="600" y="646" text-anchor="middle" fill="#777168" font-family="Arial, sans-serif" font-size="14">Source: AI Futures Project, AI 2027 race ending and Takeoff Forecast, April 2025.</text>
</svg>
