<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Use AI 2027 as tripwires and Plan A as a playbook</title>
  <desc id="desc">Five measurable warning signs map to pre-agreed responses: research automation to independent measurement, insecure model weights to minimum security standards, an internal-public capability gap to evaluator access, opaque reasoning to deployment limits, and concentrated compute to a registry and verification system.</desc>
  <rect width="1200" height="675" rx="18" fill="#f4efe5"/>
  <text x="70" y="72" fill="#151515" font-family="Georgia, serif" font-size="38" font-weight="700">Replace dates with tripwires and pre-agreed actions</text>
  <text x="70" y="108" fill="#5d5951" font-family="Arial, sans-serif" font-size="18">The useful synthesis: AI 2027 detects acceleration; Plan A supplies institutional responses</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b54136"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <text x="275" y="160" text-anchor="middle" fill="#9f3028" font-size="19" font-weight="700">TRIPWIRE · OBSERVE</text>
    <text x="925" y="160" text-anchor="middle" fill="#315f75" font-size="19" font-weight="700">PLAYBOOK · ACT</text>
    <g>
      <rect x="70" y="190" width="430" height="66" rx="12" fill="#fffaf1" stroke="#d8d1c6"/><text x="95" y="218" fill="#151515" font-size="17" font-weight="700">AI R&amp;D multiplier rises</text><text x="95" y="241" fill="#5d5951" font-size="14">How much faster do agents make frontier research?</text>
      <line x1="515" y1="223" x2="675" y2="223" stroke="#b54136" stroke-width="4" marker-end="url(#a)"/>
      <rect x="700" y="190" width="430" height="66" rx="12" fill="#e5edf0" stroke="#b6cad3"/><text x="725" y="218" fill="#151515" font-size="17" font-weight="700">Independent measurement</text><text x="725" y="241" fill="#5d5951" font-size="14">Publish speedups and trigger staged controls.</text>
      <rect x="70" y="273" width="430" height="66" rx="12" fill="#fffaf1" stroke="#d8d1c6"/><text x="95" y="301" fill="#151515" font-size="17" font-weight="700">Frontier weights remain stealable</text><text x="95" y="324" fill="#5d5951" font-size="14">Can a state actor exfiltrate the leading model?</text>
      <line x1="515" y1="306" x2="675" y2="306" stroke="#b54136" stroke-width="4" marker-end="url(#a)"/>
      <rect x="700" y="273" width="430" height="66" rx="12" fill="#e5edf0" stroke="#b6cad3"/><text x="725" y="301" fill="#151515" font-size="17" font-weight="700">Minimum security before scaling</text><text x="725" y="324" fill="#5d5951" font-size="14">Harden access, segment systems, test theft resistance.</text>
      <rect x="70" y="356" width="430" height="66" rx="12" fill="#fffaf1" stroke="#d8d1c6"/><text x="95" y="384" fill="#151515" font-size="17" font-weight="700">Internal capability outruns public scrutiny</text><text x="95" y="407" fill="#5d5951" font-size="14">How large is the lab–public evaluation gap?</text>
      <line x1="515" y1="389" x2="675" y2="389" stroke="#b54136" stroke-width="4" marker-end="url(#a)"/>
      <rect x="700" y="356" width="430" height="66" rx="12" fill="#e5edf0" stroke="#b6cad3"/><text x="725" y="384" fill="#151515" font-size="17" font-weight="700">Trusted evaluator access</text><text x="725" y="407" fill="#5d5951" font-size="14">Give outsiders models, logs, tools and enough time.</text>
      <rect x="70" y="439" width="430" height="66" rx="12" fill="#fffaf1" stroke="#d8d1c6"/><text x="95" y="467" fill="#151515" font-size="17" font-weight="700">Reasoning becomes opaque</text><text x="95" y="490" fill="#5d5951" font-size="14">Can overseers tell honesty from performance?</text>
      <line x1="515" y1="472" x2="675" y2="472" stroke="#b54136" stroke-width="4" marker-end="url(#a)"/>
      <rect x="700" y="439" width="430" height="66" rx="12" fill="#e5edf0" stroke="#b6cad3"/><text x="725" y="467" fill="#151515" font-size="17" font-weight="700">No autonomous R&amp;D deployment</text><text x="725" y="490" fill="#5d5951" font-size="14">Pause the feedback loop until evidence improves.</text>
      <rect x="70" y="522" width="430" height="66" rx="12" fill="#fffaf1" stroke="#d8d1c6"/><text x="95" y="550" fill="#151515" font-size="17" font-weight="700">Compute concentrates and races</text><text x="95" y="573" fill="#5d5951" font-size="14">Who owns the chips, power and expansion option?</text>
      <line x1="515" y1="555" x2="675" y2="555" stroke="#b54136" stroke-width="4" marker-end="url(#a)"/>
      <rect x="700" y="522" width="430" height="66" rx="12" fill="#e5edf0" stroke="#b6cad3"/><text x="725" y="550" fill="#151515" font-size="17" font-weight="700">Registry, inspections and verification</text><text x="725" y="573" fill="#5d5951" font-size="14">Make restraint observable to competitors.</text>
    </g>
  </g>
  <text x="70" y="646" fill="#777168" font-family="Arial, sans-serif" font-size="14">Editorial synthesis based on the AI 2027 forecasts and AI 2040: Plan A. Thresholds should be set through public technical work.</text>
</svg>
