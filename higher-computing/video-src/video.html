<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let CUES = null;
  window.setup = async (cues) => {
    CUES = cues;
    await Promise.all(["700 30px 'Pixelify Sans'", "400 30px 'Pixelify Sans'", "700 30px 'HC Digits'", "400 30px 'Atkinson Hyperlegible'", "700 30px 'Atkinson Hyperlegible'", "400 30px 'JetBrains Mono'", "700 30px 'JetBrains Mono'"].map((f) => document.fonts.load(f)));
    return document.fonts.check("700 30px 'Pixelify Sans'");
  };
  window.frame = (T, q) => { renderFrame(ctx, CUES, T); return cv.toDataURL("image/jpeg", q || 0.9); };
  // preview: video.html?id=twos-complement&t=12
  const qs = new URLSearchParams(location.search);
  if (qs.get("id")) fetch("cues/" + qs.get("id") + ".json").then((r) => r.json()).then(async (c) => { await window.setup(c); renderFrame(ctx, CUES, +(qs.get("t") || 0)); });
</script>
</body></html>
