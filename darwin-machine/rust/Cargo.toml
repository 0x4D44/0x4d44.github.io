[workspace]
members = [
  "crates/darwin-core",
  "crates/darwin-wasm",
  "crates/darwin-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bincode = "1.3.3"
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
