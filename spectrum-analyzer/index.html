<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spectrum Analyser — a 1996 codebase, explained</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #07090a;
  --bg-elev:   #0c1112;
  --panel:     #11171a;
  --panel-2:   #161e22;
  --line:      #1f2a2f;
  --line-soft: #15201d;
  --ink:       #e9ece9;
  --ink-dim:   #9aa7a3;
  --ink-mute:  #5e6d68;
  --phos:      #5ef39a;   /* phosphor green */
  --phos-deep: #1fa667;
  --phos-glow: rgba(94,243,154,0.18);
  --amber:     #ffb84d;
  --amber-deep:#c97a18;
  --magenta:   #f06bd7;
  --cyan:      #6fd9f3;
  --red:       #ff6b6b;
  --grid:      rgba(94,243,154,0.06);

  --display: "Newsreader", Georgia, serif;
  --sans:    "Geist", system-ui, -apple-system, sans-serif;
  --mono:    "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* Subtle phosphor scanline + grid texture over the whole page */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% -10%, rgba(94,243,154,0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

main { position: relative; z-index: 1; }

/* ---------- typography helpers ---------- */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--phos);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  width: 8px; height: 8px;
  background: var(--phos);
  box-shadow: 0 0 12px var(--phos);
  border-radius: 50%;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: clamp(48px, 7vw, 108px); line-height: 0.95; }
h2 { font-size: clamp(32px, 4vw, 56px); line-height: 1.02; }
h3 { font-size: clamp(20px, 2vw, 28px); line-height: 1.15; }
p  { color: var(--ink-dim); max-width: 64ch; }
.lede { font-size: 19px; color: var(--ink); max-width: 60ch; }
em.serif { font-family: var(--display); font-style: italic; color: var(--ink); }
code, kbd, .mono { font-family: var(--mono); }
.k-phos { color: var(--phos); }
.k-amber { color: var(--amber); }
.k-magenta { color: var(--magenta); }
.k-cyan { color: var(--cyan); }
.k-red { color: var(--red); }

/* ---------- layout ---------- */
section {
  position: relative;
  padding: 120px 7vw;
  border-top: 1px solid var(--line);
}
section:first-of-type { border-top: 0; }
.wrap { max-width: 1320px; margin: 0 auto; }

.section-head {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 48px;
  align-items: start;
  margin-bottom: 56px;
}
@media (max-width: 800px) {
  .section-head { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  section { padding: 80px 24px; }
}
.section-head .num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: 0.14em;
}
.section-head .num b { color: var(--phos); font-weight: 500; }
.section-head h2 { max-width: 18ch; }

/* ---------- panel ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  position: relative;
}
.panel-label {
  position: absolute;
  top: -10px; left: 16px;
  background: var(--bg);
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-transform: uppercase;
}

/* ---------- header bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 7vw;
  background: rgba(7,9,10,0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.topbar .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.topbar .brand .led {
  width: 8px; height: 8px; background: var(--phos);
  box-shadow: 0 0 10px var(--phos);
  border-radius: 50%;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.topbar nav { display: flex; gap: 20px; }
.topbar nav a { color: var(--ink-dim); text-decoration: none; transition: color 0.15s; }
.topbar nav a:hover { color: var(--phos); }
@media (max-width: 700px) { .topbar nav { display: none; } }

/* ---------- hero ---------- */
.hero {
  padding-top: 64px;
  padding-bottom: 80px;
  min-height: 90vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero .meta-row {
  display: flex; gap: 28px; flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-mute);
  text-transform: uppercase;
  margin-bottom: 28px;
}
.hero .meta-row span b { color: var(--phos); font-weight: 500; }
.hero h1 { margin-top: 18px; }
.hero h1 .a { color: var(--phos); text-shadow: 0 0 22px var(--phos-glow); }
.hero h1 .b { font-family: var(--display); font-style: italic; color: var(--ink); }
.hero .blurb {
  margin-top: 28px;
  max-width: 60ch;
  font-size: 18px;
  color: var(--ink-dim);
}
.hero .scope-frame {
  margin-top: 56px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.hero .scope-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.hero .scope-top .dots { display: flex; gap: 6px; }
.hero .scope-top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.hero .scope-top .dot.live { background: var(--phos); box-shadow: 0 0 8px var(--phos); }
.hero canvas { display: block; width: 100%; height: 280px; }

/* ---------- stat strip ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: 56px;
}
@media (max-width: 800px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.stat .v {
  font-family: var(--display);
  font-size: clamp(34px, 4vw, 48px);
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1;
}
.stat .v .small {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink-mute);
  margin-left: 4px;
}
.stat .l {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: var(--ink-mute);
  text-transform: uppercase;
}

/* ---------- architecture diagram ---------- */
.arch-grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 40px;
}
@media (max-width: 1000px) { .arch-grid { grid-template-columns: minmax(0, 1fr); } }
.arch-svg {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
  position: relative;
  min-height: 540px;
}
.arch-inspector {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
  font-family: var(--mono);
  font-size: 13px;
  align-self: start;
  position: sticky; top: 80px;
}
.arch-inspector h4 {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--phos);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin: 0 0 14px 0;
  font-weight: 500;
}
.arch-inspector .title {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
}
.arch-inspector .role {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.arch-inspector .desc {
  color: var(--ink-dim);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.55;
}
.arch-inspector .src {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  font-size: 11px;
  color: var(--ink-mute);
}
.arch-inspector .src b { color: var(--phos); font-weight: 500; }

.arch-node {
  cursor: pointer;
  transition: opacity 0.15s;
}
.arch-node:hover .arch-rect,
.arch-node.active .arch-rect {
  stroke: var(--phos);
  filter: drop-shadow(0 0 8px var(--phos-glow));
}
.arch-node.active .arch-label { fill: var(--phos); }
.arch-rect { fill: var(--panel); stroke: var(--line); stroke-width: 1; transition: all 0.15s; }
.arch-label { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.arch-sub { fill: var(--ink-mute); font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; }
.arch-arrow { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-arrow.live { stroke: var(--phos-deep); stroke-dasharray: 4 4; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }

/* ---------- FFT demo ---------- */
.fft-demo {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 32px;
}
@media (max-width: 900px) { .fft-demo { grid-template-columns: minmax(0, 1fr); } }
/* Two control/plot splits are laid out with an inline style object, so only
   !important reaches them -- an inline style attribute outranks any selector. */
@media (max-width: 900px) { .fft-split { grid-template-columns: minmax(0, 1fr) !important; } }
.fft-controls {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}
.fft-controls .ctl-section + .ctl-section { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
.fft-controls h4 {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  margin: 0 0 14px 0;
}
.slider-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.slider-row .lbl {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 12px;
}
.slider-row .lbl .name { color: var(--ink-dim); }
.slider-row .lbl .val { color: var(--phos); }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--phos); cursor: pointer;
  box-shadow: 0 0 10px var(--phos-glow);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--phos); cursor: pointer; border: none;
}
.seg {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 3px;
}
.seg button {
  background: transparent;
  border: 0;
  color: var(--ink-dim);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 8px 4px;
  border-radius: 3px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.12s;
}
.seg button:hover { color: var(--ink); }
.seg button.on {
  background: var(--phos);
  color: #06120b;
}

.fft-plots {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
}
.plot-frame {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
  display: flex; flex-direction: column;
}
.plot-frame .ptitle {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 12px;
}
.plot-frame .ptitle b { color: var(--phos); font-weight: 500; }
.plot-frame canvas { width: 100%; height: 180px; display: block; }

/* ---------- stereo trick ---------- */
.stereo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  align-items: start;
}
@media (max-width: 900px) { .stereo-grid { grid-template-columns: minmax(0, 1fr); } }
.stereo-grid > div {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 28px;
}
.stereo-step {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 16px 0;
  border-top: 1px dashed var(--line);
}
.stereo-step:first-child { border-top: 0; padding-top: 0; }
.stereo-step .num {
  font-family: var(--display);
  font-size: 32px;
  color: var(--phos);
  line-height: 1; min-width: 36px;
}
.stereo-step .txt { font-size: 14.5px; color: var(--ink-dim); }
.stereo-step .txt b { color: var(--ink); font-weight: 500; }
.stereo-step .txt code { color: var(--amber); background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 12.5px; }

/* ---------- module cards ---------- */
.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.module {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
  transition: all 0.15s;
  cursor: default;
  position: relative;
}
.module:hover { border-color: var(--phos-deep); transform: translateY(-2px); }
.module .file {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--phos);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.module .title {
  font-family: var(--display);
  font-size: 18px;
  color: var(--ink);
  margin-bottom: 10px;
  line-height: 1.2;
}
.module .desc {
  font-size: 13.5px;
  color: var(--ink-dim);
  line-height: 1.5;
}
.module .meta {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex; gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.module .meta b { color: var(--ink-dim); font-weight: 500; }

/* ---------- colour map gallery ---------- */
.cmap-gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 900px) { .cmap-gallery { grid-template-columns: minmax(0, 1fr); } }
.cmap-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
.cmap-card .h {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.cmap-card .h .nm {
  font-family: var(--display); font-size: 22px; color: var(--ink);
}
.cmap-card .h .sub {
  font-family: var(--mono); font-size: 10px; color: var(--ink-mute);
  letter-spacing: 0.14em; text-transform: uppercase;
}
.cmap-card canvas {
  width: 100%; height: 120px; display: block; border-radius: 3px;
}
.cmap-card .strip {
  width: 100%; height: 18px;
  border-radius: 3px;
  margin-top: 10px;
}

/* ---------- timeline ---------- */
.timeline {
  position: relative;
  padding: 20px 0;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 12px; top: 0; bottom: 0;
  width: 1px;
  background: var(--line);
}
.tl-item {
  position: relative;
  padding-left: 48px;
  padding-bottom: 32px;
}
.tl-item::before {
  content: "";
  position: absolute; left: 6px; top: 8px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--ink-mute);
}
.tl-item.major::before {
  border-color: var(--phos);
  background: var(--phos);
  box-shadow: 0 0 12px var(--phos-glow);
}
.tl-item .date {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.tl-item .date b { color: var(--phos); font-weight: 500; }
.tl-item .vt {
  font-family: var(--display); font-size: 22px;
  color: var(--ink); margin-bottom: 8px;
}
.tl-item .body { color: var(--ink-dim); font-size: 14.5px; max-width: 60ch; }
.tl-item .body code { color: var(--amber); font-family: var(--mono); font-size: 12.5px; }

/* ---------- bug hunt ---------- */
.bug-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
@media (max-width: 900px) { .bug-grid { grid-template-columns: minmax(0, 1fr); } }
.bug {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
  position: relative;
}
.bug .severity {
  position: absolute; top: 18px; right: 18px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
}
.bug .severity.minor { background: rgba(255,184,77,0.14); color: var(--amber); }
.bug .severity.major { background: rgba(255,107,107,0.14); color: var(--red); }
.bug .severity.weird { background: rgba(111,217,243,0.14); color: var(--cyan); }
.bug h3 {
  font-family: var(--display); font-size: 22px; color: var(--ink);
  margin-bottom: 14px;
  padding-right: 70px;
}
.bug pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  padding: 14px 16px;
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-dim); line-height: 1.55;
  overflow-x: auto;
  margin: 0 0 14px 0;
}
.bug pre .hl { background: rgba(255,107,107,0.18); color: var(--red); padding: 1px 3px; border-radius: 2px; }
.bug pre .ok { color: var(--ink-mute); }
.bug pre .c  { color: var(--ink-mute); font-style: italic; }
.bug pre .k  { color: var(--phos); }
.bug pre .s  { color: var(--amber); }
.bug .why { color: var(--ink-dim); font-size: 14px; }
.bug .why b { color: var(--ink); font-weight: 500; }

/* ---------- subsections (inside a section) ---------- */
.subsection { margin-top: 88px; }
.subsection:first-of-type { margin-top: 16px; }
.sub-head {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 24px;
  align-items: baseline;
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--line);
}
@media (max-width: 700px) {
  .sub-head { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
.sub-head .sn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--phos);
}
.sub-head h3 {
  font-family: var(--display);
  font-size: clamp(22px, 2.4vw, 32px);
  color: var(--ink);
  letter-spacing: -0.01em;
  font-weight: 500;
}
.sub-body { color: var(--ink-dim); font-size: 15.5px; max-width: 66ch; }
.sub-body p { font-size: 15.5px; max-width: 66ch; }
.sub-body p + p { margin-top: 12px; }
.sub-body code { color: var(--amber); font-family: var(--mono); font-size: 12.5px; background: var(--bg); padding: 1px 5px; border-radius: 3px; }
.sub-body b { color: var(--ink); font-weight: 500; }

.callout {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 2px solid var(--phos);
  border-radius: 4px;
  padding: 20px 24px;
  margin-top: 24px;
  font-size: 14.5px;
  color: var(--ink-dim);
  max-width: 70ch;
}
.callout b { color: var(--ink); font-weight: 500; }
.callout code { color: var(--amber); font-family: var(--mono); font-size: 12.5px; }

/* big-O cost table */
.cost-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 32px;
  align-items: start;
  margin-top: 24px;
}
@media (max-width: 900px) { .cost-grid { grid-template-columns: minmax(0, 1fr); } }
.cost-chart {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
.cost-chart canvas { width: 100%; height: 280px; display: block; }
.cost-chart .legend {
  display: flex; gap: 18px; margin-top: 12px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-mute);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.cost-chart .legend .sw { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
.cost-table {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
  font-family: var(--mono);
  font-size: 12.5px;
}
.cost-table table { width: 100%; border-collapse: collapse; }
.cost-table th, .cost-table td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.cost-table th { color: var(--ink-mute); font-weight: 400; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.cost-table td:first-child, .cost-table th:first-child { text-align: left; }
.cost-table td .dim { color: var(--ink-mute); }
.cost-table td .phos { color: var(--phos); }
.cost-table tr:last-child td { border-bottom: 0; }

/* budget panel */
.budget-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 24px;
}
@media (max-width: 800px) { .budget-grid { grid-template-columns: minmax(0, 1fr); } }
.budget-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}
.budget-card .head {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 12px;
}
.budget-card .big {
  font-family: var(--display);
  font-size: 38px;
  color: var(--phos);
  line-height: 1;
  letter-spacing: -0.02em;
}
.budget-card .small {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 4px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.budget-card ul { color: var(--ink-dim); font-size: 14px; margin: 14px 0 0 0; padding-left: 18px; }
.budget-card ul li { margin-bottom: 6px; }
.budget-card ul li b { color: var(--ink); font-weight: 500; }

/* fixed point split */
.fp-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 24px;
}
@media (max-width: 800px) { .fp-split { grid-template-columns: minmax(0, 1fr); } }
.fp-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}
.fp-card .h {
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 12px;
}
.fp-card pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  padding: 14px 16px; font-family: var(--mono); font-size: 12px;
  color: var(--ink-dim); line-height: 1.55; overflow-x: auto; margin: 0;
}
.fp-card pre .c { color: var(--ink-mute); font-style: italic; }
.fp-card pre .k { color: var(--phos); }
.fp-card pre .n { color: var(--amber); }
.fp-card pre .hl { background: rgba(94,243,154,0.10); padding: 1px 3px; border-radius: 2px; }

/* aliasing demo */
.alias-grid {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 24px;
  margin-top: 24px;
}
@media (max-width: 900px) { .alias-grid { grid-template-columns: minmax(0, 1fr); } }
.alias-controls {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}
.alias-plot {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
.alias-plot canvas { width: 100%; height: 260px; display: block; }
.alias-readout {
  display: flex; gap: 24px;
  margin-top: 16px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.alias-readout b { color: var(--phos); font-weight: 500; font-size: 13px; letter-spacing: 0.05em; }
.alias-readout .aliased b { color: var(--red); }

/* window gallery */
.win-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-top: 24px;
}
@media (max-width: 900px) { .win-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.win-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
}
.win-card .nm {
  font-family: var(--display); font-size: 18px; color: var(--ink);
  margin-bottom: 2px;
}
.win-card .sub {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  color: var(--ink-mute); text-transform: uppercase;
  margin-bottom: 12px;
}
.win-card canvas { width: 100%; display: block; }
.win-card .ws { height: 70px; }
.win-card .wf { height: 90px; margin-top: 6px; }
.win-card .meta {
  display: flex; justify-content: space-between;
  margin-top: 8px;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-mute); letter-spacing: 0.1em;
}
.win-card .meta b { color: var(--phos); font-weight: 500; }

/* ---------- prose blocks ---------- */
.prose-2col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 56px;
}
@media (max-width: 800px) { .prose-2col { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.prose-2col h3 { margin-bottom: 14px; color: var(--ink); }
.prose-2col p { color: var(--ink-dim); font-size: 15.5px; }
.prose-2col ul { margin: 0; padding-left: 18px; color: var(--ink-dim); font-size: 15px; }
.prose-2col ul li { margin-bottom: 8px; }
.prose-2col ul li b { color: var(--ink); font-weight: 500; }

/* ---------- footer ---------- */
footer {
  padding: 80px 7vw 60px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
footer b { color: var(--phos); font-weight: 500; }
